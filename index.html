            if (ball.hasEnteredFrame && ball.y < radiusPx) { ball.y = radiusPx; ball.vy = -ball.vy * cfg.ballBounciness; }

            // Joint-segment collision (3 capsules per entity) + the
            // proximity auto-trigger, once per spawned entity — this ball
            // reacts to/can trigger every entity independently, same
            // rules as before, now just run once per active ball.
            //
            // SWEPT: tests the ball's whole PATH this tick (prevBallX,Y ->
            // ball.x,y) against each finger capsule, via closestPointsBetweenSegments,
            // not just its single end-of-tick point — a fast ball can
            // otherwise jump clean over a thin capsule between 2 ticks and
            // never register as "inside" at either sampled instant
            // (tunneling), reported directly ("if the ball is moving at a
            // high velocity, even if it triggers the animation, the
            // animation is not fast enough to flick the ball"). Each
            // resolved hit updates ball.x/y in place, so a later segment's
            // own sweep this same tick starts from prevBallX/Y (unchanged)
            // through the ball's now-updated position — same "resolved
            // sequentially, not a rigorous simultaneous solve" scope this
            // collision system already had before this change.
            entities.forEach(entity => {
                if (entity.jointWorld) {
                    // Computed once per entity per tick (not once per
                    // segment below) — it's the same value for all 3
                    // segments of a given entity this tick, no reason to
                    // recompute it 3x.
                    const flickIntensityMult = entityFlickIntensityMultiplier(entity);
                    const segments = [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']];
                    segments.forEach(([aKey, bKey]) => {
                        const a = entity.jointWorld[aKey], b = entity.jointWorld[bKey];
                        if (!a || !b) return;
                        const thicknessPx = vmin * (cfg.jointThickness / 100); // fixed — never varies by frame/speed, per explicit instruction
                        const minDist = thicknessPx / 2 + radiusPx;
                        const cp = closestPointsBetweenSegments(prevBallX, prevBallY, ball.x, ball.y, a.x, a.y, b.x, b.y);
                        if (cp.distSq >= minDist * minDist) return;

                        const speedA = entity.jointSpeed[aKey] ?? 0, speedB = entity.jointSpeed[bKey] ?? 0;
                        const speed = speedA + (speedB - speedA) * cp.t; // still drives the collision KICK below, no longer the circle's size
                        const dist = Math.sqrt(cp.distSq);
                        const dx = cp.c1x - cp.c2x, dy = cp.c1y - cp.c2y;
                        const nx = dist > 0.0001 ? dx / dist : 0, ny = dist > 0.0001 ? dy / dist : -1;
                        const overlap = minDist - dist;
                        // Snap to the point ALONG THE BALL'S OWN PATH where
                        // it first came within minDist (cp.c1x/y, at
                        // parameter cp.s) rather than its raw end-of-tick
                        // position — this is what actually stops tunneling:
                        // even when the ball's final position had already
                        // passed clean through the capsule, cp.c1 is never
                        // further through than the real first contact.
                        ball.x = cp.c1x + nx * overlap;
                        ball.y = cp.c1y + ny * overlap;

                        // Reflect the ball's OWN incoming velocity off this
                        // segment's normal — same physics the wall bounce
                        // already applies (`vx = -vx * bounciness`), just
                        // generalized to an arbitrary normal direction
                        // instead of a fixed horizontal/vertical axis. This
                        // was the actual missing piece behind a direct
                        // report ("sometimes... the ball gets stuck to the
                        // hand" at high speed/certain angles): without it,
                        // only the segment's OWN motion could ever push the
                        // ball away (the kick below) — a fast ball hitting a
                        // momentarily slow-moving segment had its position
                        // corrected every tick but its own velocity left
                        // completely untouched, so gravity/momentum drove it
                        // right back into the same spot next tick,
                        // indefinitely. Standard velocity-reflection formula
                        // (v' = v - (1+e)(v·n)n), only applied while the
                        // ball is actually moving INTO the surface
                        // (incomingDotNormal < 0) — a ball already moving
                        // away (e.g. just kicked out by a previous segment
                        // this same tick) isn't reflected a second time.
                        // Reuses Ball Bounciness rather than a new slider —
                        // the same "how much of the ball's own energy
                        // survives a bounce" concept the wall collision
                        // already uses. The segment-motion kick (still
                        // added on top afterward, unchanged) is a separate,
                        // additional impulse from the flick itself, not a
                        // substitute for this reflection.
                        const incomingDotNormal = ball.vx * nx + ball.vy * ny;
                        if (incomingDotNormal < 0) {
                            const reflectScale = (1 + cfg.ballBounciness) * incomingDotNormal;
                            ball.vx -= reflectScale * nx;
                            ball.vy -= reflectScale * ny;
                        }
                        ball.vx += nx * speed * cfg.collisionIntensity * flickIntensityMult;
                        ball.vy += ny * speed * cfg.collisionIntensity * flickIntensityMult;
                    });
                }

                // Auto-trigger: a ball crossing INTO this entity's own
                // reachable zone (see ballInFlickTriggerZone's own
                // comment) starts ITS sequence, without requiring a
                // click — manual click-to-flick was retired entirely once
                // clicking became the spawn-placement gesture (see the
                // canvas pointerdown handler below). Accumulated across
                // every active ball this tick (anyBallInZone), rising-edge
                // applied once per entity below, after this forEach.
                if (ballInFlickTriggerZone(ball, entity.directionKey, entityRotationRad(entity), entity.x, entity.y)) {
                    anyBallInZone.set(entity, true);
                }
            });

            // Air Drag — exponential velocity decay, applied ONCE per
            // tick after every velocity change above (same "apply once,
            // after everything else" placement Ball Max Speed already
            // uses just below, for the same reason: consistent regardless
            // of which source changed the velocity this tick). 0 (default)
            // is an exact no-op (Math.pow(1,dt)=1), so existing behavior
            // is unchanged unless this is explicitly turned up.
            if (cfg.ballDrag > 0) {
                const dragRetain = Math.pow(1 - cfg.ballDrag, dt);
                ball.vx *= dragRetain;
                ball.vy *= dragRetain;
            }

            // Ball Max Speed — a hard cap on the ball's own speed, applied
            // ONCE per tick after every velocity change above (gravity,
            // wall bounce, the segment-reflection fix, AND the collision
            // kick) so it consistently caps the result regardless of which
            // of those pushed it over, rather than only capping one source.
            // Scales with vmin like every other ball quantity in this file
            // (ballGravity/ballRadius) so it stays proportionally correct
            // across viewport sizes.
            const maxSpeedPx = vmin * (cfg.ballMaxSpeed / 100);
            const speedSq = ball.vx * ball.vx + ball.vy * ball.vy;
            if (speedSq > maxSpeedPx * maxSpeedPx) {
                const scale = maxSpeedPx / Math.sqrt(speedSq);
                ball.vx *= scale;
                ball.vy *= scale;
            }

            // Fully below the bottom edge — gone, start THIS generator's
            // own respawn timer (it'll spawn again at its own spawnX/Y —
            // or the shared default spot, if this is the default
            // generator — once the countdown above elapses).
            if (ball.y - radiusPx > h) {
                gen.ball = null;
                gen.respawnCountdown = cfg.ballRespawnRate;
            }
        });

        // Rising-edge trigger, once per entity, using the OR across every
        // ball active this tick — same semantics as the original single-
        // ball version (a ball simply sitting in the zone doesn't keep
        // re-triggering, and !entity.playing keeps a ball that entered
        // mid-flick from double-triggering the instant that flick ends
        // while it's still sitting there), generalized to "any ball" in
        // place of "the one ball that used to be the only possibility."
        entities.forEach(entity => {
            const inTriggerZone = anyBallInZone.get(entity) || false;
            if (inTriggerZone && !entity.wasInFlickTriggerZone && !entity.playing) triggerFlick(entity);
            entity.wasInFlickTriggerZone = inTriggerZone;
        });
    }

    // ----------------------------------------------------------------
    // Canvas + mouse tracking
    // ----------------------------------------------------------------
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    // Capped at 2, not the raw window.devicePixelRatio — a real, reported
    // mobile performance issue ("placing, rotating, moving... very very
    // laggy"): many phones report a DPR of 3 (some higher), which makes
    // the canvas's own BACKING STORE 9x more pixels than DPR 1 for the
    // exact same on-screen CSS size (3x width * 3x height) — every single
    // fillRect/drawImage this file does fills into that 9x larger buffer.
    // Capping to 2 (4x, not 9x) is a well-established mobile canvas
    // performance practice; visually near-indistinguishable from
    // uncapped on a real device (2x is already a sharp "retina" density),
    // especially for soft-edged sprite art like this project's own. Used
    // both here and in update()'s own self-healing size-mismatch check
    // below — those 2 MUST agree, or the self-heal check would see a
    // permanent "wrong size" mismatch against an uncapped comparison and
    // call resizeCanvas() (which reallocates the whole backing store)
    // every single frame, a far worse perf problem than the one this
    // exists to fix.
    function effectiveDpr() {
        return Math.min(window.devicePixelRatio || 1, 2);
    }
    function resizeCanvas() {
        const dpr = effectiveDpr();
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Also hidden while placing balls (the ball-shaped preview drawn in
    // render() IS the cursor at that point, per explicit request: "my
    // cursor becomes the ball geometry") — a single shared function so
    // toggling Hide OS Cursor mid-placement can't clobber that state.
    function applyCursorVisibility() {
        canvas.classList.toggle('cursor-hidden', cfg.hideCursor || ballPlacementMode);
    }
    applyCursorVisibility();

    // mouseX/mouseY only ever come from a real pointermove event now (no
    // longer re-derived from window.innerWidth/innerHeight as a fallback —
    // there's no continuously-following entity left to re-center). hasMouse
    // just gates render()'s own live spawn-preview line, so it doesn't draw
    // toward a stale (0,0) before the very first real mouse movement.
    let mouseX = 0, mouseY = 0;
    let hasMouse = false;
    // Base/end-point drag state (Stop-mode entity adjustment, below) — the
    // entity currently being dragged and which of its 2 points ('base' |
    // 'end'), or null when nothing's being dragged. Lives here (not with
    // pendingSpawnStart, further down) specifically so the pointermove
    // handler right below — the only place drag position updates actually
    // happen — can read it directly.
    let draggingEntity = null;
    let draggingPoint = null;
    window.addEventListener('pointermove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        hasMouse = true;
        if (draggingEntity) {
            if (draggingPoint === 'base') {
                // Translate the whole entity — both points move together,
                // so the line's own angle (and therefore rotation/
                // direction) stays exactly what it was. This is the "move"
                // half of "move and rotate and adjust."
                const dx = mouseX - draggingEntity.x, dy = mouseY - draggingEntity.y;
                draggingEntity.x = mouseX;
                draggingEntity.y = mouseY;
                draggingEntity.endX += dx;
                draggingEntity.endY += dy;
            } else {
                // Base point stays fixed; only the aim/end point moves —
                // the "rotate" half. Only directionKey needs updating here
                // (via the same bucketing spawnEntityFromLine() uses) —
                // rotation itself is no longer stored, it's recomputed
                // live from endX/endY every time it's needed (see
                // entityRotationRad()), so there's nothing else to set.
                draggingEntity.endX = mouseX;
                draggingEntity.endY = mouseY;
                const dist = Math.hypot(draggingEntity.endX - draggingEntity.x, draggingEntity.endY - draggingEntity.y);
                if (dist > 0.0001) {
                    const lineAngle = mouseAngleFromCenter(draggingEntity.endX, draggingEntity.endY, draggingEntity.x, draggingEntity.y);
                    const dirIndex = directionIndexForAngle(lineAngle);
                    const directionKey = DIRECTIONS[dirIndex].key;
                    if (directionKey !== draggingEntity.directionKey) {
                        draggingEntity.directionKey = directionKey;
                        ensureDirectionLoaded(directionKey);
                    }
                }
            }
        }
    });
    window.addEventListener('pointerup', (e) => {
        draggingEntity = null;
        draggingPoint = null;

        // Tap-and-drag placement (mobile) — an alternative to the 2-
        // SEPARATE-taps gesture in the pointerdown handler below, not a
        // replacement for it: press for the 1st point, drag, release for
        // the 2nd. Only completes when this release is the SAME press
        // that started the current pendingSpawnStart (matched by
        // pointerId — so an unrelated pointerup, e.g. a 2nd finger,
        // can't accidentally finish it) AND moved a real minimum
        // distance (MIN_DRAG_PLACEMENT_DISTANCE) from the start — a
        // plain tap-then-release (near-zero distance, including ordinary
        // touch jitter) must NOT auto-complete, or every 1st tap of the
        // existing 2-tap flow would immediately finish a degenerate
        // placement on its own release instead of waiting for a real 2nd
        // tap.
        if (pendingSpawnStart && (!running || cfg.allowPlacementWhileRunning) && e.pointerId === spawnPointerId) {
            const dist = Math.hypot(e.clientX - pendingSpawnStart.x, e.clientY - pendingSpawnStart.y);
            if (dist > MIN_DRAG_PLACEMENT_DISTANCE) {
                spawnEntityFromLine(pendingSpawnStart.x, pendingSpawnStart.y, e.clientX, e.clientY);
                pendingSpawnStart = null;
                spawnPointerId = null;
            }
        }
    });
    // A cancelled pointer (OS interruption, an edge-swipe navigation
    // gesture, etc.) never fires pointerup — without this, a cancelled
    // press-drag would leave pendingSpawnStart/spawnPointerId stuck,
    // silently blocking every future placement (since the pointerdown
    // handler above only starts a new spawn when pendingSpawnStart is
    // already null) until an unrelated tap happened to land far enough
    // away to complete the stale gesture. Treat a cancel the same as an
    // abandoned gesture, for both drag types.
    window.addEventListener('pointercancel', (e) => {
        draggingEntity = null;
        draggingPoint = null;
        if (e.pointerId === spawnPointerId) {
            pendingSpawnStart = null;
            spawnPointerId = null;
        }
    });

    // ----------------------------------------------------------------
    // Angle math. "Up" (0°) = directly above a given pivot point; angle
    // increases CLOCKWISE. Originally verified (back when there was a
    // single mouse-anchored entity) against 2 concrete cases: mouse
    // directly above the viewport center -> 0° (bucket "Behind"); mouse
    // directly right of center -> 90° (bucket "Side Thumb"). Reused as-is
    // for the spawn-placement line's own angle below — mouseAngleFromCenter(end,
    // start) gives exactly "the angle of `end` as seen from `start`",
    // which is exactly a spawned entity's own aim direction, no change to
    // the function itself needed.
    // ----------------------------------------------------------------
    function mouseAngleFromCenter(mx, my, cx, cy) {
        const dx = mx - cx, dy = my - cy;
        let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
        return (deg + 360) % 360;
    }
    // 8 sectors of 45°, centered on 0/45/90/.../315 — matches the exact
    // boundaries given (-22.5..22.5 = index 0, etc). cfg.angleOffset
    // rotates the whole wheel as one calibration knob rather than 8
    // independent (and easily inconsistent) per-boundary sliders, since
    // the sectors are rigidly uniform by spec.
    function directionIndexForAngle(angleDeg) {
        const shifted = (angleDeg + cfg.angleOffset + 22.5 + 3600) % 360;
        return Math.floor(shifted / 45) % 8;
    }

    // angleLerp/expSmoothFactor are still used elsewhere (expSmoothFactor
    // by the collision-speed smoothing in updateBallAndCollision), but
    // angleLerp itself is currently UNUSED — it only ever eased a single
    // entity's rotation toward a continuously-moving mouse target, which
    // no longer exists now that entities are spawned once and never move.
    // Left defined (harmless, cheap) rather than deleted, in case a future
    // spawn-in ease transition wants it — flagged here rather than removed
    // silently.
    function angleLerp(current, target, factor) {
        let delta = ((target - current + 540) % 360) - 180;
        return current + delta * factor;
    }
    function expSmoothFactor(smoothing, dt) {
        if (smoothing >= 1) return 1;
        return 1 - Math.pow(1 - smoothing, dt * 60);
    }

    // ----------------------------------------------------------------
    // Entities: no longer a single mouse-anchored entity — the animation
    // is invisible until placed. Each entity is spawned via a 2-click
    // gesture (see the pointerdown handler below) and then permanently
    // fixed: its position, rotation, and direction bucket never change
    // again, only its own play state (idle vs. playing a flick, driven
    // solely by the ball-proximity trigger — manual click-to-flick was
    // retired once clicking became the spawn gesture, per explicit
    // request). cfg.entityScale/clickAnimSpeed/peakHoldFrames and the
    // per-direction rotation-offset map all stay GLOBAL, shared by every
    // entity — only position/rotation/direction/play-state are per-entity.
    // ----------------------------------------------------------------
    let entities = [];
    // Named, saved entity arrangements ("scenes") — per explicit request
    // ("if i placed entities very carefully and i like it, i want to be
    // able to save it and come back to it"). Keyed by scene name; each
    // value is just an array of {x,y,endX,endY} — the same 4 numbers
    // spawnEntityFromLine() itself takes, deliberately NOT the full
    // entity object (playing/jointWorld/etc. are transient runtime state,
    // meaningless to persist and cheap to re-derive on load). Saved as
    // part of the SAME git-tracked dev-panel-settings.json file (see
    // captureFullDevPanelState()'s own `scenes` field) rather than a
    // separate Vercel endpoint/file — reuses the existing 3-tier Save
    // Settings pipeline with zero server-side changes, per explicit
    // choice over a from-scratch persistence layer.
    let scenes = {};
    const FLICK_BASE_FPS = 12;

    // The first click of a pending 2-click placement — {x,y} while
    // awaiting the second click, null otherwise. Purely UI/interaction
    // state, not simulation — updated directly by the pointerdown handler
    // (not inside step()), read by render() to draw the live aim-preview
    // line.
    let pendingSpawnStart = null;
    // Which pointer (touch/mouse) started the CURRENT pendingSpawnStart —
    // lets the pointerup handler recognize "this is the same press being
    // released" for tap-and-drag placement (see that handler's own
    // comment), without also mistaking an unrelated pointerup (e.g. a
    // 2nd finger) for the drag's own release.
    let spawnPointerId = null;
    // Minimum real movement (px) between press and release for a
    // tap-and-drag release to count as "the 2nd point" rather than an
    // ordinary tap's own natural touch jitter — per explicit request
    // ("on mobile... click for the first point, then drag to the second
    // point"), added ALONGSIDE the existing 2-separate-taps gesture, not
    // in place of it. A plain tap-then-release (dist ~0) must keep
    // leaving pendingSpawnStart active for a real 2nd tap, exactly like
    // before, or every 1st tap of the existing flow would immediately
    // "complete" a degenerate placement on its own release.
    const MIN_DRAG_PLACEMENT_DISTANCE = 24;

    // Shared by a real click AND the ball-proximity auto-trigger
    // (ballInFlickTriggerZone, checked inside updateBallAndCollision) —
    // both just start the same forward+reverse play sequence on the given
    // entity, for whichever direction it was spawned with.
    function triggerFlick(entity) {
        entity.playing = true;
        entity.playFrameIndex = 0;
        entity.playFrameAccum = 0;
        entity.playSequenceFrozen = ensureDirectionLoaded(entity.directionKey).playSequence;
    }

    // Win/Lose test sequences — per explicit request. Triggered by the
    // Win/Lose buttons (wired below), applied to EVERY currently-placed
    // entity at once ("every placed entity on screen will transition into
    // the appropriate animation sequence"), each using its own
    // directionKey's own win/lose asset set. Cancels any in-progress
    // normal flick on that entity first (winLoseType takes over the
    // entity's own rendering entirely — see render()'s own draw dispatch —
    // so the 2 states must never both be active at once).
    //
    // The state machine itself (advanced in step(), below) has 5 phases,
    // per the exact spec: "frames will be played sequentially until frame
    // _013 is reached[, held,] afterwhich it will finish the sequence of
    // frames[. At frame _24, held again], afterwhich the entire sequence
    // will be played in reverse without any in between frame holding":
    //   forward1  — frame index 0 (=_001) advancing up to 12 (=_013)
    //   holdFist  — frozen at index 12, for cfg.winLoseFistHoldDuration
    //   forward2  — continues from 12 up to 23 (=_024), no reset to 0
    //   holdFinal — frozen at index 23, for cfg.winLoseFinalHoldDuration
    //   reverse   — 23 back down to 0, continuously, no holding at 12 this
    //               time ("without any in between frame holding")
    // Sequence ends (winLoseType cleared, entity returns to its own normal
    // idle rendering) once reverse reaches index 0.
    function triggerWinLoseSequence(type) {
        entities.forEach(entity => {
            entity.playing = false;
            entity.playSequenceFrozen = null;
            entity.playFrameIndex = 0;
            entity.playFrameAccum = 0;
            entity.winLoseType = type;
            entity.winLosePhase = 'forward1';
            entity.winLoseFrameAccum = 0;
            entity.winLoseHoldRemaining = 0;
            ensureWinLoseLoaded(entity.directionKey, type);
        });
    }

    // Spawns a new entity anchored at (startX,startY) — the FIRST click —
    // pointing along the line toward (endX,endY) — the SECOND click — per
    // explicit spec ("click once, defining the start point, and click
    // again, defining the end point... spawned on screen" / confirmed via
    // AskUserQuestion: the start point is the entity's fixed anchor).
    // lineAngle reuses mouseAngleFromCenter() by treating the START point
    // as the pivot and the END point as "the point whose angle we want" —
    // this is literally "the angle of end as seen from start", i.e. the
    // start->end direction, in the same 0=up/clockwise convention the
    // rest of this file already uses. Rotation is lineAngle DIRECTLY (no
    // +180, unlike the old mouse-anchored entity's own rotation formula)
    // since the entity should point THE SAME way the line points (toward
    // where the user aimed), not the opposite way (the old model pointed
    // BACK toward a fixed center from a moving mouse — a genuinely
    // different geometric relationship). Verified with the same kind of
    // concrete case the old formula was checked against: end directly
    // above start (dx=0, dy<0) -> lineAngle=0° -> rotationRad=0 -> the
    // sprite's own already-"pointing up" art needs no rotation at all to
    // point at an end point that's directly above where it's anchored —
    // correct.
    function spawnEntityFromLine(startX, startY, endX, endY) {
        const lineAngle = mouseAngleFromCenter(endX, endY, startX, startY);
        const dirIndex = directionIndexForAngle(lineAngle);
        const directionKey = DIRECTIONS[dirIndex].key;
        entities.push({
            // endX/endY (the 2nd click that originally set the aim
            // direction) are kept around, not just baked into a frozen
            // rotation value — Stop-mode's 2 draggable dots need a real
            // screen point to render/hit-test the "end" handle at, AND
            // (per explicit request) an already-placed entity's rotation
            // must keep tracking a LIVE dev-panel change to Hand Rotation
            // Offset, not just whatever offset happened to be set at spawn
            // time. See entityRotationRad() below — rotationRad is
            // deliberately NOT stored on the entity at all, only
            // recomputed from endX/endY + the CURRENT cfg offset every
            // time it's needed.
            x: startX, y: startY, endX, endY, directionKey,
            playing: false, playFrameIndex: 0, playFrameAccum: 0, playSequenceFrozen: null,
            wasInFlickTriggerZone: false, prevJointLocal: null, smoothedJointSpeed: {},
            jointWorld: null, jointSpeed: {},
            // Win/Lose test-sequence state — see triggerWinLoseSequence()'s
            // own comment for the full state machine this drives.
            winLoseType: null, winLosePhase: null, winLoseFrameAccum: 0, winLoseHoldRemaining: 0,
        });
        ensureDirectionLoaded(directionKey);
        // Prefetch this direction's own Win/Lose frames right away too —
        // not waiting for an actual Win/Lose click to start those 2x24
        // fetches — so the network has a head start before the button is
        // ever pressed. Real, reported symptom this reduces the odds of
        // hitting at all ("on a hard refresh, the first time i hit Win
        // and Lose... they each flash in succession" — the render-side
        // idle-frame fallback, see render()'s own comment, is what
        // actually eliminates the visible flash even on a cold cache;
        // this prefetch just makes a cold cache less likely in the first
        // place for the common case of placing entities, looking them
        // over, THEN clicking Win/Lose).
        ensureWinLoseLoaded(directionKey, 'win');
        ensureWinLoseLoaded(directionKey, 'lose');
    }

    // Recomputes an entity's current rotation LIVE from its own fixed
    // endX/endY plus the direction's CURRENT cfg.entityRotationOffsetByDirection
    // value, rather than reading a value frozen at spawn/drag time — this
    // is what makes moving the Hand Rotation Offset slider immediately
    // rotate every already-placed entity of that direction, per explicit
    // request, with no extra bookkeeping needed when the slider changes.
    function entityRotationRad(entity) {
        const lineAngle = mouseAngleFromCenter(entity.endX, entity.endY, entity.x, entity.y);
        return (lineAngle + (cfg.entityRotationOffsetByDirection[entity.directionKey] || 0)) * Math.PI / 180;
    }

    // Flick Intensity Multiplier — per explicit request: a placement
    // line's own length (base to aim point) scales the flick's
    // collision-kick strength. Up to 100% of the direction's own VISIBLE
    // content height (at the CURRENT Entity Scale) -> 1x, exactly the
    // baseline/unchanged behavior; 100%-200% of that height -> linear ramp
    // 1x-2x; 200%+ -> capped at 2x ("the length of the line is capped at
    // 2X the length of the visible image... at full length, it will be
    // '2'"). Since the 1x-2x multiplier range maps onto the exact same
    // 1x-2x distance-ratio range, the mapping is simply the ratio itself,
    // clamped — no separate interpolation formula needed.
    // Takes raw (directionKey, startX, startY, endX, endY) rather than an
    // entity object so the SAME formula can preview a not-yet-placed
    // gesture (render()'s live spawn/drag preview, below) without
    // fabricating a fake entity — entityFlickIntensityMultiplier() (right
    // after this) is the thin per-entity wrapper real entities use.
    function flickIntensityMultiplierForLine(directionKey, startX, startY, endX, endY) {
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const size = vmin * (cfg.entityScale / 100);
        const refImg = ensureDirectionLoaded(directionKey).frames[0];
        const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
        const drawH = size * aspect;
        const visibleHeightPx = drawH * visibleBoundsForDirection(directionKey).heightFrac;
        if (visibleHeightPx <= 0) return 1;
        const distPx = Math.hypot(endX - startX, endY - startY);
        return Math.min(2, Math.max(1, distPx / visibleHeightPx));
    }
    // Recomputed live from the entity's own permanent endX/endY every time
    // it's needed (same pattern as entityRotationRad() just above), NOT
    // frozen at spawn time, so it also tracks a live Entity Scale change
    // and a Stop-mode end-dot drag, exactly like rotation already does.
    function entityFlickIntensityMultiplier(entity) {
        return flickIntensityMultiplierForLine(entity.directionKey, entity.x, entity.y, entity.endX, entity.endY);
    }

    // Stop-mode entity-adjustment: hit-tests every entity's own base (x,y)
    // and end (endX,endY) dot against a click point, nearest/topmost first
    // (iterated back-to-front so a later-spawned, visually-on-top entity's
    // dot wins a tie over an earlier one sitting underneath it). A fixed
    // px hit radius (not %vmin-scaled) — this is a tap-target size, which
    // per this workspace's own dev-panel convention (CLAUDE.md §12a) is
    // exactly the kind of value that should stay a constant real-world
    // size, not one that shrinks on a small viewport.
    const ENTITY_DOT_HIT_RADIUS = 14;
    function hitTestEntityDot(x, y) {
        for (let i = entities.length - 1; i >= 0; i--) {
            const entity = entities[i];
            if (Math.hypot(x - entity.x, y - entity.y) <= ENTITY_DOT_HIT_RADIUS) return { entity, point: 'base' };
            if (Math.hypot(x - entity.endX, y - entity.endY) <= ENTITY_DOT_HIT_RADIUS) return { entity, point: 'end' };
        }
        return null;
    }
    // Delete-mode hit-test for a placed ball spawn point — same tap-target
    // sizing idea as ENTITY_DOT_HIT_RADIUS, but at least as big as the
    // actual drawn ball-radius marker (see render()'s own spawn-point
    // drawing), so a large configured Ball Radius doesn't leave part of
    // its own visible marker outside its clickable area. Returns an
    // INDEX into ballSpawnPoints (splice-ready), or -1.
    function hitTestBallSpawnPoint(x, y) {
        const radiusPx = Math.min(window.innerWidth, window.innerHeight) * (cfg.ballRadius / 100);
        const hitRadius = Math.max(ENTITY_DOT_HIT_RADIUS, radiusPx);
        for (let i = ballSpawnPoints.length - 1; i >= 0; i--) {
            const p = ballSpawnPoints[i];
            if (Math.hypot(x - p.x, y - p.y) <= hitRadius) return i;
        }
        return -1;
    }

    // Per-direction offscreen canvas holding that direction's idle (frame 1)
    // pixels at full natural resolution — drawn ONCE per direction (cached),
    // used ONLY for delete-mode's per-pixel opacity check below. Safe to
    // draw at full res here (unlike the old, removed anchor-point scan):
    // this only ever runs on a rare, human-paced pointerdown click while
    // Delete mode is active, never per-frame/per-render, and a single
    // drawImage() with no pixel readback is cheap regardless of source size
    // — the actual getImageData() call below reads exactly 1 pixel.
    const directionAlphaCanvasCache = {};
    function getDirectionAlphaCanvas(directionKey) {
        if (directionAlphaCanvasCache[directionKey]) return directionAlphaCanvasCache[directionKey];
        const img = ensureDirectionLoaded(directionKey).frames[0];
        if (!img || !img.complete || img.naturalWidth === 0) return null;
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        const entry = { ctx, w: img.naturalWidth, h: img.naturalHeight };
        directionAlphaCanvasCache[directionKey] = entry;
        return entry;
    }
    // (localX,localY) is a point already known to fall within [left,left+drawW]
    // x [top,top+drawH] (the entity's own bounding box, in the SAME local
    // unrotated space hitTestEntitySprite computes) — maps it to a fraction
    // of that box, then to the source image's own natural pixel coordinates,
    // and reads that exact pixel's alpha. Same ALPHA_HIT_THRESHOLD=10
    // convention used elsewhere in this file for "is this pixel visible."
    function isOpaqueAtLocalPoint(directionKey, localX, localY, drawW, drawH, left, top) {
        const entry = getDirectionAlphaCanvas(directionKey);
        if (!entry) return true; // image not loaded yet — fall back permissively rather than never-deletable
        const u = (localX - left) / drawW, v = (localY - top) / drawH;
        const px = Math.min(entry.w - 1, Math.max(0, Math.floor(u * entry.w)));
        const py = Math.min(entry.h - 1, Math.max(0, Math.floor(v * entry.h)));
        const ALPHA_HIT_THRESHOLD = 10;
        return entry.ctx.getImageData(px, py, 1, 1).data[3] > ALPHA_HIT_THRESHOLD;
    }

    // Delete mode's own hit-test: a click within an entity's own drawn
    // bounding box (the SAME rectangle Show Hitbox draws — transform the
    // click point into the entity's local unrotated space, same rotate-by-
    // negative-angle trick used to invert the render/collision transform)
    // AND on an actually-VISIBLE (opaque) pixel of that entity's sprite —
    // a bounding-box-only test was found to delete the WRONG entity
    // whenever 2 entities' boxes overlapped (very common, given how much
    // transparent padding these sprites have) and a click landed in one
    // entity's transparent padding that happened to overlap a neighboring
    // entity's own visible hand. Checked topmost-rendered first; a
    // bounding-box hit on transparent padding falls through to check
    // entities further underneath, rather than stopping there.
    function hitTestEntitySprite(x, y) {
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const size = vmin * (cfg.entityScale / 100);
        for (let i = entities.length - 1; i >= 0; i--) {
            const entity = entities[i];
            const refImg = ensureDirectionLoaded(entity.directionKey).frames[0];
            const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
            const drawW = size, drawH = size * aspect;
            const vb = visibleBoundsForDirection(entity.directionKey);
            const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
            const rotationRad = entityRotationRad(entity);
            const dx = x - entity.x, dy = y - entity.y;
            const cos = Math.cos(-rotationRad), sin = Math.sin(-rotationRad);
            const localX = dx * cos - dy * sin;
            const localY = dx * sin + dy * cos;
            const left = -drawW * vb.centerX + xOffsetPx, top = -drawH * vb.bottomY;
            if (localX < left || localX > left + drawW || localY < top || localY > top + drawH) continue;
            if (isOpaqueAtLocalPoint(entity.directionKey, localX, localY, drawW, drawH, left, top)) return entity;
        }
        return null;
    }

    // Every click is part of a repeating 2-click cycle now (manual click-
    // to-flick is retired — see triggerFlick's own comment): the 1st click
    // anywhere records the pending start point; the 2nd click spawns a new
    // entity along that line and immediately starts listening for the
    // NEXT pair. A 2nd click landing exactly on the 1st (a degenerate,
    // zero-length line with no real angle) is ignored rather than spawning
    // a broken entity — stays in "awaiting end point" state instead of
    // silently resetting, so an accidental double-click-in-place doesn't
    // quietly eat the user's own start point.
    //
    // Gated to Stop mode only ("Animation entities can only be placed when
    // in Stop mode") — both the spawn gesture AND the base/end dot drag
    // (which also only ever renders its dots while stopped, see render()) —
    // UNLESS cfg.allowPlacementWhileRunning (a debug checkbox) is on, per
    // explicit request ("I can place entities regardless of the start and
    // stop state"). That override is scoped to NEW placement only —
    // Delete mode and dot-dragging an ALREADY-placed entity stay Stop-only
    // regardless of the checkbox, since neither was part of the request.
    canvas.addEventListener('pointerdown', (e) => {
        const x = e.clientX, y = e.clientY;

        // Delete mode takes priority over placement/dragging entirely —
        // never starts a spawn gesture or a dot drag while active. Always
        // Stop-only, not affected by allowPlacementWhileRunning. Checks
        // entities first, then ball spawn points (per explicit request:
        // "the delete button also works for these balls") — either one a
        // click lands on gets removed; only one at a time (an entity click
        // never also happens to remove an unrelated spawn point).
        if (deleteMode) {
            if (running) return;
            const hitEntity = hitTestEntitySprite(x, y);
            if (hitEntity) { entities = entities.filter(en => en !== hitEntity); return; }
            const hitPointIndex = hitTestBallSpawnPoint(x, y);
            if (hitPointIndex !== -1) ballSpawnPoints.splice(hitPointIndex, 1);
            return;
        }

        // Ball-placement mode — every click adds a new spawn point; stays
        // active for repeated clicks (per explicit request: "as many balls
        // as i want"), only exited by pressing the Ball button again.
        // Stop-only, same as entity placement/Delete — allowPlacementWhileRunning
        // doesn't apply here since it isn't part of that explicit request.
        if (ballPlacementMode) {
            if (running) return;
            ballSpawnPoints.push({ x, y });
            return;
        }

        if (running && !cfg.allowPlacementWhileRunning) return;

        if (!pendingSpawnStart) {
            // Dot-dragging an existing entity is always Stop-only too —
            // only skip the hit-test (never start a drag) while running,
            // regardless of the checkbox, so a new placement can still
            // start below.
            const hit = running ? null : hitTestEntityDot(x, y);
            if (hit) {
                draggingEntity = hit.entity;
                draggingPoint = hit.point;
                return;
            }
            pendingSpawnStart = { x, y };
            spawnPointerId = e.pointerId;
        } else if (Math.hypot(x - pendingSpawnStart.x, y - pendingSpawnStart.y) > 0.0001) {
            spawnEntityFromLine(pendingSpawnStart.x, pendingSpawnStart.y, x, y);
            pendingSpawnStart = null;
            spawnPointerId = null;
        }
    });

    // ----------------------------------------------------------------
    // Start/Stop — Start lets balls spawn and fall (updateBallAndCollision's
    // own `running` check, above); Stop halts that AND clears whatever
    // ball is currently on screen immediately (not just letting it finish
    // falling out the bottom on its own).
    // ----------------------------------------------------------------
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const ballBtn = document.getElementById('ballBtn');
    function setRunning(next) {
        running = next;
        if (!running) {
            // Clear every active ball immediately (not just letting each
            // one finish falling out the bottom on its own) — same
            // behavior as before, generalized across every generator.
            ballGenerators.forEach(gen => { gen.ball = null; gen.respawnCountdown = 0; });
        } else {
            setDeleteMode(false); // starting has nothing to delete/place anyway
            setBallPlacementMode(false); // ditto — nowhere to place a spawn point while running
            // Rebuilt fresh from ballSpawnPoints every Start — spawn
            // points can't change while running (placement is Stop-only),
            // so this is the one moment that matters.
            rebuildBallGenerators();
        }
        startBtn.disabled = running;
        stopBtn.disabled = !running;
        deleteBtn.disabled = running;
        ballBtn.disabled = running;
    }
    // Delete mode — toggled independently of Start/Stop's own running
    // state, but only meaningful while stopped (deleteBtn is disabled by
    // setRunning above the same way startBtn/stopBtn are). Turning it on
    // cancels any in-progress spawn/drag/ball-placement gesture so the 4
    // modes never mix.
    function setDeleteMode(next) {
        deleteMode = next;
        if (deleteMode) {
            pendingSpawnStart = null;
            draggingEntity = null;
            draggingPoint = null;
            setBallPlacementMode(false);
        }
        deleteBtn.classList.toggle('active', deleteMode);
    }
    // Ball-placement mode — same "only one mode at a time" discipline as
    // Delete mode above; turning it on cancels any in-progress entity
    // spawn/drag gesture and Delete mode.
    function setBallPlacementMode(next) {
        ballPlacementMode = next;
        if (ballPlacementMode) {
            pendingSpawnStart = null;
            draggingEntity = null;
            draggingPoint = null;
            setDeleteMode(false);
        }
        ballBtn.classList.toggle('active', ballPlacementMode);
        applyCursorVisibility();
    }
    startBtn.addEventListener('click', () => setRunning(true));
    stopBtn.addEventListener('click', () => setRunning(false));
    deleteBtn.addEventListener('click', () => setDeleteMode(!deleteMode));
    ballBtn.addEventListener('click', () => setBallPlacementMode(!ballPlacementMode));
    setRunning(false);
    // Win/Lose — deliberately NOT gated by running/stopped (unlike
    // Delete/Ball) and not a toggled "mode": each click is a one-shot
    // trigger applied immediately to every currently-placed entity, for
    // testing the animation regardless of whatever else is going on.
    document.getElementById('winBtn').addEventListener('click', () => triggerWinLoseSequence('win'));
    document.getElementById('loseBtn').addEventListener('click', () => triggerWinLoseSequence('lose'));

    // Fixed-timestep physics — step() always advances by exactly FIXED_DT
    // (1/60s), never the raw/jittery per-real-frame delta. Previously
    // every physics quantity here (gravity integration, position,
    // playback frame advancement, and — critically — the hand's own
    // joint velocity that sizes the ball-collision kick) was driven
    // directly by real elapsed time, which is never bit-for-bit identical
    // between 2 separate runs even with 100% identical inputs (a static
    // mouse position included) — confirmed as the actual explanation for
    // a direct report ("if i leave my mouse in one location... how come
    // the outcome of the ball's trajectory isnt identical everytime")
    // before this fix: real requestAnimationFrame timing jitters run to
    // run, and this sim's collision response is sensitive enough to that
    // jitter for it to compound into a visibly different trajectory.
    // update() (below) still runs once per real animation frame, an
    // accumulator pattern lets it run step() 0, 1, or several times to
    // catch up to real elapsed time — this is what makes 2 runs with the
    // same inputs now produce numerically identical motion after the
    // same NUMBER of steps, regardless of real frame-timing noise.
    const FIXED_DT = 1 / 60;
    const MAX_FRAME_DT = 0.25; // caps the catch-up burst after e.g. a backgrounded tab
    let accumulator = 0;
    let lastTime = performance.now();
    function step(dt) {
        // Per-entity play-sequence frame advancement — mouse-follow
        // smoothing/rotation is gone entirely (entities are fixed once
        // spawned), so this is now just the flick-playback clock plus the
        // ball/collision/trigger physics.
        entities.forEach(entity => {
            if (entity.playing && entity.playSequenceFrozen) {
                entity.playFrameAccum += dt * FLICK_BASE_FPS * cfg.clickAnimSpeed;
                entity.playFrameIndex = Math.floor(entity.playFrameAccum);
                const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, Math.round(cfg.peakHoldFrames));
                if (entity.playFrameIndex >= totalLen) {
                    entity.playing = false;
                    entity.playSequenceFrozen = null;
                    entity.playFrameIndex = 0;
                    entity.playFrameAccum = 0;
                }
            }
        });
        advanceWinLoseSequences(dt);
        updateBallAndCollision(dt);
    }

    // Advances every entity's own Win/Lose state machine, one tick at a
    // time — see triggerWinLoseSequence()'s own comment for the 5 phases.
    // Uses its OWN cfg.winLoseAnimSpeed for the forward1/forward2/reverse
    // frame-advance rate (per explicit request — independent of the
    // normal flick's own Hand Anim Speed / cfg.clickAnimSpeed, not
    // shared with it), still against the same FLICK_BASE_FPS base rate.
    // The 2 hold phases advance a real-seconds countdown
    // (cfg.winLoseFistHoldDuration/winLoseFinalHoldDuration) instead of a
    // frame count, unaffected by this speed slider — a hold's own
    // duration is real time, not animation playback.
    const WIN_LOSE_FIST_INDEX = 12; // frame _013 (0-based)
    const WIN_LOSE_LAST_INDEX = WIN_LOSE_FRAME_COUNT - 1; // frame _024
    function advanceWinLoseSequences(dt) {
        entities.forEach(entity => {
            if (!entity.winLoseType) return;
            const phase = entity.winLosePhase;
            if (phase === 'forward1' || phase === 'forward2') {
                entity.winLoseFrameAccum += dt * FLICK_BASE_FPS * cfg.winLoseAnimSpeed;
                const target = phase === 'forward1' ? WIN_LOSE_FIST_INDEX : WIN_LOSE_LAST_INDEX;
                if (entity.winLoseFrameAccum >= target) {
                    entity.winLoseFrameAccum = target; // clamp exactly — never overshoot the hold frame
                    if (phase === 'forward1') {
                        entity.winLosePhase = 'holdFist';
                        entity.winLoseHoldRemaining = cfg.winLoseFistHoldDuration;
                    } else {
                        entity.winLosePhase = 'holdFinal';
                        entity.winLoseHoldRemaining = cfg.winLoseFinalHoldDuration;
                    }
                }
            } else if (phase === 'holdFist' || phase === 'holdFinal') {
                entity.winLoseHoldRemaining -= dt;
                if (entity.winLoseHoldRemaining <= 0) {
                    // frameAccum is left exactly where the hold froze it
                    // (WIN_LOSE_FIST_INDEX or WIN_LOSE_LAST_INDEX) — the
                    // next phase continues from there, not from 0.
                    entity.winLosePhase = phase === 'holdFist' ? 'forward2' : 'reverse';
                }
            } else if (phase === 'reverse') {
                // No hold at WIN_LOSE_FIST_INDEX on the way back down —
                // "without any in between frame holding", per explicit
                // instruction — this phase has no target-check branching
                // at all, just a continuous decrement to 0.
                entity.winLoseFrameAccum -= dt * FLICK_BASE_FPS * cfg.winLoseAnimSpeed;
                if (entity.winLoseFrameAccum <= 0) {
                    // Sequence complete — entity returns to its own normal
                    // idle rendering (render()'s draw dispatch falls back
                    // to the idle branch once winLoseType is null again).
                    entity.winLoseType = null;
                    entity.winLosePhase = null;
                    entity.winLoseFrameAccum = 0;
                    entity.winLoseHoldRemaining = 0;
                }
            }
        });
    }

    function update(now) {
        // Self-healing canvas size check. resizeCanvas() only otherwise
        // runs once at boot plus on a real 'resize' event — if
        // window.innerWidth/innerHeight read 0 at that first boot call (a
        // real, reproduced-in-this-session early-page-life quirk, same
        // class already documented in this workspace for mobile Safari/
        // Chrome, and the same root cause already fixed for mouseX above),
        // the canvas permanently sticks at 0×0 unless the
        // user happens to resize their window afterward — which, on a
        // static desktop session, most users never do. A 0×0 canvas isn't
        // just a rendering bug: `#scene.cursor-hidden{cursor:none}` (Hide
        // OS Cursor) has nothing left to apply that rule TO, since the
        // element covers zero real screen area — this is the likely root
        // cause of "hide OS cursor doesn't work" reports. Checked every
        // frame (cheap: 2 comparisons) rather than only once, so it also
        // self-heals from a real live window resize, not just the boot-
        // time case. Display sizing, not simulation — deliberately stays
        // outside the fixed-step loop below.
        const dpr = effectiveDpr();
        if (canvas.width !== Math.round(window.innerWidth * dpr) || canvas.height !== Math.round(window.innerHeight * dpr)) {
            resizeCanvas();
        }

        const frameDt = Math.min(MAX_FRAME_DT, (now - lastTime) / 1000);
        lastTime = now;
        accumulator += frameDt;
        while (accumulator >= FIXED_DT) {
            step(FIXED_DT);
            accumulator -= FIXED_DT;
        }

        // render() runs once per real frame regardless of how many (0 or
        // more) fixed steps just ran — every entity/ball field it reads is
        // plain current state (no per-step return value to thread through
        // anymore now that entities carry their own state), so redrawing
        // the same state on a step-less callback is harmless.
        render();
        requestAnimationFrame(update);
    }

    function render() {
        const w = window.innerWidth, h = window.innerHeight;
        ctx.fillStyle = cfg.backgroundColor;
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        if (cfg.showCenter) {
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
            ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
            ctx.stroke();
            ctx.restore();
        }

        const vmin = Math.min(w, h);
        const size = vmin * (cfg.entityScale / 100);

        // Live aim-preview while awaiting the 2nd click of a spawn — a
        // dashed line from the recorded start point to the current mouse
        // position PLUS the actual sprite that will be placed, live-
        // updating every frame from the current mouse angle (per explicit
        // request: "show the animation frame to be placed live as I drag
        // so i can see in real time what it will look like when placed").
        // Recomputes angle/direction/rotation via the EXACT SAME formula
        // spawnEntityFromLine() uses to commit the real entity (just fed
        // the live mouse position instead of a committed end point), so
        // what's previewed here is guaranteed to match what actually gets
        // placed on the 2nd click — translucent (globalAlpha) so it always
        // reads as a preview, never mistaken for an already-placed entity.
        if (pendingSpawnStart && hasMouse) {
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(pendingSpawnStart.x, pendingSpawnStart.y);
            ctx.lineTo(mouseX, mouseY);
            ctx.stroke();
            ctx.restore();
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pendingSpawnStart.x, pendingSpawnStart.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const dist = Math.hypot(mouseX - pendingSpawnStart.x, mouseY - pendingSpawnStart.y);
            if (dist > 0.0001) {
                const previewAngle = mouseAngleFromCenter(mouseX, mouseY, pendingSpawnStart.x, pendingSpawnStart.y);
                const previewDirectionKey = DIRECTIONS[directionIndexForAngle(previewAngle)].key;
                const previewRotationRad = (previewAngle + (cfg.entityRotationOffsetByDirection[previewDirectionKey] || 0)) * Math.PI / 180;
                // Live preview is always the idle frame (frame 1) — uses
                // the same pre-scaled cache the main idle-entity draw uses
                // (getScaledIdleFrame's own comment), since this draw runs
                // every single frame while aiming/dragging, exactly the
                // activity reported as laggy on mobile.
                const previewScaled = getScaledIdleFrame(previewDirectionKey, size);
                if (previewScaled) {
                    const previewDrawW = previewScaled.drawW, previewDrawH = previewScaled.drawH;
                    const previewVb = visibleBoundsForDirection(previewDirectionKey);
                    const previewXOffsetPx = vmin * ((cfg.entityXOffsetByDirection[previewDirectionKey] || 0) / 100);
                    ctx.save();
                    ctx.globalAlpha = 0.5;
                    ctx.translate(pendingSpawnStart.x, pendingSpawnStart.y);
                    ctx.rotate(previewRotationRad);
                    ctx.drawImage(previewScaled.canvas, -previewDrawW * previewVb.centerX + previewXOffsetPx, -previewDrawH * previewVb.bottomY, previewDrawW, previewDrawH);
                    ctx.restore();
                }
            }
        }

        entities.forEach(entity => {
            // A PLAYING entity draws straight from its own frozen flick-
            // sequence frame (changes every tick, individually short-lived
            // — not worth caching). An IDLE entity — the common case while
            // placing/rotating/moving, since nothing plays during Stop
            // mode — draws from the pre-scaled cache instead of rescaling
            // the full-resolution source every frame (see
            // getScaledIdleFrame()'s own comment: a real, reported mobile
            // performance issue).
            let drawSource = null, drawW = size, drawH = size, vb = null;
            if (entity.winLoseType) {
                // Win/Lose takes over the entity's own draw entirely,
                // ahead of both the normal playing/idle branches (the 2
                // states are mutually exclusive — triggerWinLoseSequence()
                // already clears entity.playing when this starts) — its
                // OWN anchor (WIN_LOSE_ASSETS[key].centerX/bottomY), not
                // visibleBoundsForDirection(), since this is a genuinely
                // different source image, not reused from the normal set.
                const frames = ensureWinLoseLoaded(entity.directionKey, entity.winLoseType);
                const idx = Math.max(0, Math.min(WIN_LOSE_LAST_INDEX, Math.floor(entity.winLoseFrameAccum)));
                const img = frames[idx];
                if (img && img.complete && img.naturalWidth > 0) {
                    drawH = size * (img.naturalHeight / img.naturalWidth);
                    drawSource = img;
                    const wl = WIN_LOSE_ASSETS[entity.directionKey];
                    vb = wl ? { centerX: wl.centerX, bottomY: wl.bottomY } : { centerX: 0.5, bottomY: 1 };
                } else {
                    // This exact frame hasn't finished loading yet (all 24
                    // of a direction's own Win/Lose frames are only
                    // fetched starting the first time that direction is
                    // actually used — see ensureWinLoseLoaded()'s own
                    // comment) — a real, reported symptom on a cold cache
                    // ("on a hard refresh, the first time i hit Win and
                    // Lose... the app seems to have to load the entities
                    // one by one... they each flash in succession"): with
                    // no fallback, drawSource stays null here and the
                    // entity draws NOTHING until this exact image
                    // finishes downloading, so several entities (each
                    // fetching a different direction's own 24 images at
                    // different network speeds) blink in one at a time.
                    // Falls back to the entity's own already-cached idle
                    // frame instead — it was already visibly idle the
                    // instant before this Win/Lose click, so this is
                    // always available with zero extra loading, and reads
                    // as "still settling into its new pose" rather than
                    // "missing" — same idle-frame source AND anchor
                    // (visibleBoundsForDirection(), not the Win/Lose
                    // table) the plain idle branch below uses, not a
                    // half-composed mix of the two.
                    const scaled = getScaledIdleFrame(entity.directionKey, size);
                    if (scaled) {
                        drawW = scaled.drawW;
                        drawH = scaled.drawH;
                        drawSource = scaled.canvas;
                        vb = visibleBoundsForDirection(entity.directionKey);
                    }
                }
            } else if (entity.playing && entity.playSequenceFrozen) {
                const hold = Math.round(cfg.peakHoldFrames);
                const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, hold);
                const virtualIndex = Math.min(entity.playFrameIndex, totalLen - 1);
                const img = entity.playSequenceFrozen[resolvePlaySequenceIndex(virtualIndex, DIRECTION_FRAME_COUNT, hold)];
                if (img && img.complete && img.naturalWidth > 0) {
                    drawH = size * (img.naturalHeight / img.naturalWidth);
                    drawSource = img;
                }
            } else {
                const scaled = getScaledIdleFrame(entity.directionKey, size);
                if (scaled) {
                    drawW = scaled.drawW;
                    drawH = scaled.drawH;
                    drawSource = scaled.canvas;
                }
            }
            if (!vb) vb = visibleBoundsForDirection(entity.directionKey);
            // Animation X Offset (cfg.entityXOffsetByDirection) — added to
            // the local x AFTER vb.centerX, BEFORE rotation, so it shifts
            // the drawn sprite/hitbox sideways relative to the entity's own
            // facing direction, matching the same offset applied to the
            // collision geometry above (updateBallAndCollision) and to the
            // trigger-zone check (ballInFlickTriggerZone) — all 3 must stay
            // in sync, same discipline as vb.centerX/bottomY.
            const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
            ctx.save();
            ctx.translate(entity.x, entity.y);
            ctx.rotate(entityRotationRad(entity));
            // Anchored at the center-base of the VISIBLE (non-transparent)
            // content, not the raw PNG's own bottom-center — see
            // localOffsetFromNormalized()'s comment; drawImage's own
            // (dx,dy) is its TOP-LEFT corner, so -drawW*centerX/-drawH*bottomY
            // puts that exact visible-content point at the entity's own
            // origin.
            if (drawSource) {
                ctx.drawImage(drawSource, -drawW * vb.centerX + xOffsetPx, -drawH * vb.bottomY, drawW, drawH);
            }
            if (cfg.showHitbox) {
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-drawW * vb.centerX + xOffsetPx, -drawH * vb.bottomY, drawW, drawH);
            }
            ctx.restore();

            // Joint collision debug lines — drawn at the FIXED collision
            // thickness (Joint Collision Thickness alone — no longer speed-
            // derived, per explicit instruction: "collision circles will
            // never rescale during the animation sequence unless otherwise
            // told so by me"), matching updateBallAndCollision()'s own
            // per-segment thicknessPx exactly, so the boundary the ball
            // actually reacts to is directly visible at all times.
            if (cfg.showJointCollisionLines && entity.jointWorld) {
                ctx.save();
                ctx.strokeStyle = '#ffcf5c';
                ctx.globalAlpha = 0.55;
                ctx.lineCap = 'round';
                ctx.lineWidth = vmin * (cfg.jointThickness / 100);
                [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']].forEach(([aKey, bKey]) => {
                    const a = entity.jointWorld[aKey], b = entity.jointWorld[bKey];
                    if (!a || !b) return;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                });
                ctx.restore();
            }
        });

        // Stop-mode entity-adjustment handles: 2 dots per entity (base =
        // the fixed anchor point / 1st click, end = the aim point / 2nd
        // click) plus a dashed connecting line, draggable via the
        // pointerdown/pointermove/pointerup handlers above — only shown
        // (and only hit-testable, per those handlers) while stopped, same
        // gating as the spawn-placement gesture itself.
        if (!running) {
            entities.forEach(entity => {
                ctx.save();
                ctx.strokeStyle = '#4dd2ff';
                ctx.globalAlpha = 0.7;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(entity.x, entity.y);
                ctx.lineTo(entity.endX, entity.endY);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#4dd2ff';
                ctx.beginPath();
                ctx.arc(entity.x, entity.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#ff4da6';
                ctx.beginPath();
                ctx.arc(entity.endX, entity.endY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Balls — one per active generator, not a single shared ball.
        {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ballGenerators.forEach(gen => {
                if (!gen.ball) return;
                ctx.save();
                ctx.fillStyle = cfg.ballColor;
                ctx.beginPath();
                ctx.arc(gen.ball.x, gen.ball.y, radiusPx, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Placed ball spawn points — shown only while stopped (Delete
        // mode needs to see/click them; while running, the real balls
        // spawned there speak for themselves). Drawn as a dashed outline
        // in the ball's own color/size, distinct from a solid live ball.
        if (!running && ballSpawnPoints.length > 0) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ctx.save();
            ctx.strokeStyle = cfg.ballColor;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 2;
            ballSpawnPoints.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, radiusPx, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        // Ball-placement live cursor preview — "my cursor becomes the
        // ball geometry" — a solid preview ball following the mouse,
        // drawn only while actually placing (Stop mode; running has
        // nothing to preview since a click can't place anything then).
        if (ballPlacementMode && !running && hasMouse) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ctx.save();
            ctx.globalAlpha = 0.7;
            ctx.fillStyle = cfg.ballColor;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, radiusPx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (cfg.showAngleDebug) {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px monospace';
            ctx.textBaseline = 'top';
            const playingCount = entities.filter(en => en.playing).length;
            // Live Flick Intensity readout while placing/adjusting — lets
            // the user actually SEE the value this exact gesture is
            // setting (per the same request that introduced the
            // multiplier itself), rather than only finding out once a
            // ball reacts to it later. "placing": recomputes the same
            // angle/direction the live spawn-preview above already draws,
            // fed to flickIntensityMultiplierForLine() directly (not
            // re-deriving a fake entity). "adjusting":
            // entityFlickIntensityMultiplier() already reads
            // draggingEntity's own LIVE endX/endY, so no
            // separate live-position handling is needed here.
            let intensityText = '';
            if (pendingSpawnStart && hasMouse) {
                const dist = Math.hypot(mouseX - pendingSpawnStart.x, mouseY - pendingSpawnStart.y);
                if (dist > 0.0001) {
                    const previewAngle = mouseAngleFromCenter(mouseX, mouseY, pendingSpawnStart.x, pendingSpawnStart.y);
                    const previewDirectionKey = DIRECTIONS[directionIndexForAngle(previewAngle)].key;
                    const mult = flickIntensityMultiplierForLine(previewDirectionKey, pendingSpawnStart.x, pendingSpawnStart.y, mouseX, mouseY);
                    intensityText = `  intensity ${mult.toFixed(2)}x`;
                }
            } else if (draggingEntity && draggingPoint === 'end') {
                intensityText = `  intensity ${entityFlickIntensityMultiplier(draggingEntity).toFixed(2)}x`;
            }
            // y=50, not 12 — the Start/Stop/Delete buttons (.sim-controls)
            // sit at top:10px/left:10px and are tall enough to overlap a
            // y=12 baseline; a real user report ("remove the text behind
            // the start stop delete buttons") confirmed this was actually
            // happening, not just a theoretical overlap.
            ctx.fillText(`entities: ${entities.length}${playingCount ? `  (${playingCount} playing)` : ''}${pendingSpawnStart ? '  (placing...)' : ''}${draggingEntity ? '  (adjusting...)' : ''}${deleteMode ? '  (delete mode)' : ''}${intensityText}  [${running ? 'running' : 'stopped'}]`, 12, 50);
            ctx.restore();
        }
    }

    requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(update); });

    initDevPanelEngine();

    // One-time-per-load migration: this panel's Entity group was briefly
    // named "Hand Animation", and a separate "Mouse / Rotation" group
    // existed, before both were consolidated back into "Entity" per
    // explicit request. Anyone whose browser already saved settings
    // during that window has a sectionOrder referencing those 2 names —
    // applySectionOrder() (the generic engine, unchanged) correctly, BY
    // DESIGN, recreates any saved group it doesn't recognize as a
    // .dev-section already in the static HTML (that's what lets a real
    // user-created "+ Add Group" group survive a reload) — it has no way
    // to tell those 2 renamed-away names apart from a genuine custom
    // group, so they silently come back as empty-looking ghost groups
    // every load. Prune them here instead: move whatever rows they still
    // claim into Entity (their current code home) rather than deleting
    // them, then remove the now-empty stale section. Runs after
    // initDevPanelEngine() so it can clean up whatever that just
    // restored from localStorage; cheap and idempotent, so it's fine to
    // run on every load rather than gating it behind a one-time flag —
    // once a real Save happens post-migration, the live DOM (already
    // clean) is what gets captured, so the stale names stop reappearing
    // in localStorage too.
    (function pruneStaleDevPanelGroups() {
        const STALE_GROUP_NAMES = ['Hand Animation', 'Mouse / Rotation'];
        const entityContent = findGroupContent('desktop', 'Entity', 'pruneStaleDevPanelGroups', 'migration');
        document.querySelectorAll('#desktopTabContent > .dev-section > .dev-section-title').forEach(titleEl => {
            if (!STALE_GROUP_NAMES.includes(titleEl.dataset.sid)) return;
            const section = titleEl.parentElement;
            const content = section.querySelector(':scope > .dev-section-content');
            if (entityContent && content) {
                Array.from(content.children).forEach(row => entityContent.appendChild(row));
            }
            section.remove();
        });
    })();
</script>
</body>
</html>
