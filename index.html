    // shifts the returned LOCAL x by a fixed per-direction amount, added
    // BEFORE rotation — so in world space it always reads as perpendicular
    // to the entity's own facing/placement-line direction, regardless of
    // which way that entity happens to be rotated. Defaults to 0 (no-op).
    function localOffsetFromNormalized(px, py, drawW, drawH, centerX = 0.5, bottomY = 1, xOffsetPx = 0) {
        return { x: (px - centerX) * drawW + xOffsetPx, y: (py - bottomY) * drawH };
    }

    // Per-direction visible-content bounds — the actual (non-transparent)
    // hand/wrist pose's own bounding box within its full PNG frame,
    // normalized 0-1, DIFFERENT from the raw PNG's own full (0,0)-(1,1)
    // box because the source art has real transparent margin around the
    // visible pose (confirmed: same class of padding this project's own
    // DickoClicko precedent already had to account for via per-pixel
    // alpha hit-testing).
    //
    // PRECOMPUTED OFFLINE, not scanned at runtime. This used to be a live
    // in-browser canvas scan of each direction's frame 1 (computeVisibleContentBounds/
    // visibleBoundsCache, now removed) — that approach went through 2 full
    // rounds of real, reported bugs before landing here: (1) a full-
    // resolution scan (2400x1181px, ~37-83ms) run from the live spawn/drag
    // preview froze the page on first placement, since sweeping across
    // several newly-encountered directions in one placement gesture
    // chained multiple such scans together past a frame's budget;
    // (2) downscaling the scan to fix that (MAX_SCAN_DIM=200, later 400)
    // fixed the freeze but permanently traded away real accuracy (a
    // downscale blends the anti-aliased edge into a wider apparent
    // footprint — measured up to 0.0065 of image height off from a full-
    // resolution scan on the worst direction), and a user report that the
    // anchor was "still not at the base of the hand... regardless of
    // scale" pointed at a 3rd, deeper problem: a defensive try/catch
    // (added as hardening against a theoretical canvas-taint SecurityError
    // for a locally-opened file:// page) could silently swallow ANY scan
    // failure and fall back to the old raw-PNG default (0.5/1) with zero
    // visible sign of it — meaning a real failure in that exact class of
    // environment would make every one of the above 2 rounds of fixes
    // completely irrelevant, since the scan would never even run.
    // Eliminating the runtime scan removes all 3 failure modes at once:
    // no freeze risk (nothing runs during interaction), no downscale
    // accuracy tradeoff (computed once, offline, at full resolution), and
    // no environment-dependent canvas/getImageData failure mode (no
    // runtime pixel readback at all). Values below were computed with
    // Node + `sharp` directly against the real frame-1 PNGs on disk (same
    // ALPHA_HIT_THRESHOLD=10 convention as this project's other per-pixel
    // alpha checks), independently cross-checked against this session's
    // own earlier in-browser measurements (matched to 4 decimal places).
    //
    // heightFrac (added alongside centerX/bottomY, same offline computation,
    // same source PNGs — NOT a separate scan) is the visible content's own
    // height as a fraction of the full raster height (bottomY - topY,
    // topY being the fractional Y of the first non-transparent row) — this
    // is what entityFlickSpeedMultiplier() (below) uses as "100% up
    // the visible image" for the Flick Speed distance scale, per
    // explicit request. Deliberately the SAME frame-1 art the anchor
    // point already derives from (not the peak/most-extended flick frame),
    // so placing an entity always measures against its own idle silhouette
    // regardless of which frame the animation happens to be on later.
    //
    // TO REGENERATE (e.g. after replacing a direction's frame 1 art):
    //   node -e "const sharp=require('sharp'); (async()=>{const img=sharp('data/FLICK/2TONED/<FOLDER>/A/<prefix>_001.png'); const {data,info}=await img.raw().ensureAlpha().toBuffer({resolveWithObject:true}); const w=info.width,h=info.height,c=info.channels; let minX=w,maxX=-1,minY=h,maxY=-1; for(let y=0;y<h;y++){for(let x=0;x<w;x++){const a=data[(y*w+x)*c+(c-1)]; if(a>10){if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}}} const bottomY=+(((maxY+1)/h)).toFixed(4), topY=+((minY/h)).toFixed(4); console.log({centerX:+(((minX+maxX)/2)/w).toFixed(4), bottomY, heightFrac:+(bottomY-topY).toFixed(4)});})()"
    const VISIBLE_BOUNDS_BY_DIRECTION = {
        'behind':       { centerX: 0.5265, bottomY: 0.8916, heightFrac: 0.5919 },
        'behind-thumb': { centerX: 0.5029, bottomY: 0.9009, heightFrac: 0.5952 },
        'side-thumb':   { centerX: 0.4788, bottomY: 0.8815, heightFrac: 0.5809 },
        'front-thumb':  { centerX: 0.4738, bottomY: 0.9009, heightFrac: 0.6028 },
        'front':        { centerX: 0.4763, bottomY: 0.9145, heightFrac: 0.6156 },
        'front-pinky':  { centerX: 0.4942, bottomY: 0.9221, heightFrac: 0.6376 },
        'side-pinky':   { centerX: 0.5194, bottomY: 0.9272, heightFrac: 0.6334 },
        'behind-pinky': { centerX: 0.521,  bottomY: 0.917,  heightFrac: 0.6257 },
    };
    // Thin, synchronous lookup — the fallback only matters for a direction
    // key that isn't in the table above (e.g. a newly-added direction
    // whose bounds haven't been regenerated yet); heightFrac: 1 there
    // means "assume the whole raster is visible" (a safe, no-crash default
    // for entityFlickSpeedMultiplier(), not a real measurement).
    function visibleBoundsForDirection(directionKey) {
        return VISIBLE_BOUNDS_BY_DIRECTION[directionKey] || { centerX: 0.5, bottomY: 1, heightFrac: 1 };
    }

    function ballInFlickTriggerZone(ball, directionKey, rotationRad, ex, ey) {
        if (!ball) return false;
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const radiusPx = vmin * (cfg.ballRadius / 100);
        const thicknessPx = vmin * (cfg.jointThickness / 100);
        const minDist = thicknessPx / 2 + radiusPx;
        const size = vmin * (cfg.entityScale / 100);
        const refImg = ensureDirectionLoaded(directionKey).frames[0];
        const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
        const drawW = size, drawH = size * aspect;
        const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);
        const vb = visibleBoundsForDirection(directionKey);
        const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[directionKey] || 0) / 100);
        const segments = [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']];

        for (let frameNumber = 1; frameNumber <= DIRECTION_FRAME_COUNT; frameNumber++) {
            const pose = interpolatedLocalPose(directionKey, frameNumber);
            if (!pose) continue;
            const world = {};
            SKELETON_POINTS.forEach(pk => {
                const p = pose[pk];
                if (!p) return;
                const { x: lx, y: ly } = localOffsetFromNormalized(p.x, p.y, drawW, drawH, vb.centerX, vb.bottomY, xOffsetPx);
                world[pk] = { x: ex + lx * cos - ly * sin, y: ey + lx * sin + ly * cos };
            });
            for (const [aKey, bKey] of segments) {
                const a = world[aKey], b = world[bKey];
                if (!a || !b) continue;
                const nearest = nearestPointOnSegment(ball.x, ball.y, a.x, a.y, b.x, b.y);
                if (Math.hypot(ball.x - nearest.x, ball.y - nearest.y) < minDist) return true;
            }
        }
        return false;
    }

    // Previous frame's LOCAL (unrotated, untranslated — relative to each
    // entity's own center, before its own fixed rotationRad/x/y are
    // applied) joint pixel positions, per point key — now stored ON each
    // entity object (entity.prevJointLocal/entity.smoothedJointSpeed)
    // rather than one shared global, since every spawned entity needs its
    // own independent velocity history. Deliberately LOCAL, not
    // world-space: an earlier version (from before the spawn-placement
    // rework, when there was only ever 1 entity and it followed the
    // mouse) derived velocity from WORLD position deltas, which also
    // picked up the entity's own translation/rotation as "joint speed" —
    // reported directly: "as i move the mouse, the collision circle
    // sometimes becomes huge... should stay the same size unless i change
    // the animation scale itself." Local-space deltas isolate the flick
    // animation's OWN motion from any rigid transform, so this local
    // speed is still valid to use directly against world-space distances
    // (thickness, collision push) with no unit conversion needed — this
    // is what makes "thickness/intensity scale with the animation frames,
    // and with Click Anim Speed" emerge from real motion.
    //
    // A live Entity Scale slider change is still a real, GLOBAL
    // discontinuity (jointLocal is derived from drawW/drawH, which depend
    // on cfg.entityScale) shared by every entity at once — tracked with 1
    // module-level prevEntityScale (not per-entity, since cfg.entityScale
    // itself is one shared/global setting) and applied uniformly below.
    // A spawned entity's own direction can no longer change after it's
    // placed (a real difference from the old mouse-follow single entity,
    // which used to also guard against a direction-SWITCH discontinuity —
    // now moot, since prevJointLocal starting null on a fresh entity
    // already skips velocity for that entity's own first real frame,
    // which is the only discontinuity a fixed-direction entity can have).
    let prevEntityScale = null;

    // ----------------------------------------------------------------
    // Level-system collision — circle-vs-rotated-rectangle (wall/floor/
    // target geometry) and ball-vs-ball. Deliberately kept as 2
    // standalone functions, called from clearly-delineated blocks inside
    // updateBallAndCollision() below (not interleaved with the existing
    // finger-capsule collision code), per explicit coordination with a
    // concurrent session that was independently restructuring that
    // capsule-collision block at the same time.
    // ----------------------------------------------------------------

    // Discrete, per-tick (not swept) — matches this file's existing
    // canvas-edge-bounce precedent, not the finger capsule's swept-
    // segment math (which specifically exists for thin MOVING fingers a
    // fast ball could tunnel through between ticks; a static rect + the
    // existing ball-speed cap doesn't need that). Returns true if a
    // collision was resolved (used by the Phase-4 target-contact logic
    // to know whether this tick counts as "touching").
    function resolveCircleRectCollision(ball, rect, radiusPx) {
        const cos = Math.cos(-rect.rotation), sin = Math.sin(-rect.rotation);
        const dx = ball.x - rect.x, dy = ball.y - rect.y;
        const localX = dx * cos - dy * sin, localY = dx * sin + dy * cos;
        const halfW = rect.w / 2, halfH = rect.h / 2;
        const clampedX = Math.max(-halfW, Math.min(halfW, localX));
        const clampedY = Math.max(-halfH, Math.min(halfH, localY));
        let localNX, localNY, overlap;
        if (clampedX === localX && clampedY === localY) {
            // Ball center is INSIDE the box (can happen at high speed
            // combined with a small rect) — push out along whichever
            // face is nearest, rather than leaving it stuck with no
            // resolvable normal (the clamped-point branch below would
            // otherwise divide by a near-zero distance).
            const distToRight = halfW - localX, distToLeft = localX + halfW;
            const distToBottom = halfH - localY, distToTop = localY + halfH;
            const minDist = Math.min(distToRight, distToLeft, distToBottom, distToTop);
            if (minDist === distToRight) { localNX = 1; localNY = 0; overlap = radiusPx + distToRight; }
            else if (minDist === distToLeft) { localNX = -1; localNY = 0; overlap = radiusPx + distToLeft; }
            else if (minDist === distToBottom) { localNX = 0; localNY = 1; overlap = radiusPx + distToBottom; }
            else { localNX = 0; localNY = -1; overlap = radiusPx + distToTop; }
        } else {
            const ldx = localX - clampedX, ldy = localY - clampedY;
            const distSq = ldx * ldx + ldy * ldy;
            if (distSq >= radiusPx * radiusPx) return false;
            const dist = Math.sqrt(distSq);
            localNX = dist > 0.0001 ? ldx / dist : 0;
            localNY = dist > 0.0001 ? ldy / dist : -1;
            overlap = radiusPx - dist;
        }
        // Rotate the local-space normal back to world space, then reuse
        // the EXACT SAME reflection formula the finger-capsule collision
        // (and the canvas-edge bounce) already apply — v' = v - (1+e)(v·n)n.
        const wcos = Math.cos(rect.rotation), wsin = Math.sin(rect.rotation);
        const nx = localNX * wcos - localNY * wsin, ny = localNX * wsin + localNY * wcos;
        ball.x += nx * overlap;
        ball.y += ny * overlap;
        const incomingDotNormal = ball.vx * nx + ball.vy * ny;
        if (incomingDotNormal < 0) {
            const reflectScale = (1 + cfg.ballBounciness) * incomingDotNormal;
            ball.vx -= reflectScale * nx;
            ball.vy -= reflectScale * ny;
        }
        return true;
    }

    // Standard equal-mass circle-circle elastic collision. Reuses
    // cfg.ballBounciness as the restitution constant (same "how much of
    // the ball's own energy survives a bounce" concept the wall/rect/
    // capsule collisions all already use) rather than inventing a new
    // slider. Toggled off by default (cfg.ballToBallCollisionEnabled) —
    // wholly new physics behavior, so existing multi-ball setups keep
    // their exact current behavior (balls pass through each other)
    // unless explicitly opted in.
    function resolveBallToBallCollision(ballA, ballB, radiusPx) {
        const dx = ballB.x - ballA.x, dy = ballB.y - ballA.y;
        const dist = Math.hypot(dx, dy);
        const minDist = radiusPx * 2;
        if (dist >= minDist || dist < 0.0001) return;
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDist - dist;
        ballA.x -= nx * overlap / 2; ballA.y -= ny * overlap / 2;
        ballB.x += nx * overlap / 2; ballB.y += ny * overlap / 2;
        const rvx = ballB.vx - ballA.vx, rvy = ballB.vy - ballA.vy;
        const velAlongNormal = rvx * nx + rvy * ny;
        if (velAlongNormal > 0) return; // already separating
        const impulse = -(1 + cfg.ballBounciness) * velAlongNormal / 2; // equal mass, split the impulse
        ballA.vx -= impulse * nx; ballA.vy -= impulse * ny;
        ballB.vx += impulse * nx; ballB.vy += impulse * ny;
    }

    function updateBallAndCollision(dt) {
        const w = window.innerWidth, h = window.innerHeight;
        const vmin = Math.min(w, h);

        const scaleChanged = cfg.entityScale !== prevEntityScale;
        prevEntityScale = cfg.entityScale;

        // Per-entity local+world joint positions and smoothed speed —
        // computed once per entity per tick, then stashed on the entity
        // itself (entity.jointWorld/entity.jointSpeed) for render()'s own
        // debug-line drawing and for the collision/trigger pass below to
        // read back without recomputing.
        entities.forEach(entity => {
            const localPose = interpolatedLocalPose(entity.directionKey, entityRealFrameNumber(entity));
            let jointWorld = null, jointLocal = null;
            if (localPose) {
                const size = vmin * (cfg.entityScale / 100);
                const refImg = ensureDirectionLoaded(entity.directionKey).frames[0];
                const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
                const drawW = size, drawH = size * aspect;
                const rotationRad = entityRotationRad(entity);
                const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);
                const vb = visibleBoundsForDirection(entity.directionKey);
                const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
                jointWorld = {};
                jointLocal = {};
                SKELETON_POINTS.forEach(pk => {
                    const p = localPose[pk];
                    if (!p) return;
                    // Local point in the sprite's own unrotated pixel space,
                    // anchored at the entity's own visible-content-based
                    // origin — see localOffsetFromNormalized()'s own comment.
                    const { x: lx, y: ly } = localOffsetFromNormalized(p.x, p.y, drawW, drawH, vb.centerX, vb.bottomY, xOffsetPx);
                    jointLocal[pk] = { x: lx, y: ly };
                    jointWorld[pk] = {
                        x: entity.x + lx * cos - ly * sin,
                        y: entity.y + lx * sin + ly * cos,
                    };
                });
            }
            const continuous = !scaleChanged;
            const jointVel = {};
            if (jointLocal && entity.prevJointLocal && continuous && dt > 0) {
                SKELETON_POINTS.forEach(pk => {
                    if (!jointLocal[pk] || !entity.prevJointLocal[pk]) return;
                    jointVel[pk] = { x: (jointLocal[pk].x - entity.prevJointLocal[pk].x) / dt, y: (jointLocal[pk].y - entity.prevJointLocal[pk].y) / dt };
                });
            }
            entity.prevJointLocal = jointLocal;

            // Smooth the raw per-point speed over time — snaps instantly
            // (factor=1, no blending) on a discontinuity (!continuous) so
            // an already-correct "0 speed" doesn't get smeared forward
            // from whatever the smoothed value happened to be a moment
            // ago.
            const smoothFactor = continuous ? expSmoothFactor(cfg.thicknessSmoothing, dt) : 1;
            const jointSpeed = {};
            SKELETON_POINTS.forEach(pk => {
                const raw = jointVel[pk] ? Math.hypot(jointVel[pk].x, jointVel[pk].y) : 0;
                const prevSpeed = entity.smoothedJointSpeed[pk] ?? raw;
                const next = prevSpeed + (raw - prevSpeed) * smoothFactor;
                entity.smoothedJointSpeed[pk] = next;
                jointSpeed[pk] = next;
            });

            entity.jointWorld = jointWorld;
            entity.jointSpeed = jointSpeed;
        });

        // Respawn cycle — gated by `running` (Start/Stop). Stop's own
        // handler (setRunning, below) already clears every ball the
        // moment it's pressed; this just stops NEW ones from spawning
        // while stopped. One independent countdown per generator, not one
        // shared timer — each spawn point respawns on its own schedule.
        if (running) {
            ballGenerators.forEach(gen => {
                // gen.exhausted (set below, at the bottom-edge-exit check)
                // permanently skips respawn for the rest of THIS attempt
                // during a level — a fresh Start (rebuildBallGenerators)
                // resets it, giving every generator exactly one ball per
                // attempt, per explicit spec ("in level mode, balls do not
                // respawn").
                if (!gen.ball && !gen.exhausted) {
                    gen.respawnCountdown -= dt;
                    if (gen.respawnCountdown <= 0) gen.ball = spawnBallAt(gen.spawnX, gen.spawnY, gen.isDefault);
                }
            });
        }

        // Per-entity rising-edge trigger state, OR'd across every
        // currently-active ball this tick (a ball sitting in the zone
        // doesn't keep re-triggering, same as the original single-ball
        // rule — just evaluated per-entity across however many balls
        // exist now, instead of assuming exactly one).
        const anyBallInZone = new Map();

        ballGenerators.forEach(gen => {
            const ball = gen.ball;
            if (!ball) return;
            const radiusPx = vmin * (cfg.ballRadius / 100);
            // Captured BEFORE this tick's own integration below — the
            // start point of the ball's swept path for the finger-capsule
            // collision test further down (prevBallX/Y -> ball.x/y after
            // integration is exactly "where the ball moved TO this tick,
            // from where it started").
            const prevBallX = ball.x, prevBallY = ball.y;
            ball.vy += vmin * (cfg.ballGravity / 100) * dt; // %vh/s² of the viewport's own min dimension, matching this project's other %vmin-based sizes
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            // Left/right walls — always. Bottom — never (that's the exit/
            // respawn edge, handled below). Top — collides too, EXCEPT
            // during a DEFAULT ball's initial fall from its off-screen-
            // above spawn point (spawnBallAt() starts a default ball at
            // y = -radiusPx*2, well above the top edge, specifically so
            // it visibly falls INTO frame) — bouncing off the top edge
            // during that entry would just reflect it straight back out
            // before it's ever seen. A user-placed spawn point's ball
            // never has this problem (hasEnteredFrame starts true — see
            // spawnBallAt()'s own comment). hasEnteredFrame latches true
            // the first frame the ball's own top edge reaches y=0 (i.e.
            // it's now at least partially visible) and never resets, so
            // every later moment — a strong joint-collision kick
            // launching it back up past the top, for instance — does
            // bounce normally.
            if (ball.y - radiusPx >= 0) ball.hasEnteredFrame = true;

            if (ball.x < radiusPx) { ball.x = radiusPx; ball.vx = -ball.vx * cfg.ballBounciness; }
            else if (ball.x > w - radiusPx) { ball.x = w - radiusPx; ball.vx = -ball.vx * cfg.ballBounciness; }
            if (ball.hasEnteredFrame && ball.y < radiusPx) { ball.y = radiusPx; ball.vy = -ball.vy * cfg.ballBounciness; }

            // ------------------------------------------------------------
            // Level-system rectangles (wall/floor = 'solid', win-condition
            // = 'target') — a separate, self-contained block, deliberately
            // NOT interleaved with the finger-capsule collision code right
            // below (added independently by a concurrent session around
            // the same time). Both solid and target rects are physically
            // collidable (a "target floor" is still something the ball
            // lands ON), so every rect always gets resolveCircleRectCollision
            // regardless of type; target rects ALSO get win-condition
            // bookkeeping on top when contact occurs.
            // ------------------------------------------------------------
            levelRects.forEach(rect => {
                const didCollide = resolveCircleRectCollision(ball, rect, radiusPx);
                if (rect.type !== 'target' || levelAttemptResolved) return;
                if (didCollide) {
                    if (rect.targetMode === 'instant') {
                        triggerLevelWin();
                    } else {
                        // 'settle' — win only once the ball has stayed in
                        // CONTINUOUS contact with this exact target AND
                        // below the stillness threshold for the
                        // configured duration; touching-but-still-moving-
                        // fast doesn't accumulate dwell time.
                        const speed = Math.hypot(ball.vx, ball.vy);
                        const stillnessPx = vmin * (cfg.ballStillnessSpeedThreshold / 100);
                        if (!ball.targetContact || ball.targetContact.rect !== rect) ball.targetContact = { rect, dwell: 0 };
                        if (speed < stillnessPx) {
                            ball.targetContact.dwell += dt;
                            if (ball.targetContact.dwell >= rect.settleDuration) triggerLevelWin();
                        } else {
                            ball.targetContact.dwell = 0;
                        }
                    }
                } else if (ball.targetContact && ball.targetContact.rect === rect) {
                    // Contact broken — dwell resets rather than pausing,
                    // per "continuous contact" in the settle-mode spec.
                    ball.targetContact.dwell = 0;
                }
            });

            // Joint-segment collision (3 capsules per entity) + the
            // proximity auto-trigger, once per spawned entity — this ball
            // reacts to/can trigger every entity independently, same
            // rules as before, now just run once per active ball.
            //
            // SWEPT: tests the ball's whole PATH this tick (prevBallX,Y ->
            // ball.x,y) against each finger capsule, via closestPointsBetweenSegments,
            // not just its single end-of-tick point — a fast ball can
            // otherwise jump clean over a thin capsule between 2 ticks and
            // never register as "inside" at either sampled instant
            // (tunneling), reported directly ("if the ball is moving at a
            // high velocity, even if it triggers the animation, the
            // animation is not fast enough to flick the ball"). Each
            // resolved hit updates ball.x/y in place, so a later segment's
            // own sweep this same tick starts from prevBallX/Y (unchanged)
            // through the ball's now-updated position. This positional
            // "each hit corrects, one at a time" resolution is refined
            // further below (POSITION_RELAXATION_ITERATIONS, after this
            // forEach) once every capsule's own swept hit has been
            // collected — real, reported "the ball still gets stuck
            // sometimes" behavior in a densely-packed entity cluster
            // traced to exactly this loop's own single-pass-only
            // resolution: segment B's own correction can reintroduce
            // overlap with segment A (or a DIFFERENT entity's own nearby
            // capsule) that a single pass never gets a chance to notice
            // or fix. Velocity effects (reflection + the collision kick,
            // right below) are NOT relaxed the same way — they still
            // apply once per capsule per tick, exactly as before; only
            // the ball's final POSITION gets the extra passes.
            const hitCapsules = [];
            entities.forEach(entity => {
                // cfg.collisionOnlyWhilePlaying (per explicit request) gates
                // ONLY this physical-collision block — the auto-trigger
                // check below (ballInFlickTriggerZone/anyBallInZone) is a
                // separate, independent check that must keep running for a
                // non-playing entity regardless of this checkbox, or an
                // idle entity could never receive the proximity trigger
                // that starts its own flick in the first place.
                if (entity.jointWorld && (!cfg.collisionOnlyWhilePlaying || entity.playing)) {
                    const segments = [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']];
                    segments.forEach(([aKey, bKey]) => {
                        const a = entity.jointWorld[aKey], b = entity.jointWorld[bKey];
                        if (!a || !b) return;
                        const thicknessPx = vmin * (cfg.jointThickness / 100); // fixed — never varies by frame/speed, per explicit instruction
                        const minDist = thicknessPx / 2 + radiusPx;
                        const cp = closestPointsBetweenSegments(prevBallX, prevBallY, ball.x, ball.y, a.x, a.y, b.x, b.y);
                        if (cp.distSq >= minDist * minDist) return;

                        const speedA = entity.jointSpeed[aKey] ?? 0, speedB = entity.jointSpeed[bKey] ?? 0;
                        const speed = speedA + (speedB - speedA) * cp.t; // still drives the collision KICK below, no longer the circle's size
                        const dist = Math.sqrt(cp.distSq);
                        const dx = cp.c1x - cp.c2x, dy = cp.c1y - cp.c2y;
                        const nx = dist > 0.0001 ? dx / dist : 0, ny = dist > 0.0001 ? dy / dist : -1;
                        const overlap = minDist - dist;
                        // Snap to the point ALONG THE BALL'S OWN PATH where
                        // it first came within minDist (cp.c1x/y, at
                        // parameter cp.s) rather than its raw end-of-tick
                        // position — this is what actually stops tunneling:
                        // even when the ball's final position had already
                        // passed clean through the capsule, cp.c1 is never
                        // further through than the real first contact.
                        ball.x = cp.c1x + nx * overlap;
                        ball.y = cp.c1y + ny * overlap;

                        // Reflect the ball's OWN incoming velocity off this
                        // segment's normal — same physics the wall bounce
                        // already applies (`vx = -vx * bounciness`), just
                        // generalized to an arbitrary normal direction
                        // instead of a fixed horizontal/vertical axis. This
                        // was the actual missing piece behind a direct
                        // report ("sometimes... the ball gets stuck to the
                        // hand" at high speed/certain angles): without it,
                        // only the segment's OWN motion could ever push the
                        // ball away (the kick below) — a fast ball hitting a
                        // momentarily slow-moving segment had its position
                        // corrected every tick but its own velocity left
                        // completely untouched, so gravity/momentum drove it
                        // right back into the same spot next tick,
                        // indefinitely. Standard velocity-reflection formula
                        // (v' = v - (1+e)(v·n)n), only applied while the
                        // ball is actually moving INTO the surface
                        // (incomingDotNormal < 0) — a ball already moving
                        // away (e.g. just kicked out by a previous segment
                        // this same tick) isn't reflected a second time.
                        // Reuses Ball Bounciness rather than a new slider —
                        // the same "how much of the ball's own energy
                        // survives a bounce" concept the wall collision
                        // already uses. The segment-motion kick (still
                        // added on top afterward, unchanged) is a separate,
                        // additional impulse from the flick itself, not a
                        // substitute for this reflection.
                        const incomingDotNormal = ball.vx * nx + ball.vy * ny;
                        if (incomingDotNormal < 0) {
                            const reflectScale = (1 + cfg.ballBounciness) * incomingDotNormal;
                            ball.vx -= reflectScale * nx;
                            ball.vy -= reflectScale * ny;
                        }
                        ball.vx += nx * speed * cfg.collisionIntensity;
                        ball.vy += ny * speed * cfg.collisionIntensity;
                        // Recorded for the position-only relaxation pass
                        // below — deliberately just {a, b, minDist}, not
                        // this hit's own now-stale cp/nx/ny (the ball's
                        // position has already moved since this was
                        // computed; relaxation re-measures fresh each
                        // pass against the capsule's own fixed endpoints).
                        hitCapsules.push({ a, b, minDist });
                    });
                }

                // Auto-trigger: a ball crossing INTO this entity's own
                // reachable zone (see ballInFlickTriggerZone's own
                // comment) starts ITS sequence, without requiring a
                // click — manual click-to-flick was retired entirely once
                // clicking became the spawn-placement gesture (see the
                // canvas pointerdown handler below). Accumulated across
                // every active ball this tick (anyBallInZone), rising-edge
                // applied once per entity below, after this forEach.
                if (ballInFlickTriggerZone(ball, entity.directionKey, entityRotationRad(entity), entity.x, entity.y)) {
                    anyBallInZone.set(entity, true);
                }
            });

            // Position-only relaxation — the actual fix for "the ball
            // still gets stuck sometimes" in a dense entity cluster (a
            // real, reported screenshot: ~16 entities in a tight ring).
            // The forEach above resolves each capsule's own hit ONE AT A
            // TIME, immediately mutating ball.x/y — when the ball is
            // simultaneously within range of 2+ capsules (routine in a
            // dense cluster, rare with only a few scattered entities),
            // segment B's own correction can silently reintroduce overlap
            // with segment A (or a different entity's own nearby
            // capsule), which that single pass has no way to notice or
            // fix, since it moves on rather than re-checking earlier
            // segments. This runs a few more passes over the SAME
            // capsules hitCapsules already collected — each pass
            // re-measures the ball's CURRENT position (a degenerate,
            // zero-length "swept" call to the existing
            // closestPointsBetweenSegments, i.e. a plain point-vs-segment
            // distance check — safe against a zero-length p1/q1 segment,
            // confirmed via that function's own a<=EPS branch) against
            // every capsule's own fixed endpoints, and pushes out along
            // whatever overlap remains. This is the same iterative-
            // relaxation technique this workspace's own DickoClicko
            // project already uses for its Verlet rope-constraint
            // solving — several cheap passes let the ball's final
            // position converge toward one that satisfies every nearby
            // capsule at once, instead of trusting whichever single
            // capsule happened to be resolved last. Position-only,
            // deliberately: velocity (reflection + the collision kick)
            // already applied once per capsule above, in the same forEach
            // — re-applying velocity effects per relaxation pass would
            // multiply the kick/reflection impulse unrealistically for a
            // ball genuinely resting in a multi-capsule pocket, which is
            // exactly the scenario this fix targets. Skipped entirely
            // when 0-1 capsules were hit (denser exactly where it's
            // needed, free everywhere else).
            const POSITION_RELAXATION_ITERATIONS = 4;
            if (hitCapsules.length > 1) {
                for (let iter = 0; iter < POSITION_RELAXATION_ITERATIONS; iter++) {
                    let anyOverlap = false;
                    hitCapsules.forEach(({ a, b, minDist }) => {
                        const cp = closestPointsBetweenSegments(ball.x, ball.y, ball.x, ball.y, a.x, a.y, b.x, b.y);
                        if (cp.distSq >= minDist * minDist) return;
                        anyOverlap = true;
                        const dist = Math.sqrt(cp.distSq);
                        const dx = cp.c1x - cp.c2x, dy = cp.c1y - cp.c2y;
                        const nx = dist > 0.0001 ? dx / dist : 0, ny = dist > 0.0001 ? dy / dist : -1;
                        const overlap = minDist - dist;
                        ball.x = cp.c1x + nx * overlap;
                        ball.y = cp.c1y + ny * overlap;
                    });
                    if (!anyOverlap) break; // converged early — most ticks resolve in 1 pass
                }
            }

            // Air Drag — exponential velocity decay, applied ONCE per
            // tick after every velocity change above (same "apply once,
            // after everything else" placement Ball Max Speed already
            // uses just below, for the same reason: consistent regardless
            // of which source changed the velocity this tick). 0 (default)
            // is an exact no-op (Math.pow(1,dt)=1), so existing behavior
            // is unchanged unless this is explicitly turned up.
            if (cfg.ballDrag > 0) {
                const dragRetain = Math.pow(1 - cfg.ballDrag, dt);
                ball.vx *= dragRetain;
                ball.vy *= dragRetain;
            }

            // Ball Max Speed — a hard cap on the ball's own speed, applied
            // ONCE per tick after every velocity change above (gravity,
            // wall bounce, the segment-reflection fix, AND the collision
            // kick) so it consistently caps the result regardless of which
            // of those pushed it over, rather than only capping one source.
            // Scales with vmin like every other ball quantity in this file
            // (ballGravity/ballRadius) so it stays proportionally correct
            // across viewport sizes.
            const maxSpeedPx = vmin * (cfg.ballMaxSpeed / 100);
            const speedSq = ball.vx * ball.vx + ball.vy * ball.vy;
            if (speedSq > maxSpeedPx * maxSpeedPx) {
                const scale = maxSpeedPx / Math.sqrt(speedSq);
                ball.vx *= scale;
                ball.vy *= scale;
            }

            // Fully below the bottom edge — gone. During a level
            // (isLevelActive() — any target rect placed), this generator
            // does NOT get a fresh respawn timer: per explicit spec,
            // balls don't respawn during a level, so "every ball gone"
            // is reachable and means something. Sandbox/free-flick play
            // with no target keeps today's respawn-forever behavior
            // exactly as it was before this feature (gen.exhausted stays
            // false and is never checked outside isLevelActive()).
            if (ball.y - radiusPx > h) {
                gen.ball = null;
                if (isLevelActive()) {
                    gen.exhausted = true;
                    if (!levelAttemptResolved && ballGenerators.every(g => !g.ball)) triggerLevelLose();
                } else {
                    gen.respawnCountdown = cfg.ballRespawnRate;
                }
            }
        });

        // Ball-to-ball collision — a separate top-level pass over every
        // unique pair of currently-active balls (needs pairs ACROSS
        // generators, so it can't live inside the single-ball forEach
        // above). Toggleable, default off — see resolveBallToBallCollision's
        // own comment. Sequential (not simultaneous) resolution, same
        // approach this file's existing collision code already uses.
        if (cfg.ballToBallCollisionEnabled) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            const activeBalls = ballGenerators.map(gen => gen.ball).filter(Boolean);
            for (let i = 0; i < activeBalls.length; i++) {
                for (let j = i + 1; j < activeBalls.length; j++) {
                    resolveBallToBallCollision(activeBalls[i], activeBalls[j], radiusPx);
                }
            }
        }

        // Rising-edge trigger, once per entity, using the OR across every
        // ball active this tick — same semantics as the original single-
        // ball version (a ball simply sitting in the zone doesn't keep
        // re-triggering, and !entity.playing keeps a ball that entered
        // mid-flick from double-triggering the instant that flick ends
        // while it's still sitting there), generalized to "any ball" in
        // place of "the one ball that used to be the only possibility."
        // Also excludes an entity currently mid-Win/Lose (!entity.winLoseType)
        // — a REAL bug this fixes, not a defensive guess: entity.playing is
        // false throughout a Win/Lose sequence (by design, so the 2 systems
        // don't visually fight over render()'s draw dispatch), so without
        // this check a ball drifting near a Win/Lose-active entity would
        // silently ALSO triggerFlick() a normal flick underneath it —
        // invisible on screen (winLoseType still wins the draw dispatch)
        // but entityRealFrameNumber() (which drives the actual collision
        // geometry) would start tracking that accidental flick's own
        // animating frames instead of the static idle pose, desyncing
        // collision geometry from what's shown. Reported directly as "the
        // ball still gets stuck sometimes" in a dense ring of many
        // Win-animating entities — exactly the scenario where several
        // entities doing this independently and asynchronously would
        // produce an unpredictable, shifting collision field.
        entities.forEach(entity => {
            const inTriggerZone = anyBallInZone.get(entity) || false;
            if (inTriggerZone && !entity.wasInFlickTriggerZone && !entity.playing && !entity.winLoseType) triggerFlick(entity);
            entity.wasInFlickTriggerZone = inTriggerZone;
        });
    }

    // ----------------------------------------------------------------
    // Canvas + mouse tracking
    // ----------------------------------------------------------------
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    // Capped at 2, not the raw window.devicePixelRatio — a real, reported
    // mobile performance issue ("placing, rotating, moving... very very
    // laggy"): many phones report a DPR of 3 (some higher), which makes
    // the canvas's own BACKING STORE 9x more pixels than DPR 1 for the
    // exact same on-screen CSS size (3x width * 3x height) — every single
    // fillRect/drawImage this file does fills into that 9x larger buffer.
    // Capping to 2 (4x, not 9x) is a well-established mobile canvas
    // performance practice; visually near-indistinguishable from
    // uncapped on a real device (2x is already a sharp "retina" density),
    // especially for soft-edged sprite art like this project's own. Used
    // both here and in update()'s own self-healing size-mismatch check
    // below — those 2 MUST agree, or the self-heal check would see a
    // permanent "wrong size" mismatch against an uncapped comparison and
    // call resizeCanvas() (which reallocates the whole backing store)
    // every single frame, a far worse perf problem than the one this
    // exists to fix.
    function effectiveDpr() {
        return Math.min(window.devicePixelRatio || 1, 2);
    }
    function resizeCanvas() {
        const dpr = effectiveDpr();
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Also hidden while placing balls (the ball-shaped preview drawn in
    // render() IS the cursor at that point, per explicit request: "my
    // cursor becomes the ball geometry") — a single shared function so
    // toggling Hide OS Cursor mid-placement can't clobber that state.
    function applyCursorVisibility() {
        canvas.classList.toggle('cursor-hidden', cfg.hideCursor || ballPlacementMode);
    }
    applyCursorVisibility();

    // mouseX/mouseY only ever come from a real pointermove event now (no
    // longer re-derived from window.innerWidth/innerHeight as a fallback —
    // there's no continuously-following entity left to re-center). hasMouse
    // just gates render()'s own live spawn-preview line, so it doesn't draw
    // toward a stale (0,0) before the very first real mouse movement.
    let mouseX = 0, mouseY = 0;
    let hasMouse = false;
    // Base/end-point drag state (Stop-mode entity adjustment, below) — the
    // entity currently being dragged and which of its 2 points ('base' |
    // 'end'), or null when nothing's being dragged. Lives here (not with
    // pendingSpawnStart, further down) specifically so the pointermove
    // handler right below — the only place drag position updates actually
    // happen — can read it directly.
    let draggingEntity = null;
    let draggingPoint = null;
    window.addEventListener('pointermove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        hasMouse = true;
        if (draggingEntity) {
            if (draggingPoint === 'mid') {
                // Translate the whole entity — both endpoints move
                // together by the same delta, so the line's own length AND
                // angle (rotation/direction) stay exactly what they were.
                // This is the dedicated "move" handle (per explicit
                // request, replacing the base dot's old dual-purpose
                // move+independent-anchor role below) — the delta is
                // computed from the CURRENT midpoint so the yellow dot
                // itself always ends up exactly under the cursor, the same
                // way the base/end dots already track the cursor 1:1 while
                // being dragged.
                const midX = (draggingEntity.x + draggingEntity.endX) / 2;
                const midY = (draggingEntity.y + draggingEntity.endY) / 2;
                const dx = mouseX - midX, dy = mouseY - midY;
                draggingEntity.x += dx;
                draggingEntity.y += dy;
                draggingEntity.endX += dx;
                draggingEntity.endY += dy;
            } else if (draggingPoint === 'base' || draggingPoint === 'end') {
                // Both endpoints move fully independently now (per explicit
                // request: "the 2 endpoints... will move independently...
                // I want the opposite to be true [of only end rotating
                // around base]") — whichever dot ISN'T being dragged is
                // this drag's fixed anchor/pivot, the exact same
                // move-one-point/pivot-on-the-other logic either way, just
                // with the 2 property pairs swapped. directionKey always
                // needs updating (via the same bucketing
                // spawnEntityFromLine() uses) — rotation itself is no
                // longer stored, it's recomputed live from endX/endY every
                // time it's needed (see entityRotationRad()).
                const movingIsBase = draggingPoint === 'base';
                const pivotX = movingIsBase ? draggingEntity.endX : draggingEntity.x;
                const pivotY = movingIsBase ? draggingEntity.endY : draggingEntity.y;
                if (movingIsBase) { draggingEntity.x = mouseX; draggingEntity.y = mouseY; }
                else { draggingEntity.endX = mouseX; draggingEntity.endY = mouseY; }
                const dist = Math.hypot(mouseX - pivotX, mouseY - pivotY);
                if (dist > 0.0001) {
                    // Direction bucketing is always "the aim/end point's
                    // angle as seen from the base point" regardless of
                    // which one is actually the one moving right now — same
                    // formula spawnEntityFromLine()/the old end-only drag
                    // both already used.
                    const lineAngle = mouseAngleFromCenter(draggingEntity.endX, draggingEntity.endY, draggingEntity.x, draggingEntity.y);
                    const dirIndex = directionIndexForAngle(lineAngle);
                    const directionKey = DIRECTIONS[dirIndex].key;
                    if (directionKey !== draggingEntity.directionKey) {
                        draggingEntity.directionKey = directionKey;
                        ensureDirectionLoaded(directionKey);
                    }
                }
                // Same MAX_PLACEMENT_LINE_RATIO cap as initial placement,
                // per explicit request — an already-placed entity's own
                // dot drag shouldn't be able to exceed the same "2 hand
                // lengths" limit a fresh placement can't, regardless of
                // which of the 2 points is the one being dragged.
                // clampLineEndpoint(directionKey, pivotX, pivotY, rawX,
                // rawY) treats the pivot as the fixed point and clamps the
                // OTHER (moving) point relative to it — works unchanged for
                // either direction of drag, just fed the current pivot.
                const clamped = clampLineEndpoint(draggingEntity.directionKey, pivotX, pivotY, movingIsBase ? draggingEntity.x : draggingEntity.endX, movingIsBase ? draggingEntity.y : draggingEntity.endY);
                if (movingIsBase) { draggingEntity.x = clamped.x; draggingEntity.y = clamped.y; }
                else { draggingEntity.endX = clamped.x; draggingEntity.endY = clamped.y; }
            }
        } else if (draggingRect) {
            const rect = draggingRect;
            if (draggingRectHandle === 'move') {
                // Center handle — tracks the cursor 1:1, same feel as the
                // entity's own yellow mid-dot.
                rect.x = mouseX;
                rect.y = mouseY;
            } else if (draggingRectHandle === 'rotate') {
                // Free rotation about the rect's own center — no 8-way
                // bucketing (unlike entity direction), since a wall/
                // floor/target's tilt is purely geometric.
                rect.rotation = mouseAngleFromCenter(mouseX, mouseY, rect.x, rect.y) * Math.PI / 180;
            } else if (draggingRectHandle && draggingRectHandle.startsWith('resize-') && resizePivotWorld) {
                // Rotation is held fixed during a resize. Transform the
                // mouse position into the rect's own (unrotated) local
                // frame relative to the FIXED opposite-corner pivot —
                // w/h/center all derive from that same local-space
                // vector regardless of the rect's current tilt.
                const dx = mouseX - resizePivotWorld.x, dy = mouseY - resizePivotWorld.y;
                const cos = Math.cos(-rect.rotation), sin = Math.sin(-rect.rotation);
                const localDx = dx * cos - dy * sin, localDy = dx * sin + dy * cos;
                const signX = localDx < 0 ? -1 : 1, signY = localDy < 0 ? -1 : 1;
                rect.w = Math.max(RECT_MIN_SIZE, Math.abs(localDx));
                rect.h = Math.max(RECT_MIN_SIZE, Math.abs(localDy));
                // New center is the midpoint between the fixed pivot and
                // the (now-clamped) dragged corner, in local space
                // relative to the pivot, rotated back to world space.
                const localCenterX = signX * rect.w / 2, localCenterY = signY * rect.h / 2;
                const wcos = Math.cos(rect.rotation), wsin = Math.sin(rect.rotation);
                rect.x = resizePivotWorld.x + localCenterX * wcos - localCenterY * wsin;
                rect.y = resizePivotWorld.y + localCenterX * wsin + localCenterY * wcos;
            }
        }
    });
    window.addEventListener('pointerup', (e) => {
        draggingEntity = null;
        draggingPoint = null;
        draggingRect = null;
        draggingRectHandle = null;
        resizePivotWorld = null;

        // Rectangle/Target rubber-band completion — the release point is
        // the opposite corner from pendingRectStart (set on pointerdown
        // above). Center is always the midpoint of the 2 points regardless
        // of clamping, so a tiny/zero-distance release (a plain click, no
        // real drag) grows symmetrically to RECT_MIN_SIZE around where the
        // user actually clicked, rather than producing a degenerate
        // invisible rect or one that jumps away from the click point.
        if (pendingRectStart) {
            const x0 = pendingRectStart.x, y0 = pendingRectStart.y;
            const x1 = e.clientX, y1 = e.clientY;
            levelRects.push({
                x: (x0 + x1) / 2, y: (y0 + y1) / 2,
                w: Math.max(RECT_MIN_SIZE, Math.abs(x1 - x0)),
                h: Math.max(RECT_MIN_SIZE, Math.abs(y1 - y0)),
                rotation: 0,
                type: rectPlacementMode ? 'solid' : 'target',
                targetMode: 'instant', settleDuration: 2.0,
            });
            pendingRectStart = null;
        }

        // Tap-and-drag placement (mobile) — an alternative to the 2-
        // SEPARATE-taps gesture in the pointerdown handler below, not a
        // replacement for it: press for the 1st point, drag, release for
        // the 2nd. Only completes when this release is the SAME press
        // that started the current pendingSpawnStart (matched by
        // pointerId — so an unrelated pointerup, e.g. a 2nd finger,
        // can't accidentally finish it) AND moved a real minimum
        // distance (MIN_DRAG_PLACEMENT_DISTANCE) from the start — a
        // plain tap-then-release (near-zero distance, including ordinary
        // touch jitter) must NOT auto-complete, or every 1st tap of the
        // existing 2-tap flow would immediately finish a degenerate
        // placement on its own release instead of waiting for a real 2nd
        // tap.
        if (pendingSpawnStart && (!running || cfg.allowPlacementWhileRunning) && e.pointerId === spawnPointerId) {
            const dist = Math.hypot(e.clientX - pendingSpawnStart.x, e.clientY - pendingSpawnStart.y);
            if (dist > MIN_DRAG_PLACEMENT_DISTANCE) {
                // Max Hands budget — see canPlaceAnotherHand(). The
                // pending gesture is still cleared either way (declining
                // silently, not leaving a stuck drag state the user can't
                // escape).
                if (canPlaceAnotherHand()) spawnEntityFromLine(pendingSpawnStart.x, pendingSpawnStart.y, e.clientX, e.clientY);
                pendingSpawnStart = null;
                spawnPointerId = null;
            }
        }
    });
    // A cancelled pointer (OS interruption, an edge-swipe navigation
    // gesture, etc.) never fires pointerup — without this, a cancelled
    // press-drag would leave pendingSpawnStart/spawnPointerId stuck,
    // silently blocking every future placement (since the pointerdown
    // handler above only starts a new spawn when pendingSpawnStart is
    // already null) until an unrelated tap happened to land far enough
    // away to complete the stale gesture. Treat a cancel the same as an
    // abandoned gesture, for both drag types.
    window.addEventListener('pointercancel', (e) => {
        draggingEntity = null;
        draggingPoint = null;
        if (e.pointerId === spawnPointerId) {
            pendingSpawnStart = null;
            spawnPointerId = null;
        }
    });

    // ----------------------------------------------------------------
    // Angle math. "Up" (0°) = directly above a given pivot point; angle
    // increases CLOCKWISE. Originally verified (back when there was a
    // single mouse-anchored entity) against 2 concrete cases: mouse
    // directly above the viewport center -> 0° (bucket "Behind"); mouse
    // directly right of center -> 90° (bucket "Side Thumb"). Reused as-is
    // for the spawn-placement line's own angle below — mouseAngleFromCenter(end,
    // start) gives exactly "the angle of `end` as seen from `start`",
    // which is exactly a spawned entity's own aim direction, no change to
    // the function itself needed.
    // ----------------------------------------------------------------
    function mouseAngleFromCenter(mx, my, cx, cy) {
        const dx = mx - cx, dy = my - cy;
        let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
        return (deg + 360) % 360;
    }
    // 8 sectors of 45°, centered on 0/45/90/.../315 — matches the exact
    // boundaries given (-22.5..22.5 = index 0, etc). cfg.angleOffset
    // rotates the whole wheel as one calibration knob rather than 8
    // independent (and easily inconsistent) per-boundary sliders, since
    // the sectors are rigidly uniform by spec.
    function directionIndexForAngle(angleDeg) {
        const shifted = (angleDeg + cfg.angleOffset + 22.5 + 3600) % 360;
        return Math.floor(shifted / 45) % 8;
    }

    // angleLerp/expSmoothFactor are still used elsewhere (expSmoothFactor
    // by the collision-speed smoothing in updateBallAndCollision), but
    // angleLerp itself is currently UNUSED — it only ever eased a single
    // entity's rotation toward a continuously-moving mouse target, which
    // no longer exists now that entities are spawned once and never move.
    // Left defined (harmless, cheap) rather than deleted, in case a future
    // spawn-in ease transition wants it — flagged here rather than removed
    // silently.
    function angleLerp(current, target, factor) {
        let delta = ((target - current + 540) % 360) - 180;
        return current + delta * factor;
    }
    function expSmoothFactor(smoothing, dt) {
        if (smoothing >= 1) return 1;
        return 1 - Math.pow(1 - smoothing, dt * 60);
    }

    // ----------------------------------------------------------------
    // Entities: no longer a single mouse-anchored entity — the animation
    // is invisible until placed. Each entity is spawned via a 2-click
    // gesture (see the pointerdown handler below) and then permanently
    // fixed: its position, rotation, and direction bucket never change
    // again, only its own play state (idle vs. playing a flick, driven
    // solely by the ball-proximity trigger — manual click-to-flick was
    // retired once clicking became the spawn gesture, per explicit
    // request). cfg.entityScale/clickAnimSpeed/peakHoldFrames and the
    // per-direction rotation-offset map all stay GLOBAL, shared by every
    // entity — only position/rotation/direction/play-state are per-entity.
    // ----------------------------------------------------------------
    let entities = [];
    // Named, saved entity arrangements ("scenes") — per explicit request
    // ("if i placed entities very carefully and i like it, i want to be
    // able to save it and come back to it"). Keyed by scene name; each
    // value is just an array of {x,y,endX,endY} — the same 4 numbers
    // spawnEntityFromLine() itself takes, deliberately NOT the full
    // entity object (playing/jointWorld/etc. are transient runtime state,
    // meaningless to persist and cheap to re-derive on load). Saved as
    // part of the SAME git-tracked dev-panel-settings.json file (see
    // captureFullDevPanelState()'s own `scenes` field) rather than a
    // separate Vercel endpoint/file — reuses the existing 3-tier Save
    // Settings pipeline with zero server-side changes, per explicit
    // choice over a from-scratch persistence layer.
    let scenes = {};
    const FLICK_BASE_FPS = 12;

    // The first click of a pending 2-click placement — {x,y} while
    // awaiting the second click, null otherwise. Purely UI/interaction
    // state, not simulation — updated directly by the pointerdown handler
    // (not inside step()), read by render() to draw the live aim-preview
    // line.
    let pendingSpawnStart = null;
    // Which pointer (touch/mouse) started the CURRENT pendingSpawnStart —
    // lets the pointerup handler recognize "this is the same press being
    // released" for tap-and-drag placement (see that handler's own
    // comment), without also mistaking an unrelated pointerup (e.g. a
    // 2nd finger) for the drag's own release.
    let spawnPointerId = null;
    // Minimum real movement (px) between press and release for a
    // tap-and-drag release to count as "the 2nd point" rather than an
    // ordinary tap's own natural touch jitter — per explicit request
    // ("on mobile... click for the first point, then drag to the second
    // point"), added ALONGSIDE the existing 2-separate-taps gesture, not
    // in place of it. A plain tap-then-release (dist ~0) must keep
    // leaving pendingSpawnStart active for a real 2nd tap, exactly like
    // before, or every 1st tap of the existing flow would immediately
    // "complete" a degenerate placement on its own release.
    const MIN_DRAG_PLACEMENT_DISTANCE = 24;

    // Shared by a real click AND the ball-proximity auto-trigger
    // (ballInFlickTriggerZone, checked inside updateBallAndCollision) —
    // both just start the same forward+reverse play sequence on the given
    // entity, for whichever direction it was spawned with.
    function triggerFlick(entity) {
        entity.playing = true;
        entity.playFrameIndex = 0;
        entity.playFrameAccum = 0;
        entity.playSequenceFrozen = ensureDirectionLoaded(entity.directionKey).playSequence;
    }

    // Win/Lose test sequences — per explicit request. Triggered by the
    // Win/Lose buttons (wired below), applied to EVERY currently-placed
    // entity at once ("every placed entity on screen will transition into
    // the appropriate animation sequence"), each using its own
    // directionKey's own win/lose asset set. Cancels any in-progress
    // normal flick on that entity first (winLoseType takes over the
    // entity's own rendering entirely — see render()'s own draw dispatch —
    // so the 2 states must never both be active at once).
    //
    // The state machine itself (advanced in step(), below) has 5 phases,
    // per the exact spec: "frames will be played sequentially until frame
    // _013 is reached[, held,] afterwhich it will finish the sequence of
    // frames[. At frame _24, held again], afterwhich the entire sequence
    // will be played in reverse without any in between frame holding" —
    // frame numbers below are the ORIGINAL 24-frame default; each entity's
    // own real pause/end frames (winLoseFistIndex/winLoseLastIndex, set by
    // triggerWinLoseSequence() from that direction+type's own real
    // frameCount) are what the code actually uses, so a different-length
    // asset (e.g. 'behind-thumb'.win at 48 frames — see WIN_LOSE_ASSETS'
    // own comment) pauses/ends at its own correctly-scaled frame, not
    // these fixed numbers:
    //   forward1  — frame index 0 (=_001) advancing up to winLoseFistIndex (12 =_013, at the 24-frame default)
    //   holdFist  — frozen at winLoseFistIndex, for cfg.winLoseFistHoldDuration
    //   forward2  — continues from winLoseFistIndex up to winLoseLastIndex (23 =_024, at the 24-frame default), no reset to 0
    //   holdFinal — frozen at winLoseLastIndex, for cfg.winLoseFinalHoldDuration
    //   reverse   — winLoseLastIndex back down to 0, continuously, no holding at winLoseFistIndex this
    //               time ("without any in between frame holding")
    // Sequence ends (winLoseType cleared, entity returns to its own normal
    // idle rendering) once reverse reaches index 0.
    function triggerWinLoseSequence(type) {
        entities.forEach(entity => {
            entity.playing = false;
            entity.playSequenceFrozen = null;
            entity.playFrameIndex = 0;
            entity.playFrameAccum = 0;
            entity.winLoseType = type;
            entity.winLosePhase = 'forward1';
            entity.winLoseFrameAccum = 0;
            entity.winLoseHoldRemaining = 0;
            // Per-entity, derived from THIS direction+type's own real
            // frameCount (see WIN_LOSE_ASSETS' own comment) — not a
            // shared global, since different assets can now have
            // genuinely different frame counts (e.g. 'behind-thumb'.win
            // at 48 vs. the 24-frame default everywhere else).
            const asset = WIN_LOSE_ASSETS[entity.directionKey] && WIN_LOSE_ASSETS[entity.directionKey][type];
            const frameCount = asset ? asset.frameCount : 24;
            entity.winLoseFistIndex = Math.floor(frameCount / 2); // 0-based — 24->12 (frame_013), 48->24 (frame_025)
            entity.winLoseLastIndex = frameCount - 1;
            ensureWinLoseLoaded(entity.directionKey, type);
        });
    }
    // Level win/lose auto-triggers — thin wrappers around
    // triggerWinLoseSequence(), guarded by levelAttemptResolved so each
    // fires at most once per Start->result cycle (setRunning(true) resets
    // the guard for a fresh attempt). Per explicit spec: the moment
    // either fires, the sim auto-toggles back to Stop (clearing every
    // ball) while entities keep playing out their win/lose animation —
    // advanceWinLoseSequences() already runs regardless of `running`, so
    // stopping here doesn't interrupt it.
    function triggerLevelWin() {
        if (levelAttemptResolved) return;
        levelAttemptResolved = true;
        triggerWinLoseSequence('win');
        setRunning(false);
    }
    function triggerLevelLose() {
        if (levelAttemptResolved) return;
        levelAttemptResolved = true;
        triggerWinLoseSequence('lose');
        setRunning(false);
    }

    // Spawns a new entity anchored at (startX,startY) — the FIRST click —
    // pointing along the line toward (endX,endY) — the SECOND click — per
    // explicit spec ("click once, defining the start point, and click
    // again, defining the end point... spawned on screen" / confirmed via
    // AskUserQuestion: the start point is the entity's fixed anchor).
    // lineAngle reuses mouseAngleFromCenter() by treating the START point
    // as the pivot and the END point as "the point whose angle we want" —
    // this is literally "the angle of end as seen from start", i.e. the
    // start->end direction, in the same 0=up/clockwise convention the
    // rest of this file already uses. Rotation is lineAngle DIRECTLY (no
    // +180, unlike the old mouse-anchored entity's own rotation formula)
    // since the entity should point THE SAME way the line points (toward
    // where the user aimed), not the opposite way (the old model pointed
    // BACK toward a fixed center from a moving mouse — a genuinely
    // different geometric relationship). Verified with the same kind of
    // concrete case the old formula was checked against: end directly
    // above start (dx=0, dy<0) -> lineAngle=0° -> rotationRad=0 -> the
    // sprite's own already-"pointing up" art needs no rotation at all to
    // point at an end point that's directly above where it's anchored —
    // correct.
    function spawnEntityFromLine(startX, startY, endX, endY) {
        const lineAngle = mouseAngleFromCenter(endX, endY, startX, startY);
        const dirIndex = directionIndexForAngle(lineAngle);
        const directionKey = DIRECTIONS[dirIndex].key;
        // Cap the actual committed aim point at MAX_PLACEMENT_LINE_RATIO
        // (2) hand-lengths from the base, per explicit request — angle
        // (and therefore direction/rotation, already resolved above from
        // the RAW endX/endY) is unaffected, only how far out the stored
        // point itself is allowed to sit.
        ({ x: endX, y: endY } = clampLineEndpoint(directionKey, startX, startY, endX, endY));
        entities.push({
            // endX/endY (the 2nd click that originally set the aim
            // direction) are kept around, not just baked into a frozen
            // rotation value — Stop-mode's 2 draggable dots need a real
            // screen point to render/hit-test the "end" handle at, AND
            // (per explicit request) an already-placed entity's rotation
            // must keep tracking a LIVE dev-panel change to Hand Rotation
            // Offset, not just whatever offset happened to be set at spawn
            // time. See entityRotationRad() below — rotationRad is
            // deliberately NOT stored on the entity at all, only
            // recomputed from endX/endY + the CURRENT cfg offset every
            // time it's needed.
            x: startX, y: startY, endX, endY, directionKey,
            playing: false, playFrameIndex: 0, playFrameAccum: 0, playSequenceFrozen: null,
            wasInFlickTriggerZone: false, prevJointLocal: null, smoothedJointSpeed: {},
            jointWorld: null, jointSpeed: {},
            // Win/Lose test-sequence state — see triggerWinLoseSequence()'s
            // own comment for the full state machine this drives.
            winLoseType: null, winLosePhase: null, winLoseFrameAccum: 0, winLoseHoldRemaining: 0,
            winLoseFistIndex: 0, winLoseLastIndex: 0, // real values set by triggerWinLoseSequence() when a sequence actually starts
        });
        ensureDirectionLoaded(directionKey);
        // Prefetch this direction's own Win/Lose frames right away too —
        // not waiting for an actual Win/Lose click to start those 2x24
        // fetches — so the network has a head start before the button is
        // ever pressed. Real, reported symptom this reduces the odds of
        // hitting at all ("on a hard refresh, the first time i hit Win
        // and Lose... they each flash in succession" — the render-side
        // idle-frame fallback, see render()'s own comment, is what
        // actually eliminates the visible flash even on a cold cache;
        // this prefetch just makes a cold cache less likely in the first
        // place for the common case of placing entities, looking them
        // over, THEN clicking Win/Lose).
        ensureWinLoseLoaded(directionKey, 'win');
        ensureWinLoseLoaded(directionKey, 'lose');
    }

    // Recomputes an entity's current rotation LIVE from its own fixed
    // endX/endY plus the direction's CURRENT cfg.entityRotationOffsetByDirection
    // value, rather than reading a value frozen at spawn/drag time — this
    // is what makes moving the Hand Rotation Offset slider immediately
    // rotate every already-placed entity of that direction, per explicit
    // request, with no extra bookkeeping needed when the slider changes.
    function entityRotationRad(entity) {
        const lineAngle = mouseAngleFromCenter(entity.endX, entity.endY, entity.x, entity.y);
        return (lineAngle + (cfg.entityRotationOffsetByDirection[entity.directionKey] || 0)) * Math.PI / 180;
    }

    // Flick Speed Multiplier — per explicit request (originally scaled
    // the flick's own ball-collision-kick strength — "Flick Intensity" —
    // then explicitly REPURPOSED to scale the flick's own ANIMATION
    // PLAYBACK SPEED instead: "instead of the intensity, make it control
    // the hand animation speed"; see step()'s own usage below for where
    // this actually applies now). A placement line's own length (base to
    // aim point) still drives it exactly as before — only what it's
    // multiplied INTO changed, not the formula itself. Up to 100% of the
    // direction's own VISIBLE content height (at the CURRENT Entity
    // Scale) -> 1x (baseline, unchanged playback speed); 100%-200% of
    // that height -> linear ramp 1x-2x; 200%+ -> capped at 2x (also now
    // the real, visible line-length cap — see clampLineEndpoint() below).
    // Since the 1x-2x multiplier range maps onto the exact same 1x-2x
    // distance-ratio range, the mapping is simply the ratio itself,
    // clamped — no separate interpolation formula needed.
    // Takes raw (directionKey, startX, startY, endX, endY) rather than an
    // entity object so the SAME formula can preview a not-yet-placed
    // gesture (render()'s live spawn/drag preview, below) without
    // fabricating a fake entity — entityFlickSpeedMultiplier() (right
    // after this) is the thin per-entity wrapper real entities use.
    // Shared by flickSpeedMultiplierForLine() and clampLineEndpoint()
    // (below) — one direction's own visible-content height in CURRENT
    // on-screen pixels (tracks Entity Scale live, same as before this was
    // factored out).
    function visibleHeightPxForDirection(directionKey) {
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const size = vmin * (cfg.entityScale / 100);
        const refImg = ensureDirectionLoaded(directionKey).frames[0];
        const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
        const drawH = size * aspect;
        return drawH * visibleBoundsForDirection(directionKey).heightFrac;
    }
    function flickSpeedMultiplierForLine(directionKey, startX, startY, endX, endY) {
        const visibleHeightPx = visibleHeightPxForDirection(directionKey);
        if (visibleHeightPx <= 0) return 1;
        const distPx = Math.hypot(endX - startX, endY - startY);
        return Math.min(2, Math.max(1, distPx / visibleHeightPx));
    }
    // Per explicit request ("cap the actual length of the visible dotted
    // line to 2x the length of the visible part of the animation frame" /
    // "IE 2 hand lengths"): the placement/adjustment line's own real
    // length is capped at MAX_PLACEMENT_LINE_RATIO times the direction's
    // own visible content height — not just the derived Flick Speed
    // Multiplier (which already saturated at 2x on its own regardless of
    // raw distance; this is a SEPARATE, additional cap on the actual
    // point itself). Returns a point along the SAME start->end angle,
    // pulled in to at most that distance — the angle (and therefore
    // direction bucket/rotation) is never affected, only how far out the
    // end point is allowed to sit.
    const MAX_PLACEMENT_LINE_RATIO = 2;
    function clampLineEndpoint(directionKey, startX, startY, rawEndX, rawEndY) {
        const maxDist = visibleHeightPxForDirection(directionKey) * MAX_PLACEMENT_LINE_RATIO;
        if (!(maxDist > 0)) return { x: rawEndX, y: rawEndY };
        const dx = rawEndX - startX, dy = rawEndY - startY;
        const dist = Math.hypot(dx, dy);
        if (dist <= maxDist || dist <= 0.0001) return { x: rawEndX, y: rawEndY };
        const scale = maxDist / dist;
        return { x: startX + dx * scale, y: startY + dy * scale };
    }
    // Recomputed live from the entity's own permanent endX/endY every time
    // it's needed (same pattern as entityRotationRad() just above), NOT
    // frozen at spawn time, so it also tracks a live Entity Scale change
    // and a Stop-mode end-dot drag, exactly like rotation already does.
    function entityFlickSpeedMultiplier(entity) {
        return flickSpeedMultiplierForLine(entity.directionKey, entity.x, entity.y, entity.endX, entity.endY);
    }

    // Stop-mode entity-adjustment: hit-tests every entity's own base (x,y)
    // and end (endX,endY) dot against a click point, nearest/topmost first
    // (iterated back-to-front so a later-spawned, visually-on-top entity's
    // dot wins a tie over an earlier one sitting underneath it). A fixed
    // px hit radius (not %vmin-scaled) — this is a tap-target size, which
    // per this workspace's own dev-panel convention (CLAUDE.md §12a) is
    // exactly the kind of value that should stay a constant real-world
    // size, not one that shrinks on a small viewport.
    const ENTITY_DOT_HIT_RADIUS = 14;
    function hitTestEntityDot(x, y) {
        for (let i = entities.length - 1; i >= 0; i--) {
            const entity = entities[i];
            // Mid (yellow, whole-entity move handle) checked first — on a
            // short line its hit circle can overlap base/end's, and the
            // move handle is the more commonly reached-for gesture.
            const midX = (entity.x + entity.endX) / 2, midY = (entity.y + entity.endY) / 2;
            if (Math.hypot(x - midX, y - midY) <= ENTITY_DOT_HIT_RADIUS) return { entity, point: 'mid' };
            if (Math.hypot(x - entity.x, y - entity.y) <= ENTITY_DOT_HIT_RADIUS) return { entity, point: 'base' };
            if (Math.hypot(x - entity.endX, y - entity.endY) <= ENTITY_DOT_HIT_RADIUS) return { entity, point: 'end' };
        }
        return null;
    }
    // Delete-mode hit-test for a placed ball spawn point — same tap-target
    // sizing idea as ENTITY_DOT_HIT_RADIUS, but at least as big as the
    // actual drawn ball-radius marker (see render()'s own spawn-point
    // drawing), so a large configured Ball Radius doesn't leave part of
    // its own visible marker outside its clickable area. Returns an
    // INDEX into ballSpawnPoints (splice-ready), or -1.
    function hitTestBallSpawnPoint(x, y) {
        const radiusPx = Math.min(window.innerWidth, window.innerHeight) * (cfg.ballRadius / 100);
        const hitRadius = Math.max(ENTITY_DOT_HIT_RADIUS, radiusPx);
        for (let i = ballSpawnPoints.length - 1; i >= 0; i--) {
            const p = ballSpawnPoints[i];
            if (Math.hypot(x - p.x, y - p.y) <= hitRadius) return i;
        }
        return -1;
    }

    // Level-rect adjustment handles — same rotation-aware local-space
    // hit-testing technique hitTestEntitySprite already uses below
    // (rotate the click point by -rotation around the rect's own
    // center, same as inverting the render transform). Checked
    // nearest-drawn-first like hitTestEntityDot. 'move' (center) is
    // checked first for the same reason mid is checked first there —
    // it's the most commonly reached-for gesture and its hit circle can
    // overlap the corner handles on a small rect.
    const RECT_HANDLE_HIT_RADIUS = 14;
    const ROTATION_HANDLE_OFFSET = 24;
    function hitTestRectHandle(x, y) {
        for (let i = levelRects.length - 1; i >= 0; i--) {
            const rect = levelRects[i];
            const dx = x - rect.x, dy = y - rect.y;
            const cos = Math.cos(-rect.rotation), sin = Math.sin(-rect.rotation);
            const localX = dx * cos - dy * sin, localY = dx * sin + dy * cos;
            if (Math.hypot(localX, localY) <= RECT_HANDLE_HIT_RADIUS) return { rect, handle: 'move' };
            const halfW = rect.w / 2, halfH = rect.h / 2;
            const corners = [
                ['resize-tl', -halfW, -halfH], ['resize-tr', halfW, -halfH],
                ['resize-bl', -halfW, halfH], ['resize-br', halfW, halfH],
            ];
            for (const [handle, cxL, cyL] of corners) {
                if (Math.hypot(localX - cxL, localY - cyL) <= RECT_HANDLE_HIT_RADIUS) return { rect, handle };
            }
            const rotY = -halfH - ROTATION_HANDLE_OFFSET;
            if (Math.hypot(localX, localY - rotY) <= RECT_HANDLE_HIT_RADIUS) return { rect, handle: 'rotate' };
        }
        return null;
    }
    // Delete-mode hit-test for a placed level rect — a local-space
    // bounding-box containment check (no per-pixel alpha test needed,
    // unlike hitTestEntitySprite, since a rect's own drawn shape already
    // IS its hitbox — no transparent padding to avoid).
    function hitTestRectBody(x, y) {
        for (let i = levelRects.length - 1; i >= 0; i--) {
            const rect = levelRects[i];
