            const dx = x - rect.x, dy = y - rect.y;
            const cos = Math.cos(-rect.rotation), sin = Math.sin(-rect.rotation);
            const localX = dx * cos - dy * sin, localY = dx * sin + dy * cos;
            if (Math.abs(localX) <= rect.w / 2 && Math.abs(localY) <= rect.h / 2) return rect;
        }
        return null;
    }

    // Per-direction offscreen canvas holding that direction's idle (frame 1)
    // pixels at full natural resolution — drawn ONCE per direction (cached),
    // used ONLY for delete-mode's per-pixel opacity check below. Safe to
    // draw at full res here (unlike the old, removed anchor-point scan):
    // this only ever runs on a rare, human-paced pointerdown click while
    // Delete mode is active, never per-frame/per-render, and a single
    // drawImage() with no pixel readback is cheap regardless of source size
    // — the actual getImageData() call below reads exactly 1 pixel.
    const directionAlphaCanvasCache = {};
    function getDirectionAlphaCanvas(directionKey) {
        if (directionAlphaCanvasCache[directionKey]) return directionAlphaCanvasCache[directionKey];
        const img = ensureDirectionLoaded(directionKey).frames[0];
        if (!img || !img.complete || img.naturalWidth === 0) return null;
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        const entry = { ctx, w: img.naturalWidth, h: img.naturalHeight };
        directionAlphaCanvasCache[directionKey] = entry;
        return entry;
    }
    // (localX,localY) is a point already known to fall within [left,left+drawW]
    // x [top,top+drawH] (the entity's own bounding box, in the SAME local
    // unrotated space hitTestEntitySprite computes) — maps it to a fraction
    // of that box, then to the source image's own natural pixel coordinates,
    // and reads that exact pixel's alpha. Same ALPHA_HIT_THRESHOLD=10
    // convention used elsewhere in this file for "is this pixel visible."
    function isOpaqueAtLocalPoint(directionKey, localX, localY, drawW, drawH, left, top) {
        const entry = getDirectionAlphaCanvas(directionKey);
        if (!entry) return true; // image not loaded yet — fall back permissively rather than never-deletable
        const u = (localX - left) / drawW, v = (localY - top) / drawH;
        const px = Math.min(entry.w - 1, Math.max(0, Math.floor(u * entry.w)));
        const py = Math.min(entry.h - 1, Math.max(0, Math.floor(v * entry.h)));
        const ALPHA_HIT_THRESHOLD = 10;
        return entry.ctx.getImageData(px, py, 1, 1).data[3] > ALPHA_HIT_THRESHOLD;
    }

    // Delete mode's own hit-test: a click within an entity's own drawn
    // bounding box (the SAME rectangle Show Hitbox draws — transform the
    // click point into the entity's local unrotated space, same rotate-by-
    // negative-angle trick used to invert the render/collision transform)
    // AND on an actually-VISIBLE (opaque) pixel of that entity's sprite —
    // a bounding-box-only test was found to delete the WRONG entity
    // whenever 2 entities' boxes overlapped (very common, given how much
    // transparent padding these sprites have) and a click landed in one
    // entity's transparent padding that happened to overlap a neighboring
    // entity's own visible hand. Checked topmost-rendered first; a
    // bounding-box hit on transparent padding falls through to check
    // entities further underneath, rather than stopping there.
    function hitTestEntitySprite(x, y) {
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const size = vmin * (cfg.entityScale / 100);
        for (let i = entities.length - 1; i >= 0; i--) {
            const entity = entities[i];
            const refImg = ensureDirectionLoaded(entity.directionKey).frames[0];
            const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
            const drawW = size, drawH = size * aspect;
            const vb = visibleBoundsForDirection(entity.directionKey);
            const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
            const rotationRad = entityRotationRad(entity);
            const dx = x - entity.x, dy = y - entity.y;
            const cos = Math.cos(-rotationRad), sin = Math.sin(-rotationRad);
            const localX = dx * cos - dy * sin;
            const localY = dx * sin + dy * cos;
            const left = -drawW * vb.centerX + xOffsetPx, top = -drawH * vb.bottomY;
            if (localX < left || localX > left + drawW || localY < top || localY > top + drawH) continue;
            if (isOpaqueAtLocalPoint(entity.directionKey, localX, localY, drawW, drawH, left, top)) return entity;
        }
        return null;
    }

    // Every click is part of a repeating 2-click cycle now (manual click-
    // to-flick is retired — see triggerFlick's own comment): the 1st click
    // anywhere records the pending start point; the 2nd click spawns a new
    // entity along that line and immediately starts listening for the
    // NEXT pair. A 2nd click landing exactly on the 1st (a degenerate,
    // zero-length line with no real angle) is ignored rather than spawning
    // a broken entity — stays in "awaiting end point" state instead of
    // silently resetting, so an accidental double-click-in-place doesn't
    // quietly eat the user's own start point.
    //
    // Gated to Stop mode only ("Animation entities can only be placed when
    // in Stop mode") — both the spawn gesture AND the base/end dot drag
    // (which also only ever renders its dots while stopped, see render()) —
    // UNLESS cfg.allowPlacementWhileRunning (a debug checkbox) is on, per
    // explicit request ("I can place entities regardless of the start and
    // stop state"). That override is scoped to NEW placement only —
    // Delete mode and dot-dragging an ALREADY-placed entity stay Stop-only
    // regardless of the checkbox, since neither was part of the request.
    canvas.addEventListener('pointerdown', (e) => {
        const x = e.clientX, y = e.clientY;

        // Delete mode takes priority over placement/dragging entirely —
        // never starts a spawn gesture or a dot drag while active. Always
        // Stop-only, not affected by allowPlacementWhileRunning. Checks
        // entities first, then ball spawn points (per explicit request:
        // "the delete button also works for these balls") — either one a
        // click lands on gets removed; only one at a time (an entity click
        // never also happens to remove an unrelated spawn point).
        if (deleteMode) {
            if (running) return;
            const hitEntity = hitTestEntitySprite(x, y);
            if (hitEntity) { entities = entities.filter(en => en !== hitEntity); return; }
            const hitPointIndex = hitTestBallSpawnPoint(x, y);
            if (hitPointIndex !== -1) { ballSpawnPoints.splice(hitPointIndex, 1); return; }
            // Level rects (wall/floor/target) are also deletable here —
            // same generic Delete tool covers every placeable thing.
            const hitRect = hitTestRectBody(x, y);
            if (hitRect) { levelRects = levelRects.filter(r => r !== hitRect); }
            return;
        }

        // Ball-placement mode — every click adds a new spawn point; stays
        // active for repeated clicks (per explicit request: "as many balls
        // as i want"), only exited by pressing the Ball button again.
        // Stop-only, same as entity placement/Delete — allowPlacementWhileRunning
        // doesn't apply here since it isn't part of that explicit request.
        if (ballPlacementMode) {
            if (running) return;
            ballSpawnPoints.push({ x, y });
            return;
        }

        // Rectangle/Target placement (Level Maker/Sandbox only) — first
        // checks for a handle hit on an ALREADY-placed rect (move/resize/
        // rotate an existing one), falling back to starting a NEW rect's
        // rubber-band drag only if nothing was hit. Stop-only, same as
        // every other placement mode above.
        if (rectPlacementMode || targetPlacementMode) {
            if (running) return;
            const hit = hitTestRectHandle(x, y);
            if (hit) {
                draggingRect = hit.rect;
                draggingRectHandle = hit.handle;
                selectedLevelRect = hit.rect;
                if (hit.handle.startsWith('resize-')) {
                    // The OPPOSITE corner is this drag's fixed pivot —
                    // computed once here in WORLD space (not re-derived
                    // every pointermove, since w/h/rotation change live
                    // during the drag itself).
                    const halfW = hit.rect.w / 2, halfH = hit.rect.h / 2;
                    const oppositeLocal = {
                        'resize-tl': [halfW, halfH], 'resize-tr': [-halfW, halfH],
                        'resize-bl': [halfW, -halfH], 'resize-br': [-halfW, -halfH],
                    }[hit.handle];
                    const cos = Math.cos(hit.rect.rotation), sin = Math.sin(hit.rect.rotation);
                    resizePivotWorld = {
                        x: hit.rect.x + oppositeLocal[0] * cos - oppositeLocal[1] * sin,
                        y: hit.rect.y + oppositeLocal[0] * sin + oppositeLocal[1] * cos,
                    };
                }
                return;
            }
            pendingRectStart = { x, y };
            return;
        }

        if (running && !cfg.allowPlacementWhileRunning) return;

        if (!pendingSpawnStart) {
            // Dot-dragging an existing entity is always Stop-only too —
            // only skip the hit-test (never start a drag) while running,
            // regardless of the checkbox, so a new placement can still
            // start below.
            const hit = running ? null : hitTestEntityDot(x, y);
            if (hit) {
                draggingEntity = hit.entity;
                draggingPoint = hit.point;
                return;
            }
            pendingSpawnStart = { x, y };
            spawnPointerId = e.pointerId;
        } else if (Math.hypot(x - pendingSpawnStart.x, y - pendingSpawnStart.y) > 0.0001) {
            // Max Hands budget — see canPlaceAnotherHand(). The pending
            // gesture is cleared either way, same reasoning as the mobile
            // tap-drag completion above.
            if (canPlaceAnotherHand()) spawnEntityFromLine(pendingSpawnStart.x, pendingSpawnStart.y, x, y);
            pendingSpawnStart = null;
            spawnPointerId = null;
        }
    });

    // ----------------------------------------------------------------
    // Start/Stop — Start lets balls spawn and fall (updateBallAndCollision's
    // own `running` check, above); Stop halts that AND clears whatever
    // ball is currently on screen immediately (not just letting it finish
    // falling out the bottom on its own).
    // ----------------------------------------------------------------
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const ballBtn = document.getElementById('ballBtn');
    const rectBtn = document.getElementById('rectBtn');
    const targetBtn = document.getElementById('targetBtn');
    const handBtn = document.getElementById('handBtn');
    function setRunning(next) {
        running = next;
        if (!running) {
            // Clear every active ball immediately (not just letting each
            // one finish falling out the bottom on its own) — same
            // behavior as before, generalized across every generator.
            ballGenerators.forEach(gen => { gen.ball = null; gen.respawnCountdown = 0; });
        } else {
            setDeleteMode(false); // starting has nothing to delete/place anyway
            setBallPlacementMode(false); // ditto — nowhere to place a spawn point while running
            setRectPlacementMode(false);
            setTargetPlacementMode(false);
            // Re-arm the level win/lose auto-triggers for a fresh attempt
            // — see triggerLevelWin/triggerLevelLose, which guard on this.
            levelAttemptResolved = false;
            // Rebuilt fresh from ballSpawnPoints every Start — spawn
            // points can't change while running (placement is Stop-only),
            // so this is the one moment that matters.
            rebuildBallGenerators();
        }
        startBtn.disabled = running;
        stopBtn.disabled = !running;
        deleteBtn.disabled = running;
        ballBtn.disabled = running;
        rectBtn.disabled = running;
        targetBtn.disabled = running;
        handBtn.disabled = running;
        refreshSimControlsVisibility();
    }
    // Delete mode — toggled independently of Start/Stop's own running
    // state, but only meaningful while stopped (deleteBtn is disabled by
    // setRunning above the same way startBtn/stopBtn are). Turning it on
    // cancels any in-progress spawn/drag/ball-placement gesture so the 4
    // modes never mix.
    function setDeleteMode(next) {
        deleteMode = next;
        if (deleteMode) {
            pendingSpawnStart = null;
            draggingEntity = null;
            draggingPoint = null;
            draggingRect = null;
            draggingRectHandle = null;
            pendingRectStart = null;
            setBallPlacementMode(false);
            setRectPlacementMode(false);
            setTargetPlacementMode(false);
        }
        deleteBtn.classList.toggle('active', deleteMode);
    }
    // Ball-placement mode — same "only one mode at a time" discipline as
    // Delete mode above; turning it on cancels any in-progress entity
    // spawn/drag gesture and Delete mode.
    function setBallPlacementMode(next) {
        ballPlacementMode = next;
        if (ballPlacementMode) {
            pendingSpawnStart = null;
            draggingEntity = null;
            draggingPoint = null;
            draggingRect = null;
            draggingRectHandle = null;
            pendingRectStart = null;
            setDeleteMode(false);
            setRectPlacementMode(false);
            setTargetPlacementMode(false);
        }
        ballBtn.classList.toggle('active', ballPlacementMode);
        applyCursorVisibility();
    }
    // Rectangle (solid wall/floor) placement — same mutual-exclusion
    // discipline as Delete/Ball above. Level Maker/Sandbox only (gating
    // wired in Phase 6); harmless to leave reachable before then since
    // nothing calls it yet except the button below.
    function setRectPlacementMode(next) {
        rectPlacementMode = next;
        if (rectPlacementMode) {
            pendingSpawnStart = null;
            draggingEntity = null;
            draggingPoint = null;
            draggingRect = null;
            draggingRectHandle = null;
            pendingRectStart = null;
            setDeleteMode(false);
            setBallPlacementMode(false);
            setTargetPlacementMode(false);
        }
        rectBtn.classList.toggle('active', rectPlacementMode);
    }
    // Target placement — identical mechanics to Rectangle (same rubber-
    // band gesture, same handles), only the resulting rect's `type`
    // differs (see the pointerdown/pointerup handlers above).
    function setTargetPlacementMode(next) {
        targetPlacementMode = next;
        if (targetPlacementMode) {
            pendingSpawnStart = null;
            draggingEntity = null;
            draggingPoint = null;
            draggingRect = null;
            draggingRectHandle = null;
            pendingRectStart = null;
            setDeleteMode(false);
            setBallPlacementMode(false);
            setRectPlacementMode(false);
        }
        targetBtn.classList.toggle('active', targetPlacementMode);
    }
    // Hand mode — not a new gesture, just an explicit button for the
    // PRE-EXISTING default entity-placement flow (the pointerdown
    // fallback once every other mode above is off), so Level Maker/
    // Sandbox always show one clearly-active tool rather than an
    // implicit "nothing else is selected" state.
    function setLevelHandMode() {
        setDeleteMode(false);
        setBallPlacementMode(false);
        setRectPlacementMode(false);
        setTargetPlacementMode(false);
        handBtn.classList.add('active');
    }
    function clearHandModeActiveClass() { handBtn.classList.remove('active'); }
    startBtn.addEventListener('click', () => setRunning(true));
    stopBtn.addEventListener('click', () => setRunning(false));
    deleteBtn.addEventListener('click', () => { setDeleteMode(!deleteMode); clearHandModeActiveClass(); });
    ballBtn.addEventListener('click', () => { setBallPlacementMode(!ballPlacementMode); clearHandModeActiveClass(); });
    rectBtn.addEventListener('click', () => { setRectPlacementMode(!rectPlacementMode); clearHandModeActiveClass(); });
    targetBtn.addEventListener('click', () => { setTargetPlacementMode(!targetPlacementMode); clearHandModeActiveClass(); });
    handBtn.addEventListener('click', () => setLevelHandMode());

    // Top-level editing context — null (plain Play), 'sandbox' (freeform
    // wall/ball placement, no Target/save UI), or 'levelMaker' (adds
    // Target + the Levels save/rename/delete panel on top of Sandbox's
    // same tools). Both buttons are available to everyone (per explicit
    // request — Level Maker is no longer DEV_MODE-gated); mutually
    // exclusive with each other, both disabled while running (nothing to
    // edit).
    const sandboxBtn = document.getElementById('sandboxBtn');
    const levelMakerBtn = document.getElementById('levelMakerBtn');
    const levelSelect = document.getElementById('levelSelect');
    const playLevelBtn = document.getElementById('playLevelBtn');
    const saveLevelBtn = document.getElementById('saveLevelBtn');
    const editLevelBtn = document.getElementById('editLevelBtn');
    const overwriteLevelBtn = document.getElementById('overwriteLevelBtn');
    const handsRemainingHud = document.getElementById('handsRemainingHud');
    function refreshSimControlsVisibility() {
        const editing = levelEditMode !== null;
        [deleteBtn, ballBtn, rectBtn, targetBtn, handBtn].forEach(b => { b.style.display = editing ? '' : 'none'; });
        targetBtn.style.display = (editing && levelEditMode === 'levelMaker') ? '' : 'none';
        // Level Maker is now available to everyone, not just DEV_MODE —
        // per explicit request. (The dev panel's own visibility was
        // already independent of DEV_MODE — see CODE_SUMMARY.md's own
        // gotcha — so this doesn't newly expose anything that wasn't
        // already reachable by opening the dev panel directly.)
        levelMakerBtn.style.display = '';
        // The Level dropdown stays available in both plain Play AND
        // Level Maker (needed there for Edit/Overwrite to know which
        // level to act on) — only Sandbox hides it, since Sandbox has no
        // saved-level concept at all. Play itself is still Play-only
        // (loading a level for actual play is a different action from
        // loading it to edit).
        levelSelect.style.display = levelEditMode === 'sandbox' ? 'none' : '';
        playLevelBtn.style.display = editing ? 'none' : '';
        saveLevelBtn.style.display = levelEditMode === 'levelMaker' ? '' : 'none';
        editLevelBtn.style.display = levelEditMode === 'levelMaker' ? '' : 'none';
        overwriteLevelBtn.style.display = (levelEditMode === 'levelMaker' && currentLevelName !== null) ? '' : 'none';
        sandboxBtn.classList.toggle('active', levelEditMode === 'sandbox');
        levelMakerBtn.classList.toggle('active', levelEditMode === 'levelMaker');
        sandboxBtn.disabled = running || levelEditMode === 'levelMaker';
        levelMakerBtn.disabled = running || levelEditMode === 'sandbox';
    }
    function setLevelEditMode(next) {
        // Leaving an editing context clears whatever in-progress
        // gesture/mode was active inside it — same discipline as every
        // other mode transition in this file.
        setDeleteMode(false);
        setBallPlacementMode(false);
        setRectPlacementMode(false);
        setTargetPlacementMode(false);
        clearHandModeActiveClass();
        levelEditMode = next;
        // Freshly entering an editing context starts with no level
        // "targeted" for Overwrite — an explicit Edit (or a fresh Save)
        // is what (re-)establishes that, so Overwrite never silently
        // targets a level whose content may no longer match what's
        // actually on screen (e.g. after the canvas was since cleared).
        if (next !== null) currentLevelName = null;
        refreshSimControlsVisibility();
    }
    sandboxBtn.addEventListener('click', () => setLevelEditMode(levelEditMode === 'sandbox' ? null : 'sandbox'));
    levelMakerBtn.addEventListener('click', () => setLevelEditMode(levelEditMode === 'levelMaker' ? null : 'levelMaker'));
    // Play — the read-only player path. Clears entities (a fresh attempt
    // shouldn't inherit whatever hands were left over from a previous
    // level/sandbox session) and replaces the current geometry with the
    // selected level's own saved rects/ball-spawn-points/Max-Hands.
    // levelEditMode stays null throughout, so no handles ever render or
    // hit-test for this loaded geometry — exactly the "players cannot
    // modify level objects" requirement.
    playLevelBtn.addEventListener('click', () => {
        const name = levelSelect.value;
        if (!name || !levels[name]) return;
        entities.length = 0;
        levelRects.length = 0;
        levelRects.push(...levels[name].rects.map(r => ({ ...r })));
        ballSpawnPoints.length = 0;
        ballSpawnPoints.push(...levels[name].ballSpawnPoints.map(p => ({ x: p.x, y: p.y })));
        currentMaxHands = levels[name].maxHands ?? null;
        currentLevelName = name;
        levelAttemptResolved = false;
    });
    // Save — always saves as a NEW named level (prompts for a name every
    // time, per explicit request: "the regular Save button should still
    // exist to save a new level"), independent of whatever's currently
    // loaded. Sets currentLevelName so Overwrite becomes available for
    // it immediately afterward, without requiring a separate Edit click.
    // Same payload shape as the dev-panel Levels group's own Save
    // (entities deliberately excluded) — this is a 2nd, top-level-visible
    // entry point into the exact same levels/persistence data, not a
    // parallel system.
    saveLevelBtn.addEventListener('click', async () => {
        const name = prompt('Level name:');
        if (!name) return;
        levels[name] = {
            rects: levelRects.map(r => ({ ...r })),
            ballSpawnPoints: ballSpawnPoints.map(p => ({ x: p.x, y: p.y })),
            maxHands: currentMaxHands,
        };
        currentLevelName = name;
        refreshLevelSelectOptions();
        refreshSimControlsVisibility();
        await saveDevPanelSettings();
    });
    // Edit — loads the dropdown's selected level's geometry for editing
    // (same replace-not-merge behavior as Play/the dev-panel's own Load),
    // and marks it as the current Overwrite target.
    editLevelBtn.addEventListener('click', () => {
        const name = levelSelect.value;
        if (!name || !levels[name]) return;
        levelRects.length = 0;
        levelRects.push(...levels[name].rects.map(r => ({ ...r })));
        ballSpawnPoints.length = 0;
        ballSpawnPoints.push(...levels[name].ballSpawnPoints.map(p => ({ x: p.x, y: p.y })));
        currentMaxHands = levels[name].maxHands ?? null;
        currentLevelName = name;
        refreshSimControlsVisibility();
    });
    // Overwrite — saves back to whichever level is currently being
    // edited (currentLevelName, set by Edit or by a just-completed Save)
    // WITHOUT re-prompting for a name.
    overwriteLevelBtn.addEventListener('click', async () => {
        if (!currentLevelName || !levels[currentLevelName]) return;
        levels[currentLevelName] = {
            rects: levelRects.map(r => ({ ...r })),
            ballSpawnPoints: ballSpawnPoints.map(p => ({ x: p.x, y: p.y })),
            maxHands: currentMaxHands,
        };
        refreshLevelSelectOptions();
        await saveDevPanelSettings();
    });
    refreshSimControlsVisibility();
    setRunning(false);
    // Win/Lose — deliberately NOT gated by running/stopped (unlike
    // Delete/Ball) and not a toggled "mode": each click is a one-shot
    // trigger applied immediately to every currently-placed entity, for
    // testing the animation regardless of whatever else is going on.
    document.getElementById('winBtn').addEventListener('click', () => triggerWinLoseSequence('win'));
    document.getElementById('loseBtn').addEventListener('click', () => triggerWinLoseSequence('lose'));

    // Fixed-timestep physics — step() always advances by exactly FIXED_DT
    // (1/60s), never the raw/jittery per-real-frame delta. Previously
    // every physics quantity here (gravity integration, position,
    // playback frame advancement, and — critically — the hand's own
    // joint velocity that sizes the ball-collision kick) was driven
    // directly by real elapsed time, which is never bit-for-bit identical
    // between 2 separate runs even with 100% identical inputs (a static
    // mouse position included) — confirmed as the actual explanation for
    // a direct report ("if i leave my mouse in one location... how come
    // the outcome of the ball's trajectory isnt identical everytime")
    // before this fix: real requestAnimationFrame timing jitters run to
    // run, and this sim's collision response is sensitive enough to that
    // jitter for it to compound into a visibly different trajectory.
    // update() (below) still runs once per real animation frame, an
    // accumulator pattern lets it run step() 0, 1, or several times to
    // catch up to real elapsed time — this is what makes 2 runs with the
    // same inputs now produce numerically identical motion after the
    // same NUMBER of steps, regardless of real frame-timing noise.
    const FIXED_DT = 1 / 60;
    const MAX_FRAME_DT = 0.25; // caps the catch-up burst after e.g. a backgrounded tab
    let accumulator = 0;
    let lastTime = performance.now();
    function step(dt) {
        // Per-entity play-sequence frame advancement — mouse-follow
        // smoothing/rotation is gone entirely (entities are fixed once
        // spawned), so this is now just the flick-playback clock plus the
        // ball/collision/trigger physics.
        entities.forEach(entity => {
            if (entity.playing && entity.playSequenceFrozen) {
                // Flick Speed Multiplier — per explicit request ("instead
                // of the intensity, make it control the hand animation
                // speed"): each entity's own placement-line length (1x-2x,
                // see entityFlickSpeedMultiplier()'s own comment) scales
                // ITS OWN flick playback rate, multiplicatively on top of
                // the shared/global Hand Anim Speed slider — not a
                // replacement for it, the same "additional factor" pattern
                // the line length used for collision intensity before this
                // change.
                entity.playFrameAccum += dt * FLICK_BASE_FPS * cfg.clickAnimSpeed * entityFlickSpeedMultiplier(entity);
                entity.playFrameIndex = Math.floor(entity.playFrameAccum);
                const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, Math.round(cfg.peakHoldFrames));
                if (entity.playFrameIndex >= totalLen) {
                    entity.playing = false;
                    entity.playSequenceFrozen = null;
                    entity.playFrameIndex = 0;
                    entity.playFrameAccum = 0;
                }
            }
        });
        advanceWinLoseSequences(dt);
        updateBallAndCollision(dt);
    }

    // Advances every entity's own Win/Lose state machine, one tick at a
    // time — see triggerWinLoseSequence()'s own comment for the 5 phases.
    // Uses its OWN cfg.winLoseAnimSpeed for the forward1/forward2/reverse
    // frame-advance rate (per explicit request — independent of the
    // normal flick's own Hand Anim Speed / cfg.clickAnimSpeed, not
    // shared with it), still against the same FLICK_BASE_FPS base rate.
    // The 2 hold phases advance a real-seconds countdown
    // (cfg.winLoseFistHoldDuration/winLoseFinalHoldDuration) instead of a
    // frame count, unaffected by this speed slider — a hold's own
    // duration is real time, not animation playback.
    function advanceWinLoseSequences(dt) {
        entities.forEach(entity => {
            if (!entity.winLoseType) return;
            const phase = entity.winLosePhase;
            if (phase === 'forward1' || phase === 'forward2') {
                entity.winLoseFrameAccum += dt * FLICK_BASE_FPS * cfg.winLoseAnimSpeed;
                // Per-entity (set by triggerWinLoseSequence from THIS
                // direction+type's own real frameCount) — not a shared
                // global, so a 48-frame asset pauses at its own real
                // midpoint (24, 0-based) instead of the old fixed 24-frame
                // assumption's midpoint (12).
                const target = phase === 'forward1' ? entity.winLoseFistIndex : entity.winLoseLastIndex;
                if (entity.winLoseFrameAccum >= target) {
                    entity.winLoseFrameAccum = target; // clamp exactly — never overshoot the hold frame
                    if (phase === 'forward1') {
                        entity.winLosePhase = 'holdFist';
                        entity.winLoseHoldRemaining = cfg.winLoseFistHoldDuration;
                    } else {
                        entity.winLosePhase = 'holdFinal';
                        entity.winLoseHoldRemaining = cfg.winLoseFinalHoldDuration;
                    }
                }
            } else if (phase === 'holdFist' || phase === 'holdFinal') {
                entity.winLoseHoldRemaining -= dt;
                if (entity.winLoseHoldRemaining <= 0) {
                    // frameAccum is left exactly where the hold froze it
                    // (entity.winLoseFistIndex or .winLoseLastIndex) — the
                    // next phase continues from there, not from 0.
                    entity.winLosePhase = phase === 'holdFist' ? 'forward2' : 'reverse';
                }
            } else if (phase === 'reverse') {
                // No hold at winLoseFistIndex on the way back down —
                // "without any in between frame holding", per explicit
                // instruction — this phase has no target-check branching
                // at all, just a continuous decrement to 0.
                entity.winLoseFrameAccum -= dt * FLICK_BASE_FPS * cfg.winLoseAnimSpeed;
                if (entity.winLoseFrameAccum <= 0) {
                    // Sequence complete — entity returns to its own normal
                    // idle rendering (render()'s draw dispatch falls back
                    // to the idle branch once winLoseType is null again).
                    entity.winLoseType = null;
                    entity.winLosePhase = null;
                    entity.winLoseFrameAccum = 0;
                    entity.winLoseHoldRemaining = 0;
                }
            }
        });
    }

    function update(now) {
        // Self-healing canvas size check. resizeCanvas() only otherwise
        // runs once at boot plus on a real 'resize' event — if
        // window.innerWidth/innerHeight read 0 at that first boot call (a
        // real, reproduced-in-this-session early-page-life quirk, same
        // class already documented in this workspace for mobile Safari/
        // Chrome, and the same root cause already fixed for mouseX above),
        // the canvas permanently sticks at 0×0 unless the
        // user happens to resize their window afterward — which, on a
        // static desktop session, most users never do. A 0×0 canvas isn't
        // just a rendering bug: `#scene.cursor-hidden{cursor:none}` (Hide
        // OS Cursor) has nothing left to apply that rule TO, since the
        // element covers zero real screen area — this is the likely root
        // cause of "hide OS cursor doesn't work" reports. Checked every
        // frame (cheap: 2 comparisons) rather than only once, so it also
        // self-heals from a real live window resize, not just the boot-
        // time case. Display sizing, not simulation — deliberately stays
        // outside the fixed-step loop below.
        const dpr = effectiveDpr();
        if (canvas.width !== Math.round(window.innerWidth * dpr) || canvas.height !== Math.round(window.innerHeight * dpr)) {
            resizeCanvas();
        }

        const frameDt = Math.min(MAX_FRAME_DT, (now - lastTime) / 1000);
        lastTime = now;
        accumulator += frameDt;
        while (accumulator >= FIXED_DT) {
            step(FIXED_DT);
            accumulator -= FIXED_DT;
        }

        // render() runs once per real frame regardless of how many (0 or
        // more) fixed steps just ran — every entity/ball field it reads is
        // plain current state (no per-step return value to thread through
        // anymore now that entities carry their own state), so redrawing
        // the same state on a step-less callback is harmless.
        render();
        requestAnimationFrame(update);
    }

    function render() {
        const w = window.innerWidth, h = window.innerHeight;
        ctx.fillStyle = cfg.backgroundColor;
        ctx.fillRect(0, 0, w, h);

        // Hands-remaining HUD — player-facing only (never shown while
        // editing, where a placement budget isn't the point). Visible
        // whenever a Max Hands limit OR any loaded level is in play, so
        // an unlimited-but-still-a-level attempt still shows the ∞
        // symbol rather than disappearing entirely.
        if (levelEditMode === null && (currentMaxHands !== null || currentLevelName !== null)) {
            handsRemainingHud.hidden = false;
            const isInfinite = currentMaxHands === null;
            document.getElementById('handsRemainingHudLabel').textContent = 'Hands: ';
            const valueEl = document.getElementById('handsRemainingHudValue');
            valueEl.textContent = isInfinite ? '∞' : String(Math.max(0, currentMaxHands - entities.length));
            valueEl.classList.toggle('is-infinity', isInfinite);
        } else {
            handsRemainingHud.hidden = true;
        }

        const cx = w / 2, cy = h / 2;
        if (cfg.showCenter) {
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
            ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
            ctx.stroke();
            ctx.restore();
        }

        // Level-system rectangles (walls/floors = 'solid', win-condition
        // targets = 'target') — drawn unconditionally (both running and
        // stopped), before entities, so a level's static geometry always
        // reads as background the ball/hands interact with, never drawn
        // over them. Collision against these (Phase 3, not yet wired) will
        // reuse this exact same rotated-rect shape.
        if (levelRects.length) {
            levelRects.forEach(rect => {
                ctx.save();
                ctx.translate(rect.x, rect.y);
                ctx.rotate(rect.rotation);
                if (rect.type === 'target') {
                    ctx.fillStyle = 'rgba(255, 214, 77, 0.55)';
                    ctx.strokeStyle = '#ffd64d';
                } else {
                    ctx.fillStyle = 'rgba(150, 150, 160, 0.85)';
                    ctx.strokeStyle = '#c8c8d2';
                }
                ctx.lineWidth = 2;
                ctx.fillRect(-rect.w / 2, -rect.h / 2, rect.w, rect.h);
                ctx.strokeRect(-rect.w / 2, -rect.h / 2, rect.w, rect.h);
                ctx.restore();
                if (rect.type === 'target') {
                    ctx.save();
                    ctx.fillStyle = '#ffd64d';
                    ctx.font = '11px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    const label = rect.targetMode === 'settle' ? `SETTLE ${rect.settleDuration.toFixed(1)}s` : 'INSTANT';
                    ctx.fillText(label, rect.x, rect.y - rect.h / 2 - 4);
                    ctx.restore();
                }
            });
        }

        // Live rubber-band preview while placing a Rectangle/Target
        // (Stop-only, same gating as the placement gesture itself) — an
        // unrotated dashed outline from the press point to the current
        // mouse position, mirroring the entity spawn-line preview below.
        if (pendingRectStart && hasMouse) {
            ctx.save();
            ctx.strokeStyle = targetPlacementMode ? '#ffd64d' : '#c8c8d2';
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 5]);
            const left = Math.min(pendingRectStart.x, mouseX), top = Math.min(pendingRectStart.y, mouseY);
            ctx.strokeRect(left, top, Math.abs(mouseX - pendingRectStart.x), Math.abs(mouseY - pendingRectStart.y));
            ctx.restore();
        }

        const vmin = Math.min(w, h);
        const size = vmin * (cfg.entityScale / 100);

        // Live aim-preview while awaiting the 2nd click of a spawn — a
        // dashed line from the recorded start point to the current mouse
        // position PLUS the actual sprite that will be placed, live-
        // updating every frame from the current mouse angle (per explicit
        // request: "show the animation frame to be placed live as I drag
        // so i can see in real time what it will look like when placed").
        // Recomputes angle/direction/rotation via the EXACT SAME formula
        // spawnEntityFromLine() uses to commit the real entity (just fed
        // the live mouse position instead of a committed end point), so
        // what's previewed here is guaranteed to match what actually gets
        // placed on the 2nd click — translucent (globalAlpha) so it always
        // reads as a preview, never mistaken for an already-placed entity.
        if (pendingSpawnStart && hasMouse) {
            // Direction/angle resolved from the RAW (uncapped) mouse
            // position first — bucketing depends only on angle, never on
            // distance — then lineEnd (below) is pulled in to at most
            // MAX_PLACEMENT_LINE_RATIO hand-lengths for the actual dashed
            // line drawn, per explicit request ("cap the actual length of
            // the visible dotted line... IE 2 hand lengths"). The sprite
            // preview itself only ever depended on angle/rotation, never
            // on distance, so it's unaffected either way.
            const dist = Math.hypot(mouseX - pendingSpawnStart.x, mouseY - pendingSpawnStart.y);
            let lineEnd = { x: mouseX, y: mouseY };
            let previewAngle = null, previewDirectionKey = null;
            if (dist > 0.0001) {
                previewAngle = mouseAngleFromCenter(mouseX, mouseY, pendingSpawnStart.x, pendingSpawnStart.y);
                previewDirectionKey = DIRECTIONS[directionIndexForAngle(previewAngle)].key;
                lineEnd = clampLineEndpoint(previewDirectionKey, pendingSpawnStart.x, pendingSpawnStart.y, mouseX, mouseY);
            }

            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(pendingSpawnStart.x, pendingSpawnStart.y);
            ctx.lineTo(lineEnd.x, lineEnd.y);
            ctx.stroke();
            ctx.restore();
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pendingSpawnStart.x, pendingSpawnStart.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (previewDirectionKey) {
                const previewRotationRad = (previewAngle + (cfg.entityRotationOffsetByDirection[previewDirectionKey] || 0)) * Math.PI / 180;
                // Live preview is always the idle frame (frame 1) — uses
                // the same pre-scaled cache the main idle-entity draw uses
                // (getScaledIdleFrame's own comment), since this draw runs
                // every single frame while aiming/dragging, exactly the
                // activity reported as laggy on mobile.
                const previewScaled = getScaledIdleFrame(previewDirectionKey, size);
                if (previewScaled) {
                    const previewDrawW = previewScaled.drawW, previewDrawH = previewScaled.drawH;
                    const previewVb = visibleBoundsForDirection(previewDirectionKey);
                    const previewXOffsetPx = vmin * ((cfg.entityXOffsetByDirection[previewDirectionKey] || 0) / 100);
                    ctx.save();
                    ctx.globalAlpha = 0.5;
                    ctx.translate(pendingSpawnStart.x, pendingSpawnStart.y);
                    ctx.rotate(previewRotationRad);
                    ctx.drawImage(previewScaled.canvas, -previewDrawW * previewVb.centerX + previewXOffsetPx, -previewDrawH * previewVb.bottomY, previewDrawW, previewDrawH);
                    ctx.restore();
                }
            }
        }

        entities.forEach(entity => {
            // A PLAYING entity draws straight from its own frozen flick-
            // sequence frame (changes every tick, individually short-lived
            // — not worth caching). An IDLE entity — the common case while
            // placing/rotating/moving, since nothing plays during Stop
            // mode — draws from the pre-scaled cache instead of rescaling
            // the full-resolution source every frame (see
            // getScaledIdleFrame()'s own comment: a real, reported mobile
            // performance issue).
            let drawSource = null, drawW = size, drawH = size, vb = null;
            if (entity.winLoseType) {
                // Win/Lose takes over the entity's own draw entirely,
                // ahead of both the normal playing/idle branches (the 2
                // states are mutually exclusive — triggerWinLoseSequence()
                // already clears entity.playing when this starts) — its
                // OWN anchor (winLoseVisibleBounds() — a per-type override
                // when one's been measured to genuinely differ, else the
                // shared direction-level value), not
                // visibleBoundsForDirection(), since this is a genuinely
                // different source image, not reused from the normal set.
                const frames = ensureWinLoseLoaded(entity.directionKey, entity.winLoseType);
                const idx = Math.max(0, Math.min(entity.winLoseLastIndex, Math.floor(entity.winLoseFrameAccum)));
                const img = frames[idx];
                if (img && img.complete && img.naturalWidth > 0) {
                    drawH = size * (img.naturalHeight / img.naturalWidth);
                    drawSource = img;
                    vb = winLoseVisibleBounds(entity.directionKey, entity.winLoseType);
                } else {
                    // This exact frame hasn't finished loading yet (all 24
                    // of a direction's own Win/Lose frames are only
                    // fetched starting the first time that direction is
                    // actually used — see ensureWinLoseLoaded()'s own
                    // comment) — a real, reported symptom on a cold cache
                    // ("on a hard refresh, the first time i hit Win and
                    // Lose... the app seems to have to load the entities
                    // one by one... they each flash in succession"): with
                    // no fallback, drawSource stays null here and the
                    // entity draws NOTHING until this exact image
                    // finishes downloading, so several entities (each
                    // fetching a different direction's own 24 images at
                    // different network speeds) blink in one at a time.
                    // Falls back to the entity's own already-cached idle
                    // frame instead — it was already visibly idle the
                    // instant before this Win/Lose click, so this is
                    // always available with zero extra loading, and reads
                    // as "still settling into its new pose" rather than
                    // "missing" — same idle-frame source AND anchor
                    // (visibleBoundsForDirection(), not the Win/Lose
                    // table) the plain idle branch below uses, not a
                    // half-composed mix of the two.
                    const scaled = getScaledIdleFrame(entity.directionKey, size);
                    if (scaled) {
                        drawW = scaled.drawW;
                        drawH = scaled.drawH;
                        drawSource = scaled.canvas;
                        vb = visibleBoundsForDirection(entity.directionKey);
                    }
                }
            } else if (entity.playing && entity.playSequenceFrozen) {
                const hold = Math.round(cfg.peakHoldFrames);
                const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, hold);
                const virtualIndex = Math.min(entity.playFrameIndex, totalLen - 1);
                const img = entity.playSequenceFrozen[resolvePlaySequenceIndex(virtualIndex, DIRECTION_FRAME_COUNT, hold)];
                if (img && img.complete && img.naturalWidth > 0) {
                    drawH = size * (img.naturalHeight / img.naturalWidth);
                    drawSource = img;
                }
            } else {
                const scaled = getScaledIdleFrame(entity.directionKey, size);
                if (scaled) {
                    drawW = scaled.drawW;
                    drawH = scaled.drawH;
                    drawSource = scaled.canvas;
                }
            }
            if (!vb) vb = visibleBoundsForDirection(entity.directionKey);
            // Animation X Offset (cfg.entityXOffsetByDirection) — added to
            // the local x AFTER vb.centerX, BEFORE rotation, so it shifts
            // the drawn sprite/hitbox sideways relative to the entity's own
            // facing direction, matching the same offset applied to the
            // collision geometry above (updateBallAndCollision) and to the
            // trigger-zone check (ballInFlickTriggerZone) — all 3 must stay
            // in sync, same discipline as vb.centerX/bottomY.
            const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
            ctx.save();
            ctx.translate(entity.x, entity.y);
            ctx.rotate(entityRotationRad(entity));
            // Anchored at the center-base of the VISIBLE (non-transparent)
            // content, not the raw PNG's own bottom-center — see
            // localOffsetFromNormalized()'s comment; drawImage's own
            // (dx,dy) is its TOP-LEFT corner, so -drawW*centerX/-drawH*bottomY
            // puts that exact visible-content point at the entity's own
            // origin.
            if (drawSource) {
                ctx.drawImage(drawSource, -drawW * vb.centerX + xOffsetPx, -drawH * vb.bottomY, drawW, drawH);
            }
            if (cfg.showHitbox) {
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-drawW * vb.centerX + xOffsetPx, -drawH * vb.bottomY, drawW, drawH);
            }
            ctx.restore();

            // Joint collision debug lines — drawn at the FIXED collision
            // thickness (Joint Collision Thickness alone — no longer speed-
            // derived, per explicit instruction: "collision circles will
            // never rescale during the animation sequence unless otherwise
            // told so by me"), matching updateBallAndCollision()'s own
            // per-segment thicknessPx exactly, so the boundary the ball
            // actually reacts to is directly visible at all times.
            if (cfg.showJointCollisionLines && entity.jointWorld) {
                ctx.save();
                ctx.strokeStyle = '#ffcf5c';
                ctx.globalAlpha = 0.55;
                ctx.lineCap = 'round';
                ctx.lineWidth = vmin * (cfg.jointThickness / 100);
                [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']].forEach(([aKey, bKey]) => {
                    const a = entity.jointWorld[aKey], b = entity.jointWorld[bKey];
                    if (!a || !b) return;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                });
                ctx.restore();
            }
        });

        // Stop-mode entity-adjustment handles: 3 dots per entity (base =
        // 1st click, end = 2nd click/aim point — each independently
        // draggable, using the OTHER as its pivot; mid = the whole-entity
        // move handle, sitting exactly at the base/end midpoint) plus a
        // dashed connecting line, draggable via the
        // pointerdown/pointermove/pointerup handlers above — only shown
        // (and only hit-testable, per those handlers) while stopped, same
        // gating as the spawn-placement gesture itself.
        if (!running) {
            entities.forEach(entity => {
                ctx.save();
                ctx.strokeStyle = '#4dd2ff';
                ctx.globalAlpha = 0.7;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(entity.x, entity.y);
                ctx.lineTo(entity.endX, entity.endY);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#4dd2ff';
                ctx.beginPath();
                ctx.arc(entity.x, entity.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#ff4da6';
                ctx.beginPath();
                ctx.arc(entity.endX, entity.endY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#ffe64d';
                ctx.beginPath();
                ctx.arc((entity.x + entity.endX) / 2, (entity.y + entity.endY) / 2, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Level-rect adjustment handles (Level Maker/Sandbox only,
        // stopped-only — same gating as the entity handles above): move
        // (yellow, center — same color/role as the entity's own mid-dot),
        // 4 corner resize dots (white), 1 rotate dot (cyan) connected to
        // the rect's top edge by a thin dashed line.
        if (!running && levelEditMode) {
            levelRects.forEach(rect => {
                const halfW = rect.w / 2, halfH = rect.h / 2;
                const cos = Math.cos(rect.rotation), sin = Math.sin(rect.rotation);
                const toWorld = (lx, ly) => ({ x: rect.x + lx * cos - ly * sin, y: rect.y + lx * sin + ly * cos });
                const corners = [[-halfW, -halfH], [halfW, -halfH], [-halfW, halfH], [halfW, halfH]].map(([lx, ly]) => toWorld(lx, ly));
                const rotateHandle = toWorld(0, -halfH - ROTATION_HANDLE_OFFSET);
                const topMid = toWorld(0, -halfH);

                ctx.save();
                ctx.strokeStyle = '#8ad6ff';
                ctx.globalAlpha = 0.7;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(topMid.x, topMid.y);
                ctx.lineTo(rotateHandle.x, rotateHandle.y);
                ctx.stroke();
                ctx.restore();

                corners.forEach(c => {
                    ctx.save();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                ctx.save();
                ctx.fillStyle = '#8ad6ff';
                ctx.beginPath();
                ctx.arc(rotateHandle.x, rotateHandle.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#ffe64d';
                ctx.beginPath();
                ctx.arc(rect.x, rect.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Balls — one per active generator, not a single shared ball.
        {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ballGenerators.forEach(gen => {
                if (!gen.ball) return;
                ctx.save();
                ctx.fillStyle = cfg.ballColor;
                ctx.beginPath();
                ctx.arc(gen.ball.x, gen.ball.y, radiusPx, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Placed ball spawn points — shown only while stopped (Delete
        // mode needs to see/click them; while running, the real balls
        // spawned there speak for themselves). Drawn as a dashed outline
        // in the ball's own color/size, distinct from a solid live ball.
        if (!running && ballSpawnPoints.length > 0) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ctx.save();
            ctx.strokeStyle = cfg.ballColor;
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 2;
            ballSpawnPoints.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, radiusPx, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        // Ball-placement live cursor preview — "my cursor becomes the
        // ball geometry" — a solid preview ball following the mouse,
        // drawn only while actually placing (Stop mode; running has
        // nothing to preview since a click can't place anything then).
        if (ballPlacementMode && !running && hasMouse) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ctx.save();
            ctx.globalAlpha = 0.7;
            ctx.fillStyle = cfg.ballColor;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, radiusPx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (cfg.showAngleDebug) {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px monospace';
            ctx.textBaseline = 'top';
            const playingCount = entities.filter(en => en.playing).length;
            // Live Flick Speed readout while placing/adjusting — lets the
            // user actually SEE the value this exact gesture is setting
            // (per the same request that introduced the multiplier
            // itself), rather than only finding out once a placed entity
            // actually flicks. "placing": recomputes the same
            // angle/direction the live spawn-preview above already draws,
            // fed to flickSpeedMultiplierForLine() directly (not
            // re-deriving a fake entity). "adjusting":
            // entityFlickSpeedMultiplier() already reads
            // draggingEntity's own LIVE endX/endY, so no
            // separate live-position handling is needed here.
            let speedText = '';
            if (pendingSpawnStart && hasMouse) {
                const dist = Math.hypot(mouseX - pendingSpawnStart.x, mouseY - pendingSpawnStart.y);
                if (dist > 0.0001) {
                    const previewAngle = mouseAngleFromCenter(mouseX, mouseY, pendingSpawnStart.x, pendingSpawnStart.y);
                    const previewDirectionKey = DIRECTIONS[directionIndexForAngle(previewAngle)].key;
                    const mult = flickSpeedMultiplierForLine(previewDirectionKey, pendingSpawnStart.x, pendingSpawnStart.y, mouseX, mouseY);
                    speedText = `  speed ${mult.toFixed(2)}x`;
                }
            } else if (draggingEntity && draggingPoint === 'end') {
                speedText = `  speed ${entityFlickSpeedMultiplier(draggingEntity).toFixed(2)}x`;
            }
            // y=50, not 12 — the Start/Stop/Delete buttons (.sim-controls)
            // sit at top:10px/left:10px and are tall enough to overlap a
            // y=12 baseline; a real user report ("remove the text behind
            // the start stop delete buttons") confirmed this was actually
            // happening, not just a theoretical overlap.
            ctx.fillText(`entities: ${entities.length}${playingCount ? `  (${playingCount} playing)` : ''}${pendingSpawnStart ? '  (placing...)' : ''}${draggingEntity ? '  (adjusting...)' : ''}${deleteMode ? '  (delete mode)' : ''}${speedText}  [${running ? 'running' : 'stopped'}]`, 12, 50);
            ctx.restore();
        }
    }

    requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(update); });

    initDevPanelEngine();

    // One-time-per-load migration: this panel's Entity group was briefly
    // named "Hand Animation", and a separate "Mouse / Rotation" group
    // existed, before both were consolidated back into "Entity" per
    // explicit request. Anyone whose browser already saved settings
    // during that window has a sectionOrder referencing those 2 names —
    // applySectionOrder() (the generic engine, unchanged) correctly, BY
    // DESIGN, recreates any saved group it doesn't recognize as a
    // .dev-section already in the static HTML (that's what lets a real
    // user-created "+ Add Group" group survive a reload) — it has no way
    // to tell those 2 renamed-away names apart from a genuine custom
    // group, so they silently come back as empty-looking ghost groups
    // every load. Prune them here instead: move whatever rows they still
    // claim into Entity (their current code home) rather than deleting
    // them, then remove the now-empty stale section. Runs after
    // initDevPanelEngine() so it can clean up whatever that just
    // restored from localStorage; cheap and idempotent, so it's fine to
    // run on every load rather than gating it behind a one-time flag —
    // once a real Save happens post-migration, the live DOM (already
    // clean) is what gets captured, so the stale names stop reappearing
    // in localStorage too.
    (function pruneStaleDevPanelGroups() {
        const STALE_GROUP_NAMES = ['Hand Animation', 'Mouse / Rotation'];
        const entityContent = findGroupContent('desktop', 'Entity', 'pruneStaleDevPanelGroups', 'migration');
        document.querySelectorAll('#desktopTabContent > .dev-section > .dev-section-title').forEach(titleEl => {
            if (!STALE_GROUP_NAMES.includes(titleEl.dataset.sid)) return;
            const section = titleEl.parentElement;
            const content = section.querySelector(':scope > .dev-section-content');
            if (entityContent && content) {
                Array.from(content.children).forEach(row => entityContent.appendChild(row));
            }
            section.remove();
        });
    })();
</script>
</body>
</html>
