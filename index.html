<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dotflicko — Directional Mouse-Follow Demo</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    #scene { position: fixed; top: 0; left: 0; display: block; touch-action: none; }
    #scene.cursor-hidden { cursor: none; }

    /* ================================================================
       DEV PANEL — copied verbatim from J:\CLAUDE\PROJECTS\.claude\TEMPLATE_DEV_PANEL.html
       (workspace CLAUDE.md §12). No project-specific rules in this block.
       ================================================================ */
    .dev-panel {
        position: fixed;
        left: calc(var(--dev-panel-left-px, 20) * 1px);
        top: calc(var(--dev-panel-top-px, 20) * 1px);
        background: var(--dev-panel-bg-color, #000);
        opacity: var(--dev-panel-opacity, 1);
        color: #fff;
        padding: 15px;
        width: calc(var(--dev-panel-width-px, 340) * 1px);
        height: calc(var(--dev-panel-height-px, 520) * 1px);
        min-width: 160px;
        min-height: 120px;
        max-width: 92vw;
        max-height: 92vh;
        font-size: calc(var(--dev-setting-title-font-size-px, 12) * 1px);
        z-index: 99999;
        font-family: var(--dev-panel-font-family, monospace);
        border-left: 2px solid var(--dev-accent-color, #0ff);
        display: flex;
        flex-direction: column;
        resize: none;
    }
    @media (max-width: 767px) {
        .dev-panel { max-width: 85vw; max-height: 80vh; }
    }
    .dev-panel-scroll-content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        scrollbar-color: var(--dev-accent-color, #0ff) #000;
        scrollbar-width: thin;
    }
    .dev-panel-scroll-content::-webkit-scrollbar { width: 10px; }
    .dev-panel-scroll-content::-webkit-scrollbar-track { background: #000; }
    .dev-panel-scroll-content::-webkit-scrollbar-thumb { background: var(--dev-accent-color, #0ff); border-radius: 5px; }

    .dev-panel.panel-collapsed {
        height: auto !important;
        min-height: 0;
    }
    .dev-panel.panel-collapsed .dev-header {
        padding-bottom: 0;
        margin-bottom: 0;
        align-items: center;
        position: static;
    }
    .dev-panel.panel-collapsed .dev-panel-scroll-content {
        flex: 0 1 auto;
        overflow: visible;
    }
    .dev-panel.panel-collapsed .dev-panel-scroll-content > *:not(.dev-header),
    .dev-panel.panel-collapsed .dev-panel-resize-edge,
    .dev-panel.panel-collapsed .dev-panel-resize-corner {
        display: none !important;
    }

    .dev-panel-resize-edge {
        position: absolute;
        z-index: 2;
        touch-action: none;
        -webkit-touch-callout: none;
    }
    .dev-panel-resize-edge.edge-top, .dev-panel-resize-edge.edge-bottom {
        left: 16px; right: 16px; height: 20px; cursor: ns-resize;
    }
    .dev-panel-resize-edge.edge-top { top: -6px; }
    .dev-panel-resize-edge.edge-bottom { bottom: -6px; }
    .dev-panel-resize-edge.edge-left, .dev-panel-resize-edge.edge-right {
        top: 16px; bottom: 16px; width: 20px; cursor: ew-resize;
    }
    .dev-panel-resize-edge.edge-left { left: -6px; }
    .dev-panel-resize-edge.edge-right { right: -6px; }

    .dev-panel-resize-corner {
        position: absolute;
        z-index: 3;
        width: 20px;
        height: 20px;
        touch-action: none;
        -webkit-touch-callout: none;
    }
    .dev-panel-resize-corner.corner-tl { top: -6px; left: -6px; cursor: nwse-resize; }
    .dev-panel-resize-corner.corner-tr { top: -6px; right: -6px; cursor: nesw-resize; }
    .dev-panel-resize-corner.corner-bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .dev-panel-resize-corner.corner-br { bottom: -6px; right: -6px; cursor: nwse-resize; }

    .dev-panel-resize-corner::after {
        content: ''; position: absolute; width: 7px; height: 7px; opacity: 0.7;
    }
    .dev-panel-resize-corner.corner-tl::after { top: 8px; left: 8px; }
    .dev-panel-resize-corner.corner-tr::after { top: 8px; right: 8px; }
    .dev-panel-resize-corner.corner-bl::after { bottom: 8px; left: 8px; }
    .dev-panel-resize-corner.corner-br::after { bottom: 8px; right: 8px; }
    .dev-panel-resize-corner.corner-tl::after, .dev-panel-resize-corner.corner-br::after {
        background-image: repeating-linear-gradient(135deg, var(--dev-accent-color, #0ff) 0 2px, transparent 2px 6px);
    }
    .dev-panel-resize-corner.corner-tr::after, .dev-panel-resize-corner.corner-bl::after {
        background-image: repeating-linear-gradient(45deg, var(--dev-accent-color, #0ff) 0 2px, transparent 2px 6px);
    }
    .dev-panel-resize-edge::after {
        content: ''; position: absolute; background: var(--dev-accent-color, #0ff); opacity: 0.7; border-radius: 1px;
    }
    .dev-panel-resize-edge.edge-top::after, .dev-panel-resize-edge.edge-bottom::after {
        left: 50%; top: 50%; width: 14px; height: 3px; transform: translate(-50%, -50%);
    }
    .dev-panel-resize-edge.edge-left::after, .dev-panel-resize-edge.edge-right::after {
        left: 50%; top: 50%; width: 3px; height: 14px; transform: translate(-50%, -50%);
    }

    .dev-panel.hidden { display: none !important; }

    #desktopTabContent.hidden, #mobileTabContent.hidden, #landscapeTabContent.hidden {
        display: none !important;
    }

    .dev-header {
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        margin-bottom: 10px;
        color: #0ff;
        font-weight: bold;
        position: sticky;
        top: 0;
        background: rgba(0,0,0,0.95);
        padding-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    .dev-header.dragging { cursor: grabbing; }
    .dev-panel-title {
        font-size: calc(var(--dev-panel-title-font-size-px, 16) * 1px);
        color: var(--dev-panel-title-text-color, #fff);
    }
    .dev-header-buttons { display: flex; gap: 4px; }
    .dev-hide-btn, .dev-collapse-btn {
        background: var(--dev-accent-color, #0ff);
        color: #000;
        border: none;
        border-radius: 3px;
        width: 22px;
        min-height: calc(var(--dev-button-height-px, 22) * 1px);
        padding-top: calc(var(--dev-button-text-border-px, 0) * 1px);
        padding-bottom: calc(var(--dev-button-text-border-px, 0) * 1px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
        line-height: 1;
        letter-spacing: calc(var(--dev-button-text-letter-spacing-px, 0) * 1px);
        cursor: pointer;
        flex-shrink: 0;
    }
    .dev-hide-btn:hover, .dev-collapse-btn:hover { filter: brightness(1.3); }

    .dev-tabs { display: flex; gap: 4px; margin: 8px 0; }
    .dev-tab-btn {
        flex: 1;
        background: #222;
        color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        border-radius: 3px;
        min-height: calc(var(--dev-button-height-px, 22) * 1px);
        padding-top: calc(var(--dev-button-text-border-px, 0) * 1px);
        padding-bottom: calc(var(--dev-button-text-border-px, 0) * 1px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--dev-panel-font-family, monospace);
        font-size: calc(var(--dev-tab-font-size-px, 12) * 1px);
        font-weight: bold;
        letter-spacing: calc(var(--dev-tab-text-letter-spacing-px, 0) * 1px);
        cursor: pointer;
    }
    .dev-tab-btn.active { background: var(--dev-accent-color, #0ff); color: #000; }

    .dev-toggle-btn {
        position: fixed;
        bottom: 10px;
        right: 10px;
        z-index: 100000;
        background: var(--dev-accent-color, #0ff);
        color: #000;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        font-family: monospace;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        opacity: 0.85;
    }
    .dev-toggle-btn:hover { opacity: 1; }

    /* Start/Stop — a regular, always-visible UI control (not part of the
       dev panel), top-left. */
    .sim-controls {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 100000;
        display: flex;
        gap: var(--btn-gap-h, 6px);
    }
    .sim-controls-right {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 100000;
        display: flex;
        gap: var(--btn-gap-h, 6px);
    }
    .sim-controls-row2 {
        /* top is set live by repositionButtonRow2() (JS), since it
           depends on row 1's own measured height -- this static value is
           only what renders before that JS runs on first load. */
        position: fixed;
        top: 60px;
        left: 10px;
        z-index: 100000;
        display: flex;
        align-items: center;
        gap: var(--btn-gap-h, 6px);
    }
    .sim-controls-bottom-left {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 100000;
        display: flex;
        gap: var(--btn-gap-h, 6px);
    }
    /* Position/alignment mechanism mirrors CLICKO's own Text Align/Valign
       + Edge Lock system (index.html's applyTextAlignAnchors()), scaled
       down to this one element: -x/y-base/-sign pick which point in the
       viewport the offset is measured from (an edge, via the alignment
       dropdown, when Edge Lock is checked; always the centerline when
       unlocked) and -anchor-tx/-ty shift the box so ITS OWN matching edge
       (not just its center) lands there — a deliberate completion beyond
       Clicko's own Start-button-specific translate(-50%,...) (which never
       varied by horizontal align), since a short, single-line label reads
       more correctly flush against its chosen edge. All offsets are plain
       px (this project has no vw/vh-scaling text convention to preserve,
       unlike Clicko's own vw/px duality) — see applyHandsHudSettings().
    */
    .hands-remaining-hud {
        position: fixed;
        left: calc(var(--hands-x-base, 0%) + var(--hands-x-sign, 1) * var(--hands-x-offset-px, 10px));
        top: calc(var(--hands-y-base, 0%) + var(--hands-y-sign, 1) * var(--hands-y-offset-px, 104px));
        transform: translate(var(--hands-anchor-tx, 0%), var(--hands-anchor-ty, 0%));
        z-index: 100000;
        color: #fff;
        font-family: var(--btn-font-family, monospace);
        font-size: var(--hands-font-size, 14px);
        font-weight: var(--hands-font-weight, normal);
        text-transform: var(--hands-text-transform, none);
        letter-spacing: var(--hands-letter-spacing, 0px);
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        pointer-events: none;
        white-space: nowrap;
    }
    /* The infinity glyph gets its own font size, independent of the rest
       of the label — per explicit request — since "∞" commonly reads as
       visually smaller/lighter than digits at an identical font-size. */
    #handsRemainingHudValue.is-infinity { font-size: var(--hands-infinity-font-size, 14px); }
    /* Shared button styling across every fixed-position button group
       (top-left, its 2nd row, top-right, bottom-left) -- a button's
       container position is purely layout, not a reason for it to look
       different, per explicit request ("stylize the right side buttons
       the same as the left buttons"). */
    .sim-controls button,
    .sim-controls-row2 button,
    .sim-controls-right button,
    .sim-controls-bottom-left button {
        background: #2a3040;
        color: #fff;
        border: var(--btn-outline-thickness, 1px) solid #4a5568;
        border-radius: 4px;
        padding: var(--btn-padding-v, 6px) var(--btn-padding-h, 14px);
        font-family: var(--btn-font-family, monospace);
        font-size: var(--btn-font-size, 12px);
        font-weight: bold;
        cursor: pointer;
        opacity: 0.9;
    }
    .sim-controls button:hover:not(:disabled),
    .sim-controls-row2 button:hover:not(:disabled),
    .sim-controls-right button:hover:not(:disabled),
    .sim-controls-bottom-left button:hover:not(:disabled) { opacity: 1; }
    .sim-controls button:disabled,
    .sim-controls-row2 button:disabled,
    .sim-controls-right button:disabled,
    .sim-controls-bottom-left button:disabled { opacity: 0.35; cursor: default; }
    #startBtn { border-color: #4dd27a; }
    #stopBtn { border-color: #ff5c5c; }
    #deleteBtn { border-color: #ff9500; }
    #deleteBtn.active { background: #ff9500; color: #1b1f2a; }
    #ballBtn { border-color: #ff5c5c; }
    #ballBtn.active { background: #ff5c5c; color: #1b1f2a; }
    #rectBtn { border-color: #c8c8d2; }
    #rectBtn.active { background: #c8c8d2; color: #1b1f2a; }
    #targetBtn { border-color: #ffd64d; }
    #targetBtn.active { background: #ffd64d; color: #1b1f2a; }
    #handBtn { border-color: #8ad6ff; }
    #handBtn.active { background: #8ad6ff; color: #1b1f2a; }
    #sandboxBtn { border-color: #4dd27a; }
    #sandboxBtn.active { background: #4dd27a; color: #1b1f2a; }
    #levelMakerBtn { border-color: #ffd64d; }
    #levelMakerBtn.active { background: #ffd64d; color: #1b1f2a; }
    #winBtn { border-color: #4dd27a; }
    #loseBtn { border-color: #ff5c5c; }
    #playLevelBtn { border-color: #4dd27a; }
    #saveLevelBtn { border-color: #8ad6ff; }
    #editLevelBtn { border-color: #ffd64d; }
    #overwriteLevelBtn { border-color: #ff9500; }

    .dev-buttons { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
    .dev-save-sync-status { font-size: calc(var(--dev-setting-title-font-size-px, 12) * 1px); white-space: nowrap; flex-shrink: 0; }
    .dev-buttons button {
        flex: 1;
        min-height: calc(var(--dev-button-height-px, 22) * 1px);
        padding-top: calc(var(--dev-button-text-border-px, 0) * 1px);
        padding-bottom: calc(var(--dev-button-text-border-px, 0) * 1px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        background: var(--dev-accent-color, #0ff);
        color: #000;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: calc(var(--dev-button-text-letter-spacing-px, 0) * 1px);
    }
    .dev-buttons button:hover { filter: brightness(1.3); }

    .dev-section { margin-bottom: 15px; }
    .dev-section-title {
        color: var(--dev-accent-color, #0ff);
        font-weight: bold;
        font-size: calc(var(--dev-group-title-font-size-px, 13) * 1px);
        letter-spacing: calc(var(--dev-group-text-letter-spacing-px, 0) * 1px);
        margin-bottom: 8px;
        cursor: pointer;
        user-select: none;
        padding: 5px;
        background: rgba(0, 255, 255, 0.1);
        border-radius: 3px;
    }
    .dev-section-title:hover { background: rgba(0, 255, 255, 0.2); }
    .dev-section-content { display: block; margin-left: 5px; }
    .dev-section-content > .dev-section {
        padding-left: 10px;
        border-left: 2px solid rgba(0, 255, 255, 0.25);
    }
    .dev-section-content > .dev-section > .dev-section-title {
        font-size: calc(var(--dev-group-title-font-size-px, 13) * 0.85px);
    }
    .dev-section-content:empty {
        min-height: 24px;
        border: 1px dashed var(--dev-accent-color, #0ff);
        opacity: 0.5;
    }
    .dev-section-content.collapsed { display: none; }

    .dev-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .dev-label {
        min-width: 140px;
        color: var(--dev-panel-non-title-text-color, #aaa);
        font-size: calc(var(--dev-setting-title-font-size-px, 12) * 1px);
        letter-spacing: calc(var(--dev-settings-text-letter-spacing-px, 0) * 1px);
    }
    .dev-section-content .dev-label { cursor: grab; user-select: none; }
    .dev-reorder-dragging { opacity: 0.5; }

    .dev-slider {
        flex: 1;
        min-width: 130px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--dev-slider-color, #3b82f6);
    }
    .dev-value { min-width: 45px; color: var(--dev-accent-color, #0ff); text-align: right; font-size: 10px; }
    .dev-value-editable { cursor: text; }
    .dev-value-editable:hover { outline: 1px solid var(--dev-accent-color, #0ff); }
    .dev-value-edit-input {
        width: 52px; background: #000; color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        font-family: var(--dev-panel-font-family, monospace);
        font-size: 10px; text-align: right; padding: 0;
    }
    .dev-text-input {
        width: 52px; background: #000; color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        font-family: var(--dev-panel-font-family, monospace);
        font-size: 11px; text-align: right; padding: 2px 4px;
    }
    .dev-text-input-wide { width: 160px; text-align: left; }
    .dev-color-picker {
        width: calc(var(--dev-setting-title-font-size-px, 12) * 5px);
        height: calc(var(--dev-setting-title-font-size-px, 12) * 3px);
        border: 1px solid var(--dev-accent-color, #0ff);
        border-radius: 3px;
        cursor: pointer;
    }
    .dev-select {
        background: #222; color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        padding: 4px; border-radius: 3px; cursor: pointer;
        font-family: var(--dev-panel-font-family, monospace); font-size: 10px;
    }

    .dev-panel.dev-caps-button-text .dev-buttons button,
    .dev-panel.dev-caps-button-text .dev-hide-btn,
    .dev-panel.dev-caps-button-text .dev-collapse-btn {
        text-transform: uppercase;
    }
    .dev-panel.dev-caps-tab-text .dev-tab-btn { text-transform: uppercase; }
    .dev-panel.dev-caps-group-names .dev-section-title { text-transform: uppercase; }
    .dev-panel.dev-caps-settings-text .dev-label { text-transform: uppercase; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="sim-controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="sandboxBtn">Sandbox</button>
    <button id="levelMakerBtn">Level Maker</button>
</div>
<div class="sim-controls-row2">
    <select id="levelSelect"></select>
    <button id="playLevelBtn">Play</button>
    <button id="saveLevelBtn">Save</button>
    <button id="editLevelBtn">Edit</button>
    <button id="overwriteLevelBtn">Overwrite</button>
</div>
<div class="sim-controls-right">
    <button id="deleteBtn">Delete</button>
    <button id="ballBtn">Ball</button>
    <button id="rectBtn">Rectangle</button>
    <button id="targetBtn">Target</button>
    <button id="handBtn">Hand</button>
</div>
<div class="sim-controls-bottom-left">
    <button id="winBtn">Win</button>
    <button id="loseBtn">Lose</button>
</div>
<div id="handsRemainingHud" class="hands-remaining-hud" hidden><span id="handsRemainingHudLabel"></span><span id="handsRemainingHudValue"></span></div>

<button class="dev-toggle-btn" id="devToggleBtn" onclick="devPanel.classList.toggle('hidden')" hidden>DEV</button>

<div class="dev-panel hidden" id="devPanel">
    <div class="dev-panel-scroll-content">
        <div class="dev-header" id="devPanelHeader">
            <span class="dev-panel-title">DEV</span>
            <div class="dev-header-buttons">
                <button class="dev-collapse-btn" id="devCollapseBtn" onclick="toggleDevPanelCollapsed()">▁</button>
                <button class="dev-hide-btn" onclick="devPanel.classList.add('hidden')">X</button>
            </div>
        </div>

        <div class="dev-buttons">
            <button onclick="copyDevPanelSettings()">COPY</button>
            <button onclick="resetDevPanelSettings()">RESET</button>
            <button onclick="saveDevPanelSettings()">SAVE</button>
            <span class="dev-save-sync-status" id="devSaveSyncStatus"></span>
        </div>

        <div class="dev-tabs">
            <button class="dev-tab-btn active" id="devTabDesktopBtn" onclick="switchDevPanelTab('desktop')">DESKTOP</button>
            <button class="dev-tab-btn" id="devTabMobileBtn" onclick="switchDevPanelTab('mobile')">MOBILE</button>
            <button class="dev-tab-btn" id="devTabLandscapeBtn" onclick="switchDevPanelTab('landscape')">LANDSCAPE</button>
        </div>

        <div id="desktopTabContent">
            <div class="dev-buttons"><button onclick="addDevGroup('desktop')">+ Add Group</button></div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Dev Panel">▼ Dev Panel</div>
                <div class="dev-section-content"></div>
            </div>
            <!-- PROJECT groups: rendered into by name via findGroupContent('desktop', <group>, ...) -->
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Entity">▼ Entity</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Scenes">▼ Scenes</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Levels">▼ Levels</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="UI">▼ UI</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Background">▼ Background</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Ball">▼ Ball</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Collision">▼ Collision</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Debug">▼ Debug</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Win / Lose">▼ Win / Lose</div>
                <div class="dev-section-content"></div>
            </div>
        </div>

        <div id="mobileTabContent" class="hidden">
            <div class="dev-buttons"><button onclick="addDevGroup('mobile')">+ Add Group</button></div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Dev Panel">▼ Dev Panel</div>
                <div class="dev-section-content"></div>
            </div>
        </div>

        <div id="landscapeTabContent" class="hidden">
            <div class="dev-buttons"><button onclick="addDevGroup('landscape')">+ Add Group</button></div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Dev Panel">▼ Dev Panel</div>
                <div class="dev-section-content"></div>
            </div>
        </div>
    </div>

    <div class="dev-panel-resize-edge edge-top" id="devPanelResizeTop"></div>
    <div class="dev-panel-resize-edge edge-bottom" id="devPanelResizeBottom"></div>
    <div class="dev-panel-resize-edge edge-left" id="devPanelResizeLeft"></div>
    <div class="dev-panel-resize-edge edge-right" id="devPanelResizeRight"></div>
    <div class="dev-panel-resize-corner corner-tl" id="devPanelResizeTL"></div>
    <div class="dev-panel-resize-corner corner-tr" id="devPanelResizeTR"></div>
    <div class="dev-panel-resize-corner corner-bl" id="devPanelResizeBL"></div>
    <div class="dev-panel-resize-corner corner-br" id="devPanelResizeBR"></div>
</div>

<script>
    // ================================================================
    // DEV PANEL ENGINE — copied verbatim from TEMPLATE_DEV_PANEL.html.
    // Generic, no project-specific names. Project code starts at the
    // "FLICK DEMO" banner below.
    // ================================================================

    const devPanel = document.getElementById('devPanel');
    const DEV_PANEL_TABS = ['desktop', 'mobile', 'landscape'];
    function isNarrowViewport() { return window.innerWidth < 768; }

    function toggleSection(titleEl) {
        if (sectionJustDragged) { sectionJustDragged = false; return; }
        if (textEditModeEnabled) { openDevTextEditFor(titleEl, getSectionKey(titleEl), true); return; }
        const content = titleEl.nextElementSibling;
        content.classList.toggle('collapsed');
        titleEl.textContent = content.classList.contains('collapsed') ? '▶ ' + titleEl.textContent.slice(2) : '▼ ' + titleEl.textContent.slice(2);
    }

    function createDevGroupElement(name) {
        const section = document.createElement('div');
        section.className = 'dev-section';
        const title = document.createElement('div');
        title.className = 'dev-section-title';
        title.setAttribute('onclick', 'toggleSection(this)');
        title.dataset.sid = name;
        title.textContent = '▼ ' + name;
        const content = document.createElement('div');
        content.className = 'dev-section-content';
        section.appendChild(title);
        section.appendChild(content);
        return section;
    }

    function addDevGroup(tab) {
        const tabEl = document.getElementById(tab + 'TabContent');
        const existingNames = new Set(
            Array.from(tabEl.querySelectorAll('.dev-section > .dev-section-title')).map(t => t.dataset.sid)
        );
        let name = 'New Group';
        let n = 2;
        while (existingNames.has(name)) { name = 'New Group (' + n + ')'; n++; }
        const section = createDevGroupElement(name);
        tabEl.appendChild(section);
        section.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    let sectionJustDragged = false;
    function setupDragReorder(handleSelector, itemSelector, onDrop, crossContainerSelector) {
        let dragging = null;
        let startY = 0;
        let moved = false;
        const THRESHOLD = 8;
        const TOUCH_HOLD_MS = 1000;
        const TOUCH_HOLD_MOVE_TOLERANCE = 10;
        let pendingTouch = null;

        function cancelPendingTouch() {
            if (pendingTouch) { clearTimeout(pendingTouch.timerId); pendingTouch = null; }
        }

        document.addEventListener('pointerdown', (e) => {
            const handle = e.target.closest(handleSelector);
            if (!handle) return;
            const item = handle.closest(itemSelector);
            if (!item) return;

            if (e.pointerType === 'touch') {
                const startX0 = e.clientX, startY0 = e.clientY, pointerId = e.pointerId;
                cancelPendingTouch();
                pendingTouch = {
                    item, startX: startX0, startY: startY0, pointerId,
                    timerId: setTimeout(() => {
                        if (!pendingTouch || pendingTouch.pointerId !== pointerId) return;
                        pendingTouch = null;
                        dragging = item;
                        startY = startY0;
                        moved = true;
                        dragging.classList.add('dev-reorder-dragging');
                    }, TOUCH_HOLD_MS),
                };
                return;
            }

            dragging = item;
            startY = e.clientY;
            moved = false;
        });

        document.addEventListener('pointermove', (e) => {
            if (pendingTouch && e.pointerId === pendingTouch.pointerId) {
                const dist = Math.hypot(e.clientX - pendingTouch.startX, e.clientY - pendingTouch.startY);
                if (dist > TOUCH_HOLD_MOVE_TOLERANCE) cancelPendingTouch();
                return;
            }
            if (!dragging) return;
            if (!moved && Math.abs(e.clientY - startY) > THRESHOLD) {
                moved = true;
                dragging.classList.add('dev-reorder-dragging');
            }
            if (!moved) return;
            e.preventDefault();
            if (crossContainerSelector) {
                const tabRoot = dragging.closest(DEV_PANEL_TABS.map(t => '#' + t + 'TabContent').join(', '));
                const containers = typeof crossContainerSelector === 'function'
                    ? crossContainerSelector(tabRoot, dragging)
                    : Array.from(tabRoot.querySelectorAll(crossContainerSelector));
                let targetContainer = containers.find(c => {
                    const r = c.getBoundingClientRect();
                    return e.clientY >= r.top && e.clientY <= r.bottom;
                });
                if (!targetContainer) {
                    let minDist = Infinity;
                    containers.forEach(c => {
                        const r = c.getBoundingClientRect();
                        const dist = Math.abs(e.clientY - (r.top + r.height / 2));
                        if (dist < minDist) { minDist = dist; targetContainer = c; }
                    });
                }
                if (!targetContainer) return;
                const targetSiblings = Array.from(targetContainer.querySelectorAll(':scope > ' + itemSelector)).filter(el => el !== dragging);
                const before = targetSiblings.find(sib => e.clientY < sib.getBoundingClientRect().top + sib.getBoundingClientRect().height / 2);
                if (before) targetContainer.insertBefore(dragging, before);
                else targetContainer.appendChild(dragging);
                return;
            }
            const siblings = Array.from(dragging.parentElement.querySelectorAll(':scope > ' + itemSelector)).filter(el => el !== dragging);
            for (const sib of siblings) {
                const rect = sib.getBoundingClientRect();
                const mid = rect.top + rect.height / 2;
                const draggingIsBefore = !!(dragging.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
                if (e.clientY < mid && !draggingIsBefore) { sib.parentElement.insertBefore(dragging, sib); break; }
                else if (e.clientY >= mid && draggingIsBefore) { sib.parentElement.insertBefore(dragging, sib.nextSibling); break; }
            }
        }, { passive: false });

        document.addEventListener('pointerup', (e) => {
            if (pendingTouch && e.pointerId === pendingTouch.pointerId) cancelPendingTouch();
            if (!dragging) return;
            dragging.classList.remove('dev-reorder-dragging');
            if (moved) { sectionJustDragged = true; if (onDrop) onDrop(); }
            dragging = null;
            moved = false;
        });
        document.addEventListener('pointercancel', (e) => {
            if (pendingTouch && e.pointerId === pendingTouch.pointerId) cancelPendingTouch();
            if (!dragging) return;
            dragging.classList.remove('dev-reorder-dragging');
            dragging = null;
            moved = false;
        });
    }

    function getSectionKey(titleEl) {
        const tab = DEV_PANEL_TABS.find(t => titleEl.closest('#' + t + 'TabContent')) || DEV_PANEL_TABS[0];
        return tab + ':' + (titleEl.dataset.sid || titleEl.textContent.replace(/^[▼▶]\s*/, ''));
    }
    function captureSectionCollapseState() {
        const state = {};
        document.querySelectorAll('.dev-section-title').forEach(titleEl => {
            state[getSectionKey(titleEl)] = titleEl.nextElementSibling.classList.contains('collapsed');
        });
        return state;
    }
    function applySectionCollapseState(state) {
        if (!state) return;
        document.querySelectorAll('.dev-section-title').forEach(titleEl => {
            const key = getSectionKey(titleEl);
            if (!(key in state)) return;
            const shouldCollapse = !!state[key];
            const content = titleEl.nextElementSibling;
            if (content.classList.contains('collapsed') !== shouldCollapse) {
                content.classList.toggle('collapsed');
                titleEl.textContent = content.classList.contains('collapsed') ? '▶ ' + titleEl.textContent.slice(2) : '▼ ' + titleEl.textContent.slice(2);
            }
        });
    }
    function getRowKey(row, fallbackIndex) {
        const idEl = row.querySelector('[id]');
        return idEl ? idEl.id : ('__row' + fallbackIndex);
    }
    function captureSection(sec) {
        const titleEl = sec.querySelector(':scope > .dev-section-title');
        const content = sec.querySelector(':scope > .dev-section-content');
        const rows = Array.from(content.querySelectorAll(':scope > .dev-row'));
        const subSections = Array.from(content.querySelectorAll(':scope > .dev-section'));
        return {
            key: getSectionKey(titleEl),
            rowKeys: rows.map((row, i) => getRowKey(row, i)),
            subgroups: subSections.map(sub => captureSection(sub)),
        };
    }
    function captureSectionOrder() {
        const result = {};
        DEV_PANEL_TABS.forEach(tab => {
            const tabId = tab + 'TabContent';
            const tabEl = document.getElementById(tabId);
            if (!tabEl) return;
            const sections = Array.from(tabEl.querySelectorAll(':scope > .dev-section'));
            result[tabId] = sections.map(sec => captureSection(sec));
        });
        return result;
    }
    function applySectionOrder(order) {
        if (!order) return;
        DEV_PANEL_TABS.forEach(tab => {
            const tabId = tab + 'TabContent';
            const tabEl = document.getElementById(tabId);
            const savedSections = order[tabId];
            if (!tabEl || !savedSections) return;
            const sectionsByKey = {};
            tabEl.querySelectorAll('.dev-section').forEach(sec => {
                sectionsByKey[getSectionKey(sec.querySelector(':scope > .dev-section-title'))] = sec;
            });
            const rowsByKey = {};
            tabEl.querySelectorAll('.dev-section-content > .dev-row').forEach((row, i) => {
                rowsByKey[getRowKey(row, i)] = row;
            });
            function placeSection(savedSec, parentContainer) {
                let sec = sectionsByKey[savedSec.key];
                if (!sec) {
                    const name = savedSec.key.split('>').pop().replace(new RegExp('^(' + DEV_PANEL_TABS.join('|') + '):'), '');
                    sec = createDevGroupElement(name);
                    sectionsByKey[savedSec.key] = sec;
                }
                parentContainer.appendChild(sec);
                const content = sec.querySelector(':scope > .dev-section-content');
                (savedSec.rowKeys || []).forEach(rowKey => {
                    const row = rowsByKey[rowKey];
                    if (row) content.appendChild(row);
                });
                (savedSec.subgroups || []).forEach(sub => placeSection(sub, content));
            }
            savedSections.forEach(savedSec => placeSection(savedSec, tabEl));
        });
    }

    function syncTabOrderToDesktop(targetTab) {
        if (targetTab === 'desktop') return;
        const desktopOrder = captureSectionOrder().desktopTabContent;
        const targetTabId = targetTab + 'TabContent';
        const targetTabEl = document.getElementById(targetTabId);
        if (!desktopOrder || !targetTabEl) return;

        const targetRowByDesktopId = {};
        targetTabEl.querySelectorAll('.dev-row [id]').forEach(idEl => {
            targetRowByDesktopId[resolveDevControlId(idEl.id).desktopId] = idEl.id;
        });
        const placedRowIds = new Set();

        function translateGroup(savedGroup) {
            const sid = savedGroup.key.slice(savedGroup.key.indexOf(':') + 1);
            const rowKeys = [];
            savedGroup.rowKeys.forEach(desktopRowKey => {
                const targetId = targetRowByDesktopId[desktopRowKey];
                if (!targetId) return;
                rowKeys.push(targetId);
                placedRowIds.add(targetId);
            });
            return { key: targetTab + ':' + sid, rowKeys, subgroups: (savedGroup.subgroups || []).map(translateGroup) };
        }
        const translated = desktopOrder.map(translateGroup);

        function findByKey(groups, key) {
            for (const g of groups) {
                if (g.key === key) return g;
                const found = findByKey(g.subgroups || [], key);
                if (found) return found;
            }
            return null;
        }
        targetTabEl.querySelectorAll('.dev-row [id]').forEach(idEl => {
            if (placedRowIds.has(idEl.id)) return;
            const sec = idEl.closest('.dev-section');
            if (!sec) return;
            const key = getSectionKey(sec.querySelector(':scope > .dev-section-title'));
            const group = findByKey(translated, key);
            if (group) group.rowKeys.push(idEl.id);
        });

        function collectKeys(groups, out) {
            groups.forEach(g => { out.add(g.key); collectKeys(g.subgroups || [], out); });
            return out;
        }
        const translatedKeys = collectKeys(translated, new Set());
        targetTabEl.querySelectorAll(':scope > .dev-section').forEach(sec => {
            const key = getSectionKey(sec.querySelector(':scope > .dev-section-title'));
            if (!translatedKeys.has(key)) translated.push(captureSection(sec));
        });

        applySectionOrder({ [targetTabId]: translated });
    }

    function resolveDevControlId(id) {
        const m = id.match(/^(slider|color|select|checkbox)(Mobile|Landscape)(.+)$/);
        if (m) return { device: m[2] === 'Landscape' ? 'landscape' : 'mobile', desktopId: m[1] + m[3] };
        return { device: 'desktop', desktopId: id };
    }

    function findGroupContent(tabId, groupSid, callerName, ctrlId) {
        const matches = document.querySelectorAll('#' + tabId + 'TabContent > .dev-section > .dev-section-title[data-sid="' + groupSid.replace(/"/g, '\\"') + '"]');
        if (matches.length === 0) {
            console.warn(callerName + ': group not found', groupSid, ctrlId);
            return null;
        }
        if (matches.length > 1) {
            console.warn(callerName + ': ' + matches.length + ' groups share this data-sid (using the first) - a rename/duplication collision', groupSid, ctrlId);
        }
        return matches[0].nextElementSibling;
    }

    function buildSliderRow(ctrl) {
        const row = document.createElement('div');
        row.className = 'dev-row';
        const label = document.createElement('span');
        label.className = 'dev-label';
        label.textContent = ctrl.label;
        row.appendChild(label);
        const input = document.createElement('input');
        input.type = 'range';
        input.className = 'dev-slider';
        input.id = ctrl.id;
        input.min = ctrl.min;
        input.max = ctrl.max;
        input.step = ctrl.step;
        input.value = ctrl.value;
        row.appendChild(input);
        const value = document.createElement('span');
        value.className = 'dev-value';
        value.id = ctrl.id.replace(/^slider/, 'value');
        value.textContent = ctrl.value;
        row.appendChild(value);
        return row;
    }
    function buildColorRow(ctrl) {
        const row = document.createElement('div');
        row.className = 'dev-row';
        const label = document.createElement('span');
        label.className = 'dev-label';
        label.textContent = ctrl.label;
        row.appendChild(label);
        const input = document.createElement('input');
        input.type = 'color';
        input.className = 'dev-color-picker';
        input.id = ctrl.id;
        input.value = ctrl.value;
        row.appendChild(input);
        if (ctrl.note) {
            const note = document.createElement('span');
            note.className = 'dev-value';
            note.style.fontSize = '9px';
            note.style.color = '#888';
            note.textContent = ctrl.note;
            row.appendChild(note);
        }
        return row;
    }
    function buildSelectRow(ctrl) {
        const row = document.createElement('div');
        row.className = 'dev-row';
        const label = document.createElement('span');
        label.className = 'dev-label';
        label.textContent = ctrl.label;
        row.appendChild(label);
        const select = document.createElement('select');
        select.className = 'dev-select';
        select.id = ctrl.id;
        ctrl.options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.value;
            option.textContent = opt.text;
            select.appendChild(option);
        });
        row.appendChild(select);
        return row;
    }
    function buildCheckboxRow(ctrl) {
        const row = document.createElement('div');
        row.className = 'dev-row';
        const wrapLabel = document.createElement('label');
        wrapLabel.style.cssText = 'display:flex; align-items:center; gap:6px; cursor:pointer;';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = ctrl.id;
        wrapLabel.appendChild(input);
        const span = document.createElement('span');
        span.className = 'dev-label';
        span.style.minWidth = 'auto';
        span.textContent = ctrl.label;
        wrapLabel.appendChild(span);
        row.appendChild(wrapLabel);
        return row;
    }
    function buildTextInputRow(ctrl) {
        const row = document.createElement('div');
        row.className = 'dev-row';
        const label = document.createElement('span');
        label.className = 'dev-label';
        label.textContent = ctrl.label;
        row.appendChild(label);
        const input = document.createElement('input');
        input.type = ctrl.inputType;
        input.className = 'dev-text-input' + (ctrl.wide ? ' dev-text-input-wide' : '');
        input.id = ctrl.id;
        if (ctrl.inputType === 'number' && ctrl.step !== undefined) input.step = ctrl.step;
        input.value = ctrl.value;
        row.appendChild(input);
        return row;
    }
    const UNIFORM_ROW_BUILDERS = { slider: buildSliderRow, color: buildColorRow, select: buildSelectRow, checkbox: buildCheckboxRow };
    function buildUniformControlRow(ctrl) {
        const builder = UNIFORM_ROW_BUILDERS[ctrl.type];
        if (!builder) {
            console.error('buildUniformControlRow: unknown control type', ctrl.type, ctrl.id);
            const row = document.createElement('div');
            row.className = 'dev-row';
            return row;
        }
        return builder(ctrl);
    }

    const DEV_PANEL_REGISTERED_ARRAYS = [];
    function registerDevControlArray(name, array) {
        DEV_PANEL_REGISTERED_ARRAYS.push({ name, array });
    }

    let devControlIdValidator = null;
    function registerDevControlIdValidator(fn) { devControlIdValidator = fn; }
    function validateDevControlMappings() {
        if (!devControlIdValidator) return 0;
        let badCount = 0;
        DEV_PANEL_REGISTERED_ARRAYS.forEach(({ name, array }) => {
            array.forEach(ctrl => {
                const result = devControlIdValidator(ctrl);
                if (result !== true) {
                    console.error('validateDevControlMappings: ' + (typeof result === 'string' ? result : 'unmapped id'), name, ctrl.id);
                    badCount++;
                }
            });
        });
        if (badCount > 0) console.error('validateDevControlMappings: ' + badCount + ' control(s) failed validation - see errors above.');
        return badCount;
    }

    function assertDevControlsRendered() {
        let missing = 0;
        DEV_PANEL_REGISTERED_ARRAYS.forEach(({ array }) => {
            array.forEach(ctrl => { if (!document.getElementById(ctrl.id)) missing++; });
        });
        if (missing > 0) {
            console.error('assertDevControlsRendered: ' + missing + ' generated control(s) missing from the DOM at setup time - a render call may be missing, misordered, or its group lookup failed (see findGroupContent warnings above).');
        }
        return missing;
    }

    let devSliderValueResolver = null;
    let devColorValueResolver = null;
    function registerDevValueResolvers({ slider, color }) {
        if (slider) devSliderValueResolver = slider;
        if (color) devColorValueResolver = color;
    }
    function syncSlidersFromState() {
        if (!devSliderValueResolver) return;
        document.querySelectorAll('.dev-slider').forEach(el => {
            const value = devSliderValueResolver(el.id);
            if (value === undefined) return;
            if (typeof value === 'number') {
                const min = parseFloat(el.min), max = parseFloat(el.max);
                if (!isNaN(max) && value > max) el.max = String(value + Math.abs(value) * 0.2);
                if (!isNaN(min) && value < min) el.min = String(value - Math.abs(value) * 0.2);
            }
            el.value = value;
            el.dispatchEvent(new Event('input', { bubbles: true }));
        });
    }
    function syncColorPickersFromState() {
        if (!devColorValueResolver) return;
        document.querySelectorAll('.dev-color-picker').forEach(el => {
            const value = devColorValueResolver(el.id);
            if (value !== undefined) { el.value = value; el.dispatchEvent(new Event('input', { bubbles: true })); }
        });
    }

    function makeDevValuesEditable() {
        document.querySelectorAll('.dev-value[id]').forEach(valueEl => {
            const sliderId = valueEl.id.replace(/^value/, 'slider');
            const slider = document.getElementById(sliderId);
            if (!slider || slider.type !== 'range') return;
            valueEl.classList.add('dev-value-editable');
        });

        document.addEventListener('click', (e) => {
            const valueEl = e.target.closest('.dev-value-editable');
            if (!valueEl || valueEl.querySelector('input')) return;
            const slider = document.getElementById(valueEl.id.replace(/^value/, 'slider'));
            if (!slider) return;

            const originalText = valueEl.textContent;
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'dev-value-edit-input';
            input.value = slider.value;
            valueEl.textContent = '';
            valueEl.appendChild(input);
            input.focus();
            input.select();

            let settled = false;
            function commit() {
                if (settled) return;
                settled = true;
                let val = parseFloat(input.value);
                if (isNaN(val)) val = parseFloat(slider.value);
                const min = parseFloat(slider.min), max = parseFloat(slider.max);
                if (val > max) slider.max = String(val + Math.abs(val) * 0.2);
                if (val < min) slider.min = String(val - Math.abs(val) * 0.2);
                slider.value = val;
                input.remove();
                slider.dispatchEvent(new Event('input', { bubbles: true }));
            }
            function cancel() {
                if (settled) return;
                settled = true;
                valueEl.textContent = originalText;
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter') input.blur();
                else if (ev.key === 'Escape') cancel();
            });
            input.addEventListener('click', (ev) => ev.stopPropagation());
        });
    }

    let textEditModeEnabled = false;
    let devTextOverrides = {};
    const devTextOriginals = {};
    function getDevLabelKey(labelEl) {
        const row = labelEl.closest('.dev-row');
        const control = row ? row.querySelector('[id]') : null;
        return control ? control.id : null;
    }
    function devTextOriginalFor(key, currentText) {
        if (!(key in devTextOriginals)) devTextOriginals[key] = currentText;
        return devTextOriginals[key];
    }
    function applyDevTextOverrides() {
        document.querySelectorAll('.dev-section-title').forEach(titleEl => {
            const key = getSectionKey(titleEl);
            const arrow = titleEl.textContent.slice(0, 2);
            const original = devTextOriginalFor(key, titleEl.textContent.slice(2));
            titleEl.textContent = arrow + (devTextOverrides[key] != null ? devTextOverrides[key] : original);
        });
        document.querySelectorAll('.dev-label').forEach(labelEl => {
            const key = getDevLabelKey(labelEl);
            if (!key) return;
            const original = devTextOriginalFor(key, labelEl.textContent);
            labelEl.textContent = devTextOverrides[key] != null ? devTextOverrides[key] : original;
        });
    }
    function openDevTextEditFor(el, key, isTitle) {
        if (!key || el.querySelector('textarea')) return;
        const arrow = isTitle ? el.textContent.slice(0, 2) : '';
        const original = devTextOriginalFor(key, isTitle ? el.textContent.slice(2) : el.textContent);
        const currentValue = devTextOverrides[key] != null ? devTextOverrides[key] : original;
        const originalHTML = el.innerHTML;
        const input = document.createElement('textarea');
        input.rows = 1;
        input.value = currentValue;
        el.textContent = '';
        if (isTitle) el.appendChild(document.createTextNode(arrow));
        el.appendChild(input);
        input.focus();
        input.select();
        input.addEventListener('pointerdown', (ev) => ev.stopPropagation());
        input.addEventListener('click', (ev) => ev.stopPropagation());
        let settled = false;
        function commit() {
            if (settled) return;
            settled = true;
            const typed = input.value;
            devTextOverrides[key] = (typed === '' || typed === original) ? null : typed;
            el.textContent = arrow + (devTextOverrides[key] != null ? devTextOverrides[key] : original);
        }
        function cancel() {
            if (settled) return;
            settled = true;

        return DEV_PANEL_HANDLE_OVERHANG_PX + (isNarrowViewport() ? DEV_PANEL_MOBILE_EDGE_GESTURE_MARGIN_PX : 0);

        const maxLeft = Math.max(ox, window.innerWidth - rect.width - ox);
        const maxTop = Math.max(o, window.innerHeight - rect.height - o);
        const clampedLeft = Math.min(Math.max(ox, DEV_PANEL_LAYOUT.left), maxLeft);
        const clampedTop = Math.min(Math.max(o, DEV_PANEL_LAYOUT.top), maxTop);
        if (clampedLeft !== DEV_PANEL_LAYOUT.left) setDevPanelLayoutVar('left', '--dev-panel-left-px', clampedLeft);

        const ox = devPanelEdgeMarginX();
        const newLeft = Math.max(ox, Math.min(window.innerWidth - panelRect.width - ox, devPanelDragStart.panelLeft + dx));

    function setupPanelResizeHandle(panel, handle, xEdge, yEdge) {
        let dragging = false;
        let start = { pointerX: 0, pointerY: 0, left: 0, top: 0, width: 0, height: 0 };

        handle.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const rect = panel.getBoundingClientRect();
            start = { pointerX: e.clientX, pointerY: e.clientY, left: rect.left, top: rect.top, width: rect.width, height: rect.height };
            dragging = true;
            try { handle.setPointerCapture(e.pointerId); } catch (err) { /* best-effort only */ }
        });

        document.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            if (e.buttons === 0) { end(e); return; }
            const cs = getComputedStyle(panel);
            const minW = parseFloat(cs.minWidth) || 0, maxW = parseFloat(cs.maxWidth) || Infinity;
            const minH = parseFloat(cs.minHeight) || 0, maxH = parseFloat(cs.maxHeight) || Infinity;
            const dx = e.clientX - start.pointerX;
            const dy = e.clientY - start.pointerY;

            let newWidth = start.width, newLeft = start.left;
            if (xEdge === 'right') {
                newWidth = Math.max(minW, Math.min(maxW, start.width + dx));
                const maxWidthFromEdge = window.innerWidth - start.left - devPanelEdgeMarginX();
                newWidth = Math.min(newWidth, Math.max(minW, maxWidthFromEdge));
            } else if (xEdge === 'left') {
                newWidth = Math.max(minW, Math.min(maxW, start.width - dx));
                newLeft = start.left + (start.width - newWidth);
                const clampedLeft = Math.max(devPanelEdgeMarginX(), newLeft);
                if (clampedLeft !== newLeft) { newWidth = newWidth - (clampedLeft - newLeft); newLeft = clampedLeft; }
            }
            let newHeight = start.height, newTop = start.top;
            if (yEdge === 'bottom') {
                newHeight = Math.max(minH, Math.min(maxH, start.height + dy));
            } else if (yEdge === 'top') {
                newHeight = Math.max(minH, Math.min(maxH, start.height - dy));
                newTop = start.top + (start.height - newHeight);
                const clampedTop = Math.max(DEV_PANEL_HANDLE_OVERHANG_PX, newTop);
                if (clampedTop !== newTop) { newHeight = newHeight - (clampedTop - newTop); newTop = clampedTop; }
            }

            panel.style.width = newWidth + 'px';
            panel.style.height = newHeight + 'px';
            if (xEdge === 'left') setDevPanelLayoutVar('left', '--dev-panel-left-px', Math.round(newLeft));
            if (yEdge === 'top') setDevPanelLayoutVar('top', '--dev-panel-top-px', Math.round(newTop));
        });

        function end(e) {
            if (!dragging) return;
            dragging = false;
            if (e && e.pointerId !== undefined && handle.hasPointerCapture(e.pointerId)) handle.releasePointerCapture(e.pointerId);
        }
        document.addEventListener('pointerup', end);
        document.addEventListener('pointercancel', end);
        handle.addEventListener('lostpointercapture', end);
    }

    // Tier 1: a Vercel serverless function (api/save-settings.js) that
    // commits straight to data/processed/dev-panel-settings.json via
    // GitHub's Contents API. The ONLY tier that works from a device with
    // no local filesystem access of its own (e.g. a phone visiting the
    // deployed site with ?dev=1). Returns {ok, error} rather than a bare
    // boolean so the function's own error responses (missing env vars,
    // secret mismatch, GitHub API failure) can be surfaced directly.
    async function writeSettingsViaApi(data) {
        try {
            const resp = await fetch('/api/save-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Dev-Panel-Secret': DEV_PANEL_SAVE_SECRET },
                body: JSON.stringify(data),
            });
            const body = await resp.json().catch(() => ({}));
            if (resp.ok && body.ok === true) return { ok: true };
            return { ok: false, error: body.error || `HTTP ${resp.status}` };
        } catch (err) {
            return { ok: false, error: 'offline or unreachable: ' + String((err && err.message) || err) };
        }
    }
    async function readSettingsViaApi() {
        try {
            const resp = await fetch('/data/processed/dev-panel-settings.json', { cache: 'no-store' });
            if (!resp.ok) return null; // e.g. 404 before the file exists yet
            return await resp.json();
        } catch (err) {
            return null;
        }
    }

    // Tier 3 last resort: when nothing above reached the git-tracked log at
    // all, hand the user a real file they can save themselves.
    function downloadSettingsAsFile(data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = GIT_SETTINGS_FILENAME;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    function idbOpen() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function idbGet(key) {
        const db = await idbOpen();
        return new Promise((resolve, reject) => {
            const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function idbSet(key, val) {
        const db = await idbOpen();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    // mode: 'read' (boot/Reset — never prompts) or 'readwrite' (Save — may
    // prompt, since it always runs from a real click/keydown user gesture).
    async function getGitSettingsFileHandle(mode, promptIfMissing) {
        if (!('showSaveFilePicker' in window)) return null;
        let handle = null;
        try { handle = await idbGet(IDB_HANDLE_KEY); } catch (err) { handle = null; }
        if (handle) {
            try {
                let perm = await handle.queryPermission({ mode }); // never shows UI
                if (perm !== 'granted' && promptIfMissing) {
                    perm = await handle.requestPermission({ mode }); // needs a user gesture
                }
                if (perm === 'granted') return handle;
            } catch (err) { /* handle stale/revoked — fall through to re-prompt */ }
        }
        if (!promptIfMissing) return null; // boot-time/Reset read: never force a picker with no gesture behind it
        try {
            handle = await window.showSaveFilePicker({
                suggestedName: GIT_SETTINGS_FILENAME,
                types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }],
            });
            await idbSet(IDB_HANDLE_KEY, handle);
            return handle;
        } catch (err) {
            return null; // user cancelled the picker, or the API is blocked
        }
    }
    async function writeGitSettingsLog(data) {
        const handle = await getGitSettingsFileHandle('readwrite', true);
        if (!handle) return false;
        try {
            const writable = await handle.createWritable();
            await writable.write(JSON.stringify(data, null, 2));
            await writable.close();
            return true;
        } catch (err) {
            return false;
        }
    }
    async function readGitSettingsLog() {
        const handle = await getGitSettingsFileHandle('read', false);
        if (!handle) return null;
        try {
            const file = await handle.getFile();
            return JSON.parse(await file.text());
        } catch (err) {
            return null; // missing/empty/corrupt file, or permission not actually granted
        }
    }

    async function saveDevPanelSettings() {
        const status = document.getElementById('devSaveSyncStatus');
        const flash = (text) => { if (status) { status.textContent = text; setTimeout(() => { status.textContent = ''; }, 1500); } };
        const snapshot = captureFullDevPanelState();

        // Tier 1: Vercel/GitHub API — works from any device, so try it
        // whenever a real server is behind the page at all.
        if (location.protocol !== 'file:') {
            const result = await writeSettingsViaApi(snapshot);
            if (result.ok) { flash('saved to repo'); return; }
            // A genuinely deployed page must NEVER fall through to a
            // local-save mechanism (Tier 2's native picker, or Tier 3's
            // download dialog) — report the real failure and stop.
            if (!IS_LOCAL_CONTEXT) {
                console.error('[saveDevPanelSettings] Vercel/GitHub API write failed:', result.error);
                flash('save failed');
                return;
            }
        }

        // Tier 2: direct local disk write via the File System Access API.
        // Local dev only — never reached on a real deployment (guard above).
        if (GIT_LOG_WRITABLE) {
            const ok = await writeGitSettingsLog(snapshot);
            if (ok) { flash('saved'); return; }
            // fall through to Tier 3 rather than reporting outright failure
        }

        // Tier 3: nothing above reached the git-tracked log at all — hand
        // the user a real downloadable file AND stash it in this tab's own
        // sessionStorage (never a persistent local default), rather than
        // failing outright, and say so honestly rather than claiming a
        // real git-log save. Also keeps the old localStorage key updated
        // as a final belt-and-braces fallback for this exact browser.
        try {
            downloadSettingsAsFile(snapshot);
            sessionStorage.setItem(SESSION_FALLBACK_KEY, JSON.stringify(snapshot));
            localStorage.setItem(DEV_PANEL_LOCALSTORAGE_KEY, JSON.stringify(snapshot));
            flash('saved (session only)');
        } catch (e) {
            flash('save failed');
        }
    }

    async function loadDevPanelSettingsAsync() {
        let snap = null;
        // Tier 1: the git-tracked settings log is just a static asset once
        // committed, so a plain fetch works on ANY server.
        if (location.protocol !== 'file:') {
            snap = await readSettingsViaApi();
        }
        // Tier 2: this browser's own previously-granted File System Access handle.
        if (!snap && GIT_LOG_WRITABLE) {
            snap = await readGitSettingsLog();
        }
        // Tier 3: this tab's own sessionStorage fallback, then the old
        // localStorage key as a final fallback.
        if (!snap) {
            try { snap = JSON.parse(sessionStorage.getItem(SESSION_FALLBACK_KEY)); } catch (err) { snap = null; }
        }
        if (!snap) {
            try {
                const raw = localStorage.getItem(DEV_PANEL_LOCALSTORAGE_KEY);
                snap = raw ? JSON.parse(raw) : null;
            } catch (err) { snap = null; }
        }
        return snap;
    }

    // 24 frames per sequence (001-024) by default, a different count from

    // pose before the sequence diverges into a fist-close or thumbs-up,

    // preference to the shared direction-level value when present. Only
    // add an override when a real recompute actually shows a difference
    // (as here) — don't add one speculatively "just in case."
    //
    // TO REGENERATE (e.g. after replacing a direction's own frame 1 art):
    //   node -e "const sharp=require('sharp'); (async()=>{const img=sharp('data/FLICK/2TONED/<FOLDER>_MF/FIST/<prefix>_001.png'); const {data,info}=await img.raw().ensureAlpha().toBuffer({resolveWithObject:true}); const w=info.width,h=info.height,c=info.channels; let minX=w,maxX=-1,minY=h,maxY=-1; for(let y=0;y<h;y++){for(let x=0;x<w;x++){const a=data[(y*w+x)*c+(c-1)]; if(a>10){if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}}} console.log({centerX:+(((minX+maxX)/2)/w).toFixed(4), bottomY:+(((maxY+1)/h)).toFixed(4)});})()"
    const WIN_LOSE_ASSETS = {

    function winLoseVisibleBounds(directionKey, type) {
        const wl = WIN_LOSE_ASSETS[directionKey];
        if (!wl) return { centerX: 0.5, bottomY: 1 };
        const asset = wl[type];
        if (asset && asset.centerX !== undefined) return { centerX: asset.centerX, bottomY: asset.bottomY };

    }
    function winLoseFrameUrl(asset, n) {

    // ensureDirectionLoaded() — only actually fetched once a real Win/Lose
    // click needs that specific direction's own sequence, not eagerly for

    const winLoseCache = {};
    function ensureWinLoseLoaded(directionKey, type) {
        const cacheKey = directionKey + '|' + type;
        if (winLoseCache[cacheKey]) return winLoseCache[cacheKey];
        const wl = WIN_LOSE_ASSETS[directionKey];
        const asset = wl && wl[type];
        const frames = [];
        if (asset) {
            for (let n = 1; n <= asset.frameCount; n++) {
                frames.push(loadImageWithRetry(winLoseFrameUrl(asset, n)));

        winLoseCache[cacheKey] = frames;
        return frames;
    }

    function wireLevelControls() {

            const el = document.getElementById('levelStatus');

            el.textContent = text;
            setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 1800);
        };
        document.getElementById('btnSaveLevel').addEventListener('click', async () => {
            const name = document.getElementById('inputLevelName').value.trim();
            if (!name) { flashLevelStatus('enter a name'); return; }
            levels[name] = {
                rects: levelRects.map(r => ({ ...r })),
                ballSpawnPoints: ballSpawnPoints.map(p => ({ x: p.x, y: p.y })),
                maxHands: currentMaxHands,
            };
            refreshLevelSelectOptions();
            document.getElementById('selectLevelName').value = name;
            flashLevelStatus('saving…');
            await saveDevPanelSettings();
            flashLevelStatus('saved "' + name + '"');
        });
        document.getElementById('btnLoadLevel').addEventListener('click', () => {
            const name = document.getElementById('selectLevelName').value;
            if (!name || !levels[name]) return;
            // Loading REPLACES the current geometry — same "restore
            // exactly, don't merge" behavior as Scenes' own Load.
            // Entities are left untouched (a level never contained them).
            levelRects.length = 0;
            levelRects.push(...levels[name].rects.map(r => ({ ...r })));
            ballSpawnPoints.length = 0;
            ballSpawnPoints.push(...levels[name].ballSpawnPoints.map(p => ({ x: p.x, y: p.y })));
            currentMaxHands = levels[name].maxHands ?? null;
            currentLevelName = name;
            levelAttemptResolved = false;
            flashLevelStatus('loaded "' + name + '"');
        });
        document.getElementById('btnDeleteLevel').addEventListener('click', async () => {
            const name = document.getElementById('selectLevelName').value;
            if (!name || !levels[name]) return;
            delete levels[name];
            refreshLevelSelectOptions();
            flashLevelStatus('deleting…');
            await saveDevPanelSettings();
            flashLevelStatus('deleted "' + name + '"');
        });
        document.getElementById('btnRenameLevel').addEventListener('click', async () => {
            const oldName = document.getElementById('selectLevelName').value;
            const newName = document.getElementById('inputLevelRename').value.trim();
            if (!oldName || !levels[oldName] || !newName) { flashLevelStatus('pick a level + enter a new name'); return; }
            levels[newName] = levels[oldName];
            delete levels[oldName];
            refreshLevelSelectOptions();
            document.getElementById('selectLevelName').value = newName;
            document.getElementById('inputLevelRename').value = '';
            flashLevelStatus('saving…');
            await saveDevPanelSettings();
            flashLevelStatus('renamed to "' + newName + '"');
        });
        const maxHandsSlider = document.getElementById('sliderMaxHands');
        const maxHandsValue = document.getElementById('inputMaxHandsValue');
        const unlimitedCheckbox = document.getElementById('checkboxUnlimitedHands');
        const syncMaxHandsFromSlider = () => {
            const v = parseInt(maxHandsSlider.value, 10);
            maxHandsValue.value = String(v);
            currentMaxHands = v;
        };
        maxHandsSlider.addEventListener('input', syncMaxHandsFromSlider);
        maxHandsValue.addEventListener('change', () => {
            // Click-to-type, auto-expanding range — same §12h convention
            // as every other numeric dev-panel control in this file.
            let v = parseInt(maxHandsValue.value, 10);
            if (!Number.isFinite(v)) v = parseInt(maxHandsSlider.value, 10);
            v = Math.max(1, v);
            if (v > parseInt(maxHandsSlider.max, 10)) maxHandsSlider.max = String(Math.ceil(v * 1.2));
            maxHandsSlider.value = String(v);
            maxHandsValue.value = String(v);
            currentMaxHands = v;
        });
        unlimitedCheckbox.addEventListener('change', () => {
            maxHandsSlider.disabled = unlimitedCheckbox.checked;
            maxHandsValue.disabled = unlimitedCheckbox.checked;
            currentMaxHands = unlimitedCheckbox.checked ? null : parseInt(maxHandsSlider.value, 10);
        });
        const modeSelect = document.getElementById('selectTargetMode');
        const durationInput = document.getElementById('inputTargetSettleDuration');
        modeSelect.addEventListener('change', () => {
            if (selectedLevelRect && selectedLevelRect.type === 'target') selectedLevelRect.targetMode = modeSelect.value;
        });
        durationInput.addEventListener('change', () => {
            if (selectedLevelRect && selectedLevelRect.type === 'target') {
                const v = parseFloat(durationInput.value);
                if (Number.isFinite(v) && v > 0) selectedLevelRect.settleDuration = v;
            }
        });
    }

    // Applies every "UI" dev-panel setting (global font/size/outline/

    // once at boot (so the real cfg defaults take effect, not the CSS
    // fallback values) and again on every live change (including a
    // restored Save Settings snapshot replaying through the input/change
    // events applyControlValues() dispatches).
    function applyButtonUiSettings() {
        const root = document.documentElement.style;
        root.setProperty('--btn-font-family', cfg.buttonFontFamily);
        root.setProperty('--btn-font-size', cfg.buttonFontSize + 'px');

        root.setProperty('--btn-padding-h', cfg.buttonPaddingHorizontal + 'px');
        root.setProperty('--btn-gap-h', cfg.buttonGapHorizontal + 'px');

    // computed live from row 1's own MEASURED height (not a hardcoded

    // height directly. Re-run after any of those change, and once at boot.
    function repositionButtonRow2() {
        const row1 = document.querySelector('.sim-controls');
        const row2 = document.querySelector('.sim-controls-row2');
        if (!row1 || !row2) return;

    const HANDS_EDGE_LOCK_SIGN = { left: 1, top: 1, center: 1, right: -1, bottom: -1 };

    // cfg.peakHoldFrames extra frames at the sequence's midpoint (the last
    // A-forward frame, playSequence index N-1, immediately before it
    // reverses) - not baked into playSequence itself (which stays a plain
    // forward+reverse array, still shared/cached per direction regardless
    // of the live slider value) but resolved here so a live change to the
    // slider takes effect immediately, including mid-playback.
    function playSequenceLength(n, hold) {
        return (2 * n - 1) + hold;
    }
    function resolvePlaySequenceIndex(virtualIndex, n, hold) {
        if (virtualIndex < n) return virtualIndex;
        if (virtualIndex < n + hold) return n - 1;
        return virtualIndex - hold;
    }

    // Lazy-loaded per direction (only the directions the mouse actually
    // visits get fetched) rather than eagerly preloading all 8*20 = 160
    // frames on page load.
    // A frame image gets up to 3 automatic reload attempts on a failed
    // load (onerror, or settling at complete+naturalWidth===0 with no
    // error event at all - both observed against this exact asset set)
    // before being left alone - a transient hiccup shouldn't permanently
    // blank the entity out for the rest of the session.
    const IMG_LOAD_MAX_RETRIES = 3;
    const IMG_LOAD_RETRY_DELAY_MS = 400;
    function loadImageWithRetry(src) {
        const img = new Image();
        let retriesLeft = IMG_LOAD_MAX_RETRIES;
        function attempt() {
            img.src = src + (retriesLeft < IMG_LOAD_MAX_RETRIES ? ('?retry=' + (IMG_LOAD_MAX_RETRIES - retriesLeft)) : '');
        }
        img.addEventListener('error', () => {
            if (retriesLeft > 0) { retriesLeft--; setTimeout(attempt, IMG_LOAD_RETRY_DELAY_MS); }
        });
        img.addEventListener('load', () => {
            if (img.naturalWidth === 0 && retriesLeft > 0) { retriesLeft--; setTimeout(attempt, IMG_LOAD_RETRY_DELAY_MS); }
        });
        attempt();
        return img;
    }

    const directionCache = {};
    function ensureDirectionLoaded(key) {
        if (directionCache[key]) return directionCache[key];
        const dir = DIRECTIONS.find(d => d.key === key);
        const frames = [];
        for (let n = 1; n <= DIRECTION_FRAME_COUNT; n++) {
            frames.push(loadImageWithRetry(directionFrameUrl(dir, n)));
        }
        // Forward then reverse, excluding the duplicated peak frame at
        // the seam (same technique DickoClicko's own SCISSOR sets used).
        const playSequence = frames.concat(frames.slice(0, -1).reverse());
        const entry = { frames, playSequence };
        directionCache[key] = entry;
        return entry;
    }

    // Pre-scaled idle-frame (frame 1) cache — a real, reported mobile
    // performance issue: `ctx.drawImage(img, ...)` scaling a large source
    // (source frames run up to 2400x1181px) down to on-screen size is a
    // real per-call cost on weaker mobile GPUs, and frame 1 is what EVERY
    // idle (non-playing) entity draws, every single frame, plus the live
    // spawn/drag preview — exactly the draw calls active during placing,
    // rotating, and moving entities (all Stop-mode activities, where
    // nothing is ever mid-flick). Caches one already-correctly-sized
    // canvas per direction, keyed on the current `size` (drawW before
    // aspect) — that's the one value shared by every direction (a single
    // global cfg.entityScale × vmin), so a size change (the slider, or a
    // window resize changing vmin) invalidates just that direction's own
    // cached canvas on its next read, not a separate per-direction size
    // tracked independently. NOT used for a mid-flick playing entity's
    // frame (those change every tick and are individually short-lived, so
    // caching every one of them isn't worth the memory) — only frame 1.
    const idleFrameScaledCache = {};

        const cached = idleFrameScaledCache[directionKey];
        if (cached && cached.size === size) return cached;
        const img = ensureDirectionLoaded(directionKey).frames[0];
        if (!img || !img.complete || img.naturalWidth === 0) return null;
        const aspect = img.naturalHeight / img.naturalWidth;
        const w = Math.max(1, Math.round(size)), h = Math.max(1, Math.round(size * aspect));

        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const entry = { canvas, size, drawW: w, drawH: h };
        idleFrameScaledCache[directionKey] = entry;
        return entry;
    }

                t = (b * s + f) / e;
                if (t < 0) { t = 0; s = Math.max(0, Math.min(1, -c / a)); }
                else if (t > 1) { t = 1; s = Math.max(0, Math.min(1, (b - c) / a)); }
            }
        }
        const c1x = p1x + d1x * s, c1y = p1y + d1y * s;
        const c2x = p2x + d2x * t, c2y = p2y + d2y * t;
        const dx = c1x - c2x, dy = c1y - c2y;
        return { s, t, c1x, c1y, c2x, c2y, distSq: dx * dx + dy * dy };
    }

    // Auto-trigger boundary for the flick sequence: true when the ball is
    // within the union of the joint-collision capsules across EVERY frame
    // (1..DIRECTION_FRAME_COUNT) of the current direction's flick
    // animation — not just whatever pose is currently on screen. Per
    // explicit correction ("the vicinity is defined by the collision
    // bodies at ANY point within the animation sequence, not just the
    // peak point"): an earlier version checked only frame
    // DIRECTION_FRAME_COUNT (the fully-extended peak) alone, which was
    // judged too narrow — a ball sitting somewhere the fingers only pass
    // through mid-swing, never reaching the fully-extended peak's own
    // position, wouldn't have triggered it.
    //
    // Reuses the exact same local->world transform and thickness math
    // updateBallAndCollision() already uses for the LIVE pose (drawW/
    // drawH from entityScale+aspect, the entity's own fixed x/y/
    // rotationRad for the rigid transform, cfg.jointThickness for capsule
    // half-width) — this is deliberately the SAME geometry the real
    // collision already uses, just evaluated once per candidate frame
    // instead of only the one currently playing, so "vicinity" means
    // exactly "would touch the hand at some point during a real flick,"
    // not an arbitrary separate distance. ex/ey are the SPAWNED entity's
    // own fixed position (was the single global entityX/entityY before
    // the spawn-placement rework — every entity now has its own).

    // Local (unrotated, untranslated) pixel offset of a normalized (0-1)
    // point within the sprite's own box, anchored at the CENTER-BASE of
    // the frame's own VISIBLE (non-transparent) content — per explicit
    // correction ("i want the centre base of the visible portion of the
    // frame to be placed on that point, not the base of the png"): an
    // earlier version anchored to the full PNG's own bottom-center
    // (px=0.5, py=1), which is wrong whenever the source art has real
    // transparent padding around the visible hand/wrist (confirmed this
    // padding exists — see computeVisibleBounds below). centerX/bottomY
    // (both still normalized 0-1, in the SAME coordinate space as px/py)
    // default to 0.5/1 — the old full-image convention — for the brief
    // window before a direction's visible bounds have been computed yet
    // (see getVisibleBoundsForDirection's own comment), so nothing breaks
    // while that one-time scan is still pending. Shared by every place
    // that needs a skeleton joint's local position (this function,
    // updateBallAndCollision) AND by render()'s own drawImage/hitbox
    // placement — all 3 must agree on the same anchor or the drawn
    // sprite, its collision geometry, and its debug hitbox would silently
    // drift apart.
    // xOffsetPx (added — Animation X Offset, cfg.entityXOffsetByDirection)
