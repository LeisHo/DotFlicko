        SKELETON_POINTS.forEach(pk => {
            if (!a[pk] || !b[pk]) return;
            out[pk] = { x: a[pk].x + (b[pk].x - a[pk].x) * t, y: a[pk].y + (b[pk].y - a[pk].y) * t };
        });
        return out;
    }
    // The real underlying frame number (1-20) the currently-drawn image
    // corresponds to — mirrors resolvePlaySequenceIndex()'s own forward/
    // hold/reverse logic exactly, but returns a FRAME NUMBER (for
    // skeleton lookup) rather than a playSequence array index (for image
    // lookup). Idle (not playing) is always frame 1 — frames[0].
    function currentRealFrameNumber() {
        if (!playing || !playSequenceFrozen) return 1;
        const n = DIRECTION_FRAME_COUNT, hold = Math.round(cfg.peakHoldFrames);
        const totalLen = playSequenceLength(n, hold);
        const virtualIndex = Math.min(playFrameIndex, totalLen - 1);
        if (virtualIndex < n) return virtualIndex + 1;
        if (virtualIndex < n + hold) return n;
        const shifted = virtualIndex - hold;
        return (2 * n - 1) - shifted;
    }

    // ----------------------------------------------------------------
    // Ball: falls from top-center, gravity-driven, bounces off the left/
    // right viewport edges only (never top/bottom — it's meant to exit
    // off the bottom and respawn after a delay), and reacts to the 3
    // finger segments (knuckle→joint1, joint1→joint2, joint2→tip) as
    // thick capsules. `ball` is null while waiting to respawn.
    // ----------------------------------------------------------------
    // Starts null (not spawned via an immediate call here) so the first
    // real spawn happens inside updateBallAndCollision()'s own respawn
    // path, on the first real requestAnimationFrame — same reasoning as
    // hasMouse gating entityX/Y above: window.innerWidth/innerHeight can
    // briefly read 0 at script-parse time before layout settles.
    let ball = null;
    let ballRespawnCountdown = 0;
    // Rising-edge state for the auto-trigger below (ballInFlickTriggerZone) —
    // tracked continuously (even while a flick is already playing, or no
    // ball exists) so a ball that's been sitting inside the zone the whole
    // time a flick was already playing doesn't immediately re-fire the
    // instant that flick ends; only a genuine false->true transition
    // fires. Reset to false whenever there's no ball to evaluate.
    let wasInFlickTriggerZone = false;
    function spawnBall() {
        const radiusPx = Math.min(window.innerWidth, window.innerHeight) * (cfg.ballRadius / 100);
        // hasEnteredFrame stays false for the initial fall from this
        // off-screen-above spawn point, so the top-edge collision below
        // doesn't bounce it right back out before it's ever been seen -
        // see that check's own comment.
        return { x: window.innerWidth / 2, y: -radiusPx * 2, vx: 0, vy: 0, hasEnteredFrame: false };
    }

    // Nearest point on segment AB to point P, plus t (0=A, 1=B) — needed
    // both for the push direction/overlap and for interpolating that
    // exact point's own velocity between the 2 endpoints' velocities.
    function nearestPointOnSegment(px, py, ax, ay, bx, by) {
        const abx = bx - ax, aby = by - ay;
        const lenSq = abx * abx + aby * aby;
        let t = lenSq > 0 ? ((px - ax) * abx + (py - ay) * aby) / lenSq : 0;
        t = Math.max(0, Math.min(1, t));
        return { x: ax + abx * t, y: ay + aby * t, t };
    }

    // Auto-trigger boundary for the flick sequence: true when the ball is
    // within the union of the joint-collision capsules across EVERY frame
    // (1..DIRECTION_FRAME_COUNT) of the current direction's flick
    // animation — not just whatever pose is currently on screen. Per
    // explicit correction ("the vicinity is defined by the collision
    // bodies at ANY point within the animation sequence, not just the
    // peak point"): an earlier version checked only frame
    // DIRECTION_FRAME_COUNT (the fully-extended peak) alone, which was
    // judged too narrow — a ball sitting somewhere the fingers only pass
    // through mid-swing, never reaching the fully-extended peak's own
    // position, wouldn't have triggered it.
    //
    // Reuses the exact same local->world transform and thickness math
    // updateBallAndCollision() already uses for the LIVE pose (drawW/
    // drawH from entityScale+aspect, entityX/entityY/rotationRad for the
    // rigid transform, cfg.jointThickness for capsule half-width) — this
    // is deliberately the SAME geometry the real collision already uses,
    // just evaluated once per candidate frame instead of only the one
    // currently playing, so "vicinity" means exactly "would touch the
    // hand at some point during a real flick," not an arbitrary separate
    // distance.
    function ballInFlickTriggerZone(ball, directionKey, rotationRad) {
        if (!ball) return false;
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const radiusPx = vmin * (cfg.ballRadius / 100);
        const thicknessPx = vmin * (cfg.jointThickness / 100);
        const minDist = thicknessPx / 2 + radiusPx;
        const size = vmin * (cfg.entityScale / 100);
        const refImg = ensureDirectionLoaded(directionKey).frames[0];
        const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
        const drawW = size, drawH = size * aspect;
        const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);
        const segments = [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']];

        for (let frameNumber = 1; frameNumber <= DIRECTION_FRAME_COUNT; frameNumber++) {
            const pose = interpolatedLocalPose(directionKey, frameNumber);
            if (!pose) continue;
            const world = {};
            SKELETON_POINTS.forEach(pk => {
                const p = pose[pk];
                if (!p) return;
                const lx = (p.x - 0.5) * drawW, ly = (p.y - 0.5) * drawH;
                world[pk] = { x: entityX + lx * cos - ly * sin, y: entityY + lx * sin + ly * cos };
            });
            for (const [aKey, bKey] of segments) {
                const a = world[aKey], b = world[bKey];
                if (!a || !b) continue;
                const nearest = nearestPointOnSegment(ball.x, ball.y, a.x, a.y, b.x, b.y);
                if (Math.hypot(ball.x - nearest.x, ball.y - nearest.y) < minDist) return true;
            }
        }
        return false;
    }

    // Previous frame's LOCAL (unrotated, untranslated — relative to the
    // entity's own center, before rotationRad/entityX/entityY are
    // applied) joint pixel positions, per point key. Deliberately LOCAL,
    // not world-space: an earlier version derived velocity from WORLD
    // position deltas, which also picked up the entity's own translation
    // (mouse movement) and rotation (mouse angle changing) as "joint
    // speed" — reported directly: "as i move the mouse, the collision
    // circle sometimes becomes huge... should stay the same size unless
    // i change the animation scale itself." Local-space deltas isolate
    // the flick animation's OWN motion from how fast the whole hand is
    // being swung around by the mouse — rotation/translation are rigid
    // transforms and don't change a vector's magnitude, so this local
    // speed is still valid to use directly against world-space distances
    // (thickness, collision push) with no unit conversion needed. This
    // is what still makes "thickness/intensity scale with the animation
    // frames, and with Click Anim Speed" emerge from real motion (a
    // faster-playing flick has faster real frame-to-frame LOCAL joint
    // motion) — now correctly independent of mouse movement, and
    // (per explicit request) still scales with Entity Scale, since a
    // bigger entity means a bigger real pixel distance between the same
    // normalized keyframe positions.
    //
    // prevDirectionKey/prevEntityScale, alongside prevJointLocal: still
    // occurring after the fix above (per direct report: "less frequent,
    // but when it does happen, the collision circle is even bigger than
    // before") because a DIRECTION SWITCH is itself a discontinuity, not
    // real motion — the 8 direction sets are independently-authored art,
    // not rotations of one asset, so "knuckle" in e.g. 'behind' and
    // 'front-thumb' sit at unrelated local coordinates. Comparing this
    // frame's pose against the PREVIOUS frame's pose from a DIFFERENT
    // direction (whenever the mouse crosses one of the 8 angle-sector
    // boundaries) produced a large synthetic "velocity" out of a pose
    // jump that was never real animated motion — rare (only on a sector
    // crossing) but large (comparing 2 unrelated hand poses), matching
    // the reported pattern exactly. A live Entity Scale slider drag is
    // the same class of bug (jointLocal is derived from drawW/drawH,
    // which depend on cfg.entityScale) — cheap to guard the same way.
    // Whenever either changes since the prior frame, this frame's
    // velocity is simply skipped (treated as no prior data) rather than
    // computed across the discontinuity.
    let prevJointLocal = null;
    let prevDirectionKey = null;
    let prevEntityScale = null;
    // Exponentially-smoothed per-point speed (a plain scalar, px/s) —
    // see thicknessSmoothing's own comment above COLLISION_CONTROLS for
    // why this exists (raw frame-to-frame speed steps abruptly between
    // sparse, unevenly-spaced skeleton keyframes). Only a scalar is ever
    // needed downstream (thickness, and the collision kick's magnitude —
    // its DIRECTION always comes from the ball/segment geometry, never
    // from this), so only the magnitude is smoothed, not a full vector.
    let smoothedJointSpeed = {};

    function updateBallAndCollision(dt, rotationRad) {
        const w = window.innerWidth, h = window.innerHeight;
        const vmin = Math.min(w, h);

        // Current local + world-space joint positions for
        // currentDirectionKey's interpolated local pose. World-space uses
        // the SAME rotate+translate render() uses for the sprite itself;
        // local-space (pre-rotation/translation) is what velocity is
        // derived from — see prevJointLocal's own comment above.
        const localPose = interpolatedLocalPose(currentDirectionKey, currentRealFrameNumber());
        let jointWorld = null, jointLocal = null;
        if (localPose) {
            const size = vmin * (cfg.entityScale / 100);
            const refImg = ensureDirectionLoaded(currentDirectionKey).frames[0];
            const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
            const drawW = size, drawH = size * aspect;
            const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);
            jointWorld = {};
            jointLocal = {};
            SKELETON_POINTS.forEach(pk => {
                const p = localPose[pk];
                if (!p) return;
                // Local point in the sprite's own unrotated pixel space,
                // centered on the entity origin (drawImage draws centered
                // at -drawW/2..drawW/2, same as the sprite itself).
                const lx = (p.x - 0.5) * drawW, ly = (p.y - 0.5) * drawH;
                jointLocal[pk] = { x: lx, y: ly };
                jointWorld[pk] = {
                    x: entityX + lx * cos - ly * sin,
                    y: entityY + lx * sin + ly * cos,
                };
            });
        }
        // A direction switch or a live Entity Scale change is a
        // discontinuity, not real motion — skip velocity for this one
        // frame rather than comparing across it (see this function's own
        // leading comment for why).
        const continuous = currentDirectionKey === prevDirectionKey && cfg.entityScale === prevEntityScale;
        const jointVel = {};
        if (jointLocal && prevJointLocal && continuous && dt > 0) {
            SKELETON_POINTS.forEach(pk => {
                if (!jointLocal[pk] || !prevJointLocal[pk]) return;
                jointVel[pk] = { x: (jointLocal[pk].x - prevJointLocal[pk].x) / dt, y: (jointLocal[pk].y - prevJointLocal[pk].y) / dt };
            });
        }
        prevJointLocal = jointLocal;
        prevDirectionKey = currentDirectionKey;
        prevEntityScale = cfg.entityScale;

        // Smooth the raw per-point speed over time — snaps instantly
        // (factor=1, no blending) on a discontinuity (!continuous) so a
        // direction switch's already-correct "0 speed" doesn't get
        // smeared forward from whatever the smoothed value happened to
        // be a moment ago.
        const smoothFactor = continuous ? expSmoothFactor(cfg.thicknessSmoothing, dt) : 1;
        const jointSpeed = {};
        SKELETON_POINTS.forEach(pk => {
            const raw = jointVel[pk] ? Math.hypot(jointVel[pk].x, jointVel[pk].y) : 0;
            const prevSpeed = smoothedJointSpeed[pk] ?? raw;
            const next = prevSpeed + (raw - prevSpeed) * smoothFactor;
            smoothedJointSpeed[pk] = next;
            jointSpeed[pk] = next;
        });

        // Respawn cycle
        if (!ball) {
            ballRespawnCountdown -= dt;
            if (ballRespawnCountdown <= 0) ball = spawnBall();
        }

        if (ball) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ball.vy += vmin * (cfg.ballGravity / 100) * dt; // %vh/s² of the viewport's own min dimension, matching this project's other %vmin-based sizes
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            // Left/right walls — always. Bottom — never (that's the exit/
            // respawn edge, handled below). Top — collides too, EXCEPT
            // during the ball's initial fall from its off-screen-above
            // spawn point (spawnBall() starts it at y = -radiusPx*2, well
            // above the top edge, specifically so it visibly falls INTO
            // frame) — bouncing off the top edge during that entry would
            // just reflect it straight back out before it's ever seen.
            // hasEnteredFrame latches true the first frame the ball's own
            // top edge reaches y=0 (i.e. it's now at least partially
            // visible) and never resets, so every later moment — a strong
            // joint-collision kick launching it back up past the top,
            // for instance — does bounce normally.
            if (ball.y - radiusPx >= 0) ball.hasEnteredFrame = true;

            if (ball.x < radiusPx) { ball.x = radiusPx; ball.vx = -ball.vx * cfg.ballBounciness; }
            else if (ball.x > w - radiusPx) { ball.x = w - radiusPx; ball.vx = -ball.vx * cfg.ballBounciness; }
            if (ball.hasEnteredFrame && ball.y < radiusPx) { ball.y = radiusPx; ball.vy = -ball.vy * cfg.ballBounciness; }

            // Joint-segment collision — 3 capsules (knuckle→joint1,
            // joint1→joint2, joint2→tip), resolved sequentially (adequate
            // for a single ball against 3 segments, not a rigorous
            // simultaneous solve).
            if (jointWorld) {
                const segments = [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']];
                segments.forEach(([aKey, bKey]) => {
                    const a = jointWorld[aKey], b = jointWorld[bKey];
                    if (!a || !b) return;
                    const nearest = nearestPointOnSegment(ball.x, ball.y, a.x, a.y, b.x, b.y);
                    const speedA = jointSpeed[aKey] ?? 0, speedB = jointSpeed[bKey] ?? 0;
                    const speed = speedA + (speedB - speedA) * nearest.t; // still drives the collision KICK below, no longer the circle's size
                    const thicknessPx = vmin * (cfg.jointThickness / 100); // fixed — never varies by frame/speed, per explicit instruction

                    const dx = ball.x - nearest.x, dy = ball.y - nearest.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = thicknessPx / 2 + radiusPx;
                    if (dist < minDist) {
                        const nx = dist > 0.0001 ? dx / dist : 0, ny = dist > 0.0001 ? dy / dist : -1;
                        const overlap = minDist - dist;
                        ball.x += nx * overlap;
                        ball.y += ny * overlap;
                        ball.vx += nx * speed * cfg.collisionIntensity;
                        ball.vy += ny * speed * cfg.collisionIntensity;
                    }
                });
            }

            // Auto-trigger: the ball crossing INTO the flick's own
            // reachable zone (see ballInFlickTriggerZone's own comment)
            // starts the sequence exactly as a real click would, without
            // requiring one. Rising-edge only (wasInFlickTriggerZone) —
            // a ball that's simply sitting in the zone doesn't keep
            // re-triggering every frame, and !playing keeps a ball that
            // entered the zone mid-flick from double-triggering the
            // instant that flick ends while it's still sitting there.
            const inTriggerZone = ballInFlickTriggerZone(ball, currentDirectionKey, rotationRad);
            if (inTriggerZone && !wasInFlickTriggerZone && !playing) triggerFlick();
            wasInFlickTriggerZone = inTriggerZone;

            // Fully below the bottom edge — gone, start the respawn timer.
            if (ball.y - radiusPx > h) {
                ball = null;
                ballRespawnCountdown = cfg.ballRespawnRate;
            }
        } else {
            wasInFlickTriggerZone = false;
        }

        return { jointWorld, jointSpeed };
    }

    // ----------------------------------------------------------------
    // Canvas + mouse tracking
    // ----------------------------------------------------------------
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function applyCursorVisibility() {
        canvas.classList.toggle('cursor-hidden', cfg.hideCursor);
    }
    applyCursorVisibility();

    // Not window.innerWidth/innerHeight read here directly - a real,
    // documented quirk (DickoClicko hit the same thing) is that the
    // viewport can briefly report 0 at script-parse time, before layout
    // settles; a one-time snapshot taken then would permanently strand
    // the entity at the top-left corner. hasMouse gates a live re-center
    // in update()'s first real frame instead (requestAnimationFrame is
    // guaranteed to run after layout).
    let mouseX = 0, mouseY = 0;
    let hasMouse = false;
    window.addEventListener('pointermove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        hasMouse = true;
    });

    // ----------------------------------------------------------------
    // Angle math. "Up" (0°) = directly above the browser's centerpoint;
    // angle increases CLOCKWISE. Verified against 2 concrete cases before
    // trusting it: mouse directly above center -> 0° (bucket "Behind");
    // mouse directly right of center -> 90° (bucket "Side Thumb"), and
    // the entity's own rotation (mouseAngle + 180°) correctly points it
    // back toward center in both cases (rotated "up" vector = (sinθ,
    // -cosθ) in canvas x/y-down space).
    // ----------------------------------------------------------------
    function mouseAngleFromCenter(mx, my, cx, cy) {
        const dx = mx - cx, dy = my - cy;
        let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
        return (deg + 360) % 360;
    }
    // 8 sectors of 45°, centered on 0/45/90/.../315 — matches the exact
    // boundaries given (-22.5..22.5 = index 0, etc). cfg.angleOffset
    // rotates the whole wheel as one calibration knob rather than 8
    // independent (and easily inconsistent) per-boundary sliders, since
    // the sectors are rigidly uniform by spec.
    function directionIndexForAngle(angleDeg) {
        const shifted = (angleDeg + cfg.angleOffset + 22.5 + 3600) % 360;
        return Math.floor(shifted / 45) % 8;
    }

    // ----------------------------------------------------------------
    // State: entity position/rotation (smoothed toward the mouse/target
    // angle), current direction bucket, and the click-triggered
    // forward+reverse play sequence.
    // ----------------------------------------------------------------
    let entityX = 0, entityY = 0;
    let entityAngleDeg = 0;
    let currentDirectionKey = DIRECTIONS[0].key;
    let playing = false;
    let playFrameIndex = 0;
    let playFrameAccum = 0;
    let playSequenceFrozen = null;
    const FLICK_BASE_FPS = 12;

    function angleLerp(current, target, factor) {
        let delta = ((target - current + 540) % 360) - 180;
        return current + delta * factor;
    }
    function expSmoothFactor(smoothing, dt) {
        // smoothing=1 -> factor=1 (instant, matches "wherever mouse goes,
        // entity goes" literally by default); lower values ease in.
        if (smoothing >= 1) return 1;
        return 1 - Math.pow(1 - smoothing, dt * 60);
    }

    // Shared by a real click AND the ball-proximity auto-trigger
    // (ballInFlickTriggerZone, checked inside updateBallAndCollision) —
    // both just start the same forward+reverse play sequence for
    // whichever direction is currently active.
    function triggerFlick() {
        playing = true;
        playFrameIndex = 0;
        playFrameAccum = 0;
        playSequenceFrozen = ensureDirectionLoaded(currentDirectionKey).playSequence;
    }
    canvas.addEventListener('pointerdown', () => {
        if (playing) return;
        triggerFlick();
    });

    // Fixed-timestep physics — step() always advances by exactly FIXED_DT
    // (1/60s), never the raw/jittery per-real-frame delta. Previously
    // every physics quantity here (gravity integration, position,
    // playback frame advancement, and — critically — the hand's own
    // joint velocity that sizes the ball-collision kick) was driven
    // directly by real elapsed time, which is never bit-for-bit identical
    // between 2 separate runs even with 100% identical inputs (a static
    // mouse position included) — confirmed as the actual explanation for
    // a direct report ("if i leave my mouse in one location... how come
    // the outcome of the ball's trajectory isnt identical everytime")
    // before this fix: real requestAnimationFrame timing jitters run to
    // run, and this sim's collision response is sensitive enough to that
    // jitter for it to compound into a visibly different trajectory.
    // update() (below) still runs once per real animation frame, an
    // accumulator pattern lets it run step() 0, 1, or several times to
    // catch up to real elapsed time — this is what makes 2 runs with the
    // same inputs now produce numerically identical motion after the
    // same NUMBER of steps, regardless of real frame-timing noise.
    const FIXED_DT = 1 / 60;
    const MAX_FRAME_DT = 0.25; // caps the catch-up burst after e.g. a backgrounded tab
    let accumulator = 0;
    let lastTime = performance.now();
    let lastStepResult = null;

    function step(dt) {
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        if (!hasMouse) { mouseX = cx; mouseY = cy; entityX = cx; entityY = cy; }

        const posFactor = expSmoothFactor(cfg.positionSmoothing, dt);
        entityX += (mouseX - entityX) * posFactor;
        entityY += (mouseY - entityY) * posFactor;

        const targetAngle = mouseAngleFromCenter(mouseX, mouseY, cx, cy);
        const rotFactor = expSmoothFactor(cfg.rotationSmoothing, dt);
        entityAngleDeg = angleLerp(entityAngleDeg, targetAngle, rotFactor);

        const dirIndex = directionIndexForAngle(targetAngle);
        currentDirectionKey = DIRECTIONS[dirIndex].key;
        if (!playing) ensureDirectionLoaded(currentDirectionKey);

        if (playing && playSequenceFrozen) {
            playFrameAccum += dt * FLICK_BASE_FPS * cfg.clickAnimSpeed;
            playFrameIndex = Math.floor(playFrameAccum);
            const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, Math.round(cfg.peakHoldFrames));
            if (playFrameIndex >= totalLen) {
                playing = false;
                playSequenceFrozen = null;
                playFrameIndex = 0;
                playFrameAccum = 0;
            }
        }

        const rotationRad = (entityAngleDeg + 180 + (cfg.entityRotationOffsetByDirection[currentDirectionKey] || 0)) * Math.PI / 180;
        const { jointWorld, jointSpeed } = updateBallAndCollision(dt, rotationRad);

        return { targetAngle, dirIndex, rotationRad, jointWorld, jointSpeed };
    }

    function update(now) {
        // Self-healing canvas size check. resizeCanvas() only otherwise
        // runs once at boot plus on a real 'resize' event — if
        // window.innerWidth/innerHeight read 0 at that first boot call (a
        // real, reproduced-in-this-session early-page-life quirk, same
        // class already documented in this workspace for mobile Safari/
        // Chrome, and the same root cause already fixed for mouseX/
        // entityX above), the canvas permanently sticks at 0×0 unless the
        // user happens to resize their window afterward — which, on a
        // static desktop session, most users never do. A 0×0 canvas isn't
        // just a rendering bug: `#scene.cursor-hidden{cursor:none}` (Hide
        // OS Cursor) has nothing left to apply that rule TO, since the
        // element covers zero real screen area — this is the likely root
        // cause of "hide OS cursor doesn't work" reports. Checked every
        // frame (cheap: 2 comparisons) rather than only once, so it also
        // self-heals from a real live window resize, not just the boot-
        // time case. Display sizing, not simulation — deliberately stays
        // outside the fixed-step loop below.
        const dpr = window.devicePixelRatio || 1;
        if (canvas.width !== Math.round(window.innerWidth * dpr) || canvas.height !== Math.round(window.innerHeight * dpr)) {
            resizeCanvas();
        }

        const frameDt = Math.min(MAX_FRAME_DT, (now - lastTime) / 1000);
        lastTime = now;
        accumulator += frameDt;
        while (accumulator >= FIXED_DT) {
            lastStepResult = step(FIXED_DT);
            accumulator -= FIXED_DT;
        }

        // render() still runs once per real frame (not once per fixed
        // step) — on a high-refresh-rate display a given callback may run
        // 0 steps (accumulator hasn't reached FIXED_DT yet), so this
        // renders whatever the most recent step produced rather than
        // nothing. lastStepResult is only null before the very first
        // step has ever run.
        if (lastStepResult) {
            render(lastStepResult.targetAngle, lastStepResult.dirIndex, lastStepResult.rotationRad, lastStepResult.jointWorld, lastStepResult.jointSpeed);
        }
        requestAnimationFrame(update);
    }

    function render(targetAngle, dirIndex, rotationRad, jointWorld, jointSpeed) {
        const w = window.innerWidth, h = window.innerHeight;
        ctx.fillStyle = cfg.backgroundColor;
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        if (cfg.showCenter) {
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
            ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
            ctx.stroke();
            ctx.restore();
        }

        let img;
        if (playing && playSequenceFrozen) {
            const hold = Math.round(cfg.peakHoldFrames);
            const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, hold);
            const virtualIndex = Math.min(playFrameIndex, totalLen - 1);
            img = playSequenceFrozen[resolvePlaySequenceIndex(virtualIndex, DIRECTION_FRAME_COUNT, hold)];
        } else {
            img = ensureDirectionLoaded(currentDirectionKey).frames[0];
        }

        const vmin = Math.min(w, h);
        const size = vmin * (cfg.entityScale / 100);
        let drawW = size, drawH = size;
        if (img && img.complete && img.naturalWidth > 0) {
            drawH = size * (img.naturalHeight / img.naturalWidth);
        }

        ctx.save();
        ctx.translate(entityX, entityY);
        ctx.rotate(rotationRad);
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
        }
        if (cfg.showHitbox) {
            ctx.strokeStyle = '#ff3366';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-drawW / 2, -drawH / 2, drawW, drawH);
        }
        ctx.restore();

        // Joint collision debug lines — drawn at the FIXED collision
        // thickness (Joint Collision Thickness alone — no longer speed-
        // derived, per explicit instruction: "collision circles will
        // never rescale during the animation sequence unless otherwise
        // told so by me"), matching updateBallAndCollision()'s own
        // per-segment thicknessPx exactly, so the boundary the ball
        // actually reacts to is directly visible at all times.
        if (cfg.showJointCollisionLines && jointWorld) {
            ctx.save();
            ctx.strokeStyle = '#ffcf5c';
            ctx.globalAlpha = 0.55;
            ctx.lineCap = 'round';
            ctx.lineWidth = vmin * (cfg.jointThickness / 100);
            [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']].forEach(([aKey, bKey]) => {
                const a = jointWorld[aKey], b = jointWorld[bKey];
                if (!a || !b) return;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
            });
            ctx.restore();
        }

        // Ball
        if (ball) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ctx.save();
            ctx.fillStyle = cfg.ballColor;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, radiusPx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (cfg.showAngleDebug) {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px monospace';
            ctx.textBaseline = 'top';
            ctx.fillText(`angle: ${targetAngle.toFixed(1)}°  direction[${dirIndex}]: ${currentDirectionKey}${playing ? '  (playing)' : ''}`, 12, 12);
            ctx.restore();
        }
    }

    requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(update); });

    initDevPanelEngine();

    // One-time-per-load migration: this panel's Entity group was briefly
    // named "Hand Animation", and a separate "Mouse / Rotation" group
    // existed, before both were consolidated back into "Entity" per
    // explicit request. Anyone whose browser already saved settings
    // during that window has a sectionOrder referencing those 2 names —
    // applySectionOrder() (the generic engine, unchanged) correctly, BY
    // DESIGN, recreates any saved group it doesn't recognize as a
    // .dev-section already in the static HTML (that's what lets a real
    // user-created "+ Add Group" group survive a reload) — it has no way
    // to tell those 2 renamed-away names apart from a genuine custom
    // group, so they silently come back as empty-looking ghost groups
    // every load. Prune them here instead: move whatever rows they still
    // claim into Entity (their current code home) rather than deleting
    // them, then remove the now-empty stale section. Runs after
    // initDevPanelEngine() so it can clean up whatever that just
    // restored from localStorage; cheap and idempotent, so it's fine to
    // run on every load rather than gating it behind a one-time flag —
    // once a real Save happens post-migration, the live DOM (already
    // clean) is what gets captured, so the stale names stop reappearing
    // in localStorage too.
    (function pruneStaleDevPanelGroups() {
        const STALE_GROUP_NAMES = ['Hand Animation', 'Mouse / Rotation'];
        const entityContent = findGroupContent('desktop', 'Entity', 'pruneStaleDevPanelGroups', 'migration');
        document.querySelectorAll('#desktopTabContent > .dev-section > .dev-section-title').forEach(titleEl => {
            if (!STALE_GROUP_NAMES.includes(titleEl.dataset.sid)) return;
            const section = titleEl.parentElement;
            const content = section.querySelector(':scope > .dev-section-content');
            if (entityContent && content) {
                Array.from(content.children).forEach(row => entityContent.appendChild(row));
            }
            section.remove();
        });
    })();
</script>
</body>
</html>
