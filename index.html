    //
    // TO REGENERATE (e.g. after replacing a direction's frame 1 art):
    //   node -e "const sharp=require('sharp'); (async()=>{const img=sharp('data/FLICK/2TONED/<FOLDER>/A/<prefix>_001.png'); const {data,info}=await img.raw().ensureAlpha().toBuffer({resolveWithObject:true}); const w=info.width,h=info.height,c=info.channels; let minX=w,maxX=-1,minY=h,maxY=-1; for(let y=0;y<h;y++){for(let x=0;x<w;x++){const a=data[(y*w+x)*c+(c-1)]; if(a>10){if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}}} console.log({centerX:+(((minX+maxX)/2)/w).toFixed(4), bottomY:+(((maxY+1)/h)).toFixed(4)});})()"
    const VISIBLE_BOUNDS_BY_DIRECTION = {
        'behind':       { centerX: 0.5265, bottomY: 0.8916 },
        'behind-thumb': { centerX: 0.5029, bottomY: 0.9009 },
        'side-thumb':   { centerX: 0.4788, bottomY: 0.8815 },
        'front-thumb':  { centerX: 0.4738, bottomY: 0.9009 },
        'front':        { centerX: 0.4763, bottomY: 0.9145 },
        'front-pinky':  { centerX: 0.4942, bottomY: 0.9221 },
        'side-pinky':   { centerX: 0.5194, bottomY: 0.9272 },
        'behind-pinky': { centerX: 0.521,  bottomY: 0.917  },
    };
    // Thin, synchronous lookup — the 0.5/1 fallback only matters for a
    // direction key that isn't in the table above (e.g. a newly-added
    // direction whose bounds haven't been regenerated yet).
    function visibleBoundsForDirection(directionKey) {
        return VISIBLE_BOUNDS_BY_DIRECTION[directionKey] || { centerX: 0.5, bottomY: 1 };
    }

    function ballInFlickTriggerZone(ball, directionKey, rotationRad, ex, ey) {
        if (!ball) return false;
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const radiusPx = vmin * (cfg.ballRadius / 100);
        const thicknessPx = vmin * (cfg.jointThickness / 100);
        const minDist = thicknessPx / 2 + radiusPx;
        const size = vmin * (cfg.entityScale / 100);
        const refImg = ensureDirectionLoaded(directionKey).frames[0];
        const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
        const drawW = size, drawH = size * aspect;
        const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);
        const vb = visibleBoundsForDirection(directionKey);
        const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[directionKey] || 0) / 100);
        const segments = [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']];

        for (let frameNumber = 1; frameNumber <= DIRECTION_FRAME_COUNT; frameNumber++) {
            const pose = interpolatedLocalPose(directionKey, frameNumber);
            if (!pose) continue;
            const world = {};
            SKELETON_POINTS.forEach(pk => {
                const p = pose[pk];
                if (!p) return;
                const { x: lx, y: ly } = localOffsetFromNormalized(p.x, p.y, drawW, drawH, vb.centerX, vb.bottomY, xOffsetPx);
                world[pk] = { x: ex + lx * cos - ly * sin, y: ey + lx * sin + ly * cos };
            });
            for (const [aKey, bKey] of segments) {
                const a = world[aKey], b = world[bKey];
                if (!a || !b) continue;
                const nearest = nearestPointOnSegment(ball.x, ball.y, a.x, a.y, b.x, b.y);
                if (Math.hypot(ball.x - nearest.x, ball.y - nearest.y) < minDist) return true;
            }
        }
        return false;
    }

    // Previous frame's LOCAL (unrotated, untranslated — relative to each
    // entity's own center, before its own fixed rotationRad/x/y are
    // applied) joint pixel positions, per point key — now stored ON each
    // entity object (entity.prevJointLocal/entity.smoothedJointSpeed)
    // rather than one shared global, since every spawned entity needs its
    // own independent velocity history. Deliberately LOCAL, not
    // world-space: an earlier version (from before the spawn-placement
    // rework, when there was only ever 1 entity and it followed the
    // mouse) derived velocity from WORLD position deltas, which also
    // picked up the entity's own translation/rotation as "joint speed" —
    // reported directly: "as i move the mouse, the collision circle
    // sometimes becomes huge... should stay the same size unless i change
    // the animation scale itself." Local-space deltas isolate the flick
    // animation's OWN motion from any rigid transform, so this local
    // speed is still valid to use directly against world-space distances
    // (thickness, collision push) with no unit conversion needed — this
    // is what makes "thickness/intensity scale with the animation frames,
    // and with Click Anim Speed" emerge from real motion.
    //
    // A live Entity Scale slider change is still a real, GLOBAL
    // discontinuity (jointLocal is derived from drawW/drawH, which depend
    // on cfg.entityScale) shared by every entity at once — tracked with 1
    // module-level prevEntityScale (not per-entity, since cfg.entityScale
    // itself is one shared/global setting) and applied uniformly below.
    // A spawned entity's own direction can no longer change after it's
    // placed (a real difference from the old mouse-follow single entity,
    // which used to also guard against a direction-SWITCH discontinuity —
    // now moot, since prevJointLocal starting null on a fresh entity
    // already skips velocity for that entity's own first real frame,
    // which is the only discontinuity a fixed-direction entity can have).
    let prevEntityScale = null;

    function updateBallAndCollision(dt) {
        const w = window.innerWidth, h = window.innerHeight;
        const vmin = Math.min(w, h);

        const scaleChanged = cfg.entityScale !== prevEntityScale;
        prevEntityScale = cfg.entityScale;

        // Per-entity local+world joint positions and smoothed speed —
        // computed once per entity per tick, then stashed on the entity
        // itself (entity.jointWorld/entity.jointSpeed) for render()'s own
        // debug-line drawing and for the collision/trigger pass below to
        // read back without recomputing.
        entities.forEach(entity => {
            const localPose = interpolatedLocalPose(entity.directionKey, entityRealFrameNumber(entity));
            let jointWorld = null, jointLocal = null;
            if (localPose) {
                const size = vmin * (cfg.entityScale / 100);
                const refImg = ensureDirectionLoaded(entity.directionKey).frames[0];
                const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
                const drawW = size, drawH = size * aspect;
                const rotationRad = entityRotationRad(entity);
                const cos = Math.cos(rotationRad), sin = Math.sin(rotationRad);
                const vb = visibleBoundsForDirection(entity.directionKey);
                const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
                jointWorld = {};
                jointLocal = {};
                SKELETON_POINTS.forEach(pk => {
                    const p = localPose[pk];
                    if (!p) return;
                    // Local point in the sprite's own unrotated pixel space,
                    // anchored at the entity's own visible-content-based
                    // origin — see localOffsetFromNormalized()'s own comment.
                    const { x: lx, y: ly } = localOffsetFromNormalized(p.x, p.y, drawW, drawH, vb.centerX, vb.bottomY, xOffsetPx);
                    jointLocal[pk] = { x: lx, y: ly };
                    jointWorld[pk] = {
                        x: entity.x + lx * cos - ly * sin,
                        y: entity.y + lx * sin + ly * cos,
                    };
                });
            }
            const continuous = !scaleChanged;
            const jointVel = {};
            if (jointLocal && entity.prevJointLocal && continuous && dt > 0) {
                SKELETON_POINTS.forEach(pk => {
                    if (!jointLocal[pk] || !entity.prevJointLocal[pk]) return;
                    jointVel[pk] = { x: (jointLocal[pk].x - entity.prevJointLocal[pk].x) / dt, y: (jointLocal[pk].y - entity.prevJointLocal[pk].y) / dt };
                });
            }
            entity.prevJointLocal = jointLocal;

            // Smooth the raw per-point speed over time — snaps instantly
            // (factor=1, no blending) on a discontinuity (!continuous) so
            // an already-correct "0 speed" doesn't get smeared forward
            // from whatever the smoothed value happened to be a moment
            // ago.
            const smoothFactor = continuous ? expSmoothFactor(cfg.thicknessSmoothing, dt) : 1;
            const jointSpeed = {};
            SKELETON_POINTS.forEach(pk => {
                const raw = jointVel[pk] ? Math.hypot(jointVel[pk].x, jointVel[pk].y) : 0;
                const prevSpeed = entity.smoothedJointSpeed[pk] ?? raw;
                const next = prevSpeed + (raw - prevSpeed) * smoothFactor;
                entity.smoothedJointSpeed[pk] = next;
                jointSpeed[pk] = next;
            });

            entity.jointWorld = jointWorld;
            entity.jointSpeed = jointSpeed;
        });

        // Respawn cycle — gated by `running` (Start/Stop). Stop's own
        // handler (setRunning, below) already clears any ball that was on
        // screen the moment it's pressed; this just stops a NEW one from
        // spawning while stopped.
        if (running && !ball) {
            ballRespawnCountdown -= dt;
            if (ballRespawnCountdown <= 0) ball = spawnBall();
        }

        if (ball) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            // Captured BEFORE this tick's own integration below — the
            // start point of the ball's swept path for the finger-capsule
            // collision test further down (prevBallX/Y -> ball.x/y after
            // integration is exactly "where the ball moved TO this tick,
            // from where it started").
            const prevBallX = ball.x, prevBallY = ball.y;
            ball.vy += vmin * (cfg.ballGravity / 100) * dt; // %vh/s² of the viewport's own min dimension, matching this project's other %vmin-based sizes
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            // Left/right walls — always. Bottom — never (that's the exit/
            // respawn edge, handled below). Top — collides too, EXCEPT
            // during the ball's initial fall from its off-screen-above
            // spawn point (spawnBall() starts it at y = -radiusPx*2, well
            // above the top edge, specifically so it visibly falls INTO
            // frame) — bouncing off the top edge during that entry would
            // just reflect it straight back out before it's ever seen.
            // hasEnteredFrame latches true the first frame the ball's own
            // top edge reaches y=0 (i.e. it's now at least partially
            // visible) and never resets, so every later moment — a strong
            // joint-collision kick launching it back up past the top,
            // for instance — does bounce normally.
            if (ball.y - radiusPx >= 0) ball.hasEnteredFrame = true;

            if (ball.x < radiusPx) { ball.x = radiusPx; ball.vx = -ball.vx * cfg.ballBounciness; }
            else if (ball.x > w - radiusPx) { ball.x = w - radiusPx; ball.vx = -ball.vx * cfg.ballBounciness; }
            if (ball.hasEnteredFrame && ball.y < radiusPx) { ball.y = radiusPx; ball.vy = -ball.vy * cfg.ballBounciness; }

            // Joint-segment collision (3 capsules per entity) + the
            // proximity auto-trigger, once per spawned entity — a ball
            // sitting near several entities at once reacts to/can trigger
            // all of them independently, same rules as a single entity did.
            //
            // SWEPT: tests the ball's whole PATH this tick (prevBallX,Y ->
            // ball.x,y) against each finger capsule, via closestPointsBetweenSegments,
            // not just its single end-of-tick point — a fast ball can
            // otherwise jump clean over a thin capsule between 2 ticks and
            // never register as "inside" at either sampled instant
            // (tunneling), reported directly ("if the ball is moving at a
            // high velocity, even if it triggers the animation, the
            // animation is not fast enough to flick the ball"). Each
            // resolved hit updates ball.x/y in place, so a later segment's
            // own sweep this same tick starts from prevBallX/Y (unchanged)
            // through the ball's now-updated position — same "resolved
            // sequentially, not a rigorous simultaneous solve" scope this
            // collision system already had before this change.
            entities.forEach(entity => {
                if (entity.jointWorld) {
                    const segments = [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']];
                    segments.forEach(([aKey, bKey]) => {
                        const a = entity.jointWorld[aKey], b = entity.jointWorld[bKey];
                        if (!a || !b) return;
                        const thicknessPx = vmin * (cfg.jointThickness / 100); // fixed — never varies by frame/speed, per explicit instruction
                        const minDist = thicknessPx / 2 + radiusPx;
                        const cp = closestPointsBetweenSegments(prevBallX, prevBallY, ball.x, ball.y, a.x, a.y, b.x, b.y);
                        if (cp.distSq >= minDist * minDist) return;

                        const speedA = entity.jointSpeed[aKey] ?? 0, speedB = entity.jointSpeed[bKey] ?? 0;
                        const speed = speedA + (speedB - speedA) * cp.t; // still drives the collision KICK below, no longer the circle's size
                        const dist = Math.sqrt(cp.distSq);
                        const dx = cp.c1x - cp.c2x, dy = cp.c1y - cp.c2y;
                        const nx = dist > 0.0001 ? dx / dist : 0, ny = dist > 0.0001 ? dy / dist : -1;
                        const overlap = minDist - dist;
                        // Snap to the point ALONG THE BALL'S OWN PATH where
                        // it first came within minDist (cp.c1x/y, at
                        // parameter cp.s) rather than its raw end-of-tick
                        // position — this is what actually stops tunneling:
                        // even when the ball's final position had already
                        // passed clean through the capsule, cp.c1 is never
                        // further through than the real first contact.
                        ball.x = cp.c1x + nx * overlap;
                        ball.y = cp.c1y + ny * overlap;
                        ball.vx += nx * speed * cfg.collisionIntensity;
                        ball.vy += ny * speed * cfg.collisionIntensity;
                    });
                }

                // Auto-trigger: the ball crossing INTO this entity's own
                // reachable zone (see ballInFlickTriggerZone's own
                // comment) starts ITS sequence, without requiring a
                // click — manual click-to-flick was retired entirely once
                // clicking became the spawn-placement gesture (see the
                // canvas pointerdown handler below). Rising-edge only
                // (entity.wasInFlickTriggerZone) — a ball simply sitting
                // in the zone doesn't keep re-triggering every frame, and
                // !entity.playing keeps a ball that entered the zone
                // mid-flick from double-triggering the instant that flick
                // ends while it's still sitting there.
                const inTriggerZone = ballInFlickTriggerZone(ball, entity.directionKey, entityRotationRad(entity), entity.x, entity.y);
                if (inTriggerZone && !entity.wasInFlickTriggerZone && !entity.playing) triggerFlick(entity);
                entity.wasInFlickTriggerZone = inTriggerZone;
            });

            // Fully below the bottom edge — gone, start the respawn timer.
            if (ball.y - radiusPx > h) {
                ball = null;
                ballRespawnCountdown = cfg.ballRespawnRate;
            }
        } else {
            entities.forEach(entity => { entity.wasInFlickTriggerZone = false; });
        }
    }

    // ----------------------------------------------------------------
    // Canvas + mouse tracking
    // ----------------------------------------------------------------
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function applyCursorVisibility() {
        canvas.classList.toggle('cursor-hidden', cfg.hideCursor);
    }
    applyCursorVisibility();

    // mouseX/mouseY only ever come from a real pointermove event now (no
    // longer re-derived from window.innerWidth/innerHeight as a fallback —
    // there's no continuously-following entity left to re-center). hasMouse
    // just gates render()'s own live spawn-preview line, so it doesn't draw
    // toward a stale (0,0) before the very first real mouse movement.
    let mouseX = 0, mouseY = 0;
    let hasMouse = false;
    // Base/end-point drag state (Stop-mode entity adjustment, below) — the
    // entity currently being dragged and which of its 2 points ('base' |
    // 'end'), or null when nothing's being dragged. Lives here (not with
    // pendingSpawnStart, further down) specifically so the pointermove
    // handler right below — the only place drag position updates actually
    // happen — can read it directly.
    let draggingEntity = null;
    let draggingPoint = null;
    window.addEventListener('pointermove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        hasMouse = true;
        if (draggingEntity) {
            if (draggingPoint === 'base') {
                // Translate the whole entity — both points move together,
                // so the line's own angle (and therefore rotation/
                // direction) stays exactly what it was. This is the "move"
                // half of "move and rotate and adjust."
                const dx = mouseX - draggingEntity.x, dy = mouseY - draggingEntity.y;
                draggingEntity.x = mouseX;
                draggingEntity.y = mouseY;
                draggingEntity.endX += dx;
                draggingEntity.endY += dy;
            } else {
                // Base point stays fixed; only the aim/end point moves —
                // the "rotate" half. Only directionKey needs updating here
                // (via the same bucketing spawnEntityFromLine() uses) —
                // rotation itself is no longer stored, it's recomputed
                // live from endX/endY every time it's needed (see
                // entityRotationRad()), so there's nothing else to set.
                draggingEntity.endX = mouseX;
                draggingEntity.endY = mouseY;
                const dist = Math.hypot(draggingEntity.endX - draggingEntity.x, draggingEntity.endY - draggingEntity.y);
                if (dist > 0.0001) {
                    const lineAngle = mouseAngleFromCenter(draggingEntity.endX, draggingEntity.endY, draggingEntity.x, draggingEntity.y);
                    const dirIndex = directionIndexForAngle(lineAngle);
                    const directionKey = DIRECTIONS[dirIndex].key;
                    if (directionKey !== draggingEntity.directionKey) {
                        draggingEntity.directionKey = directionKey;
                        ensureDirectionLoaded(directionKey);
                    }
                }
            }
        }
    });
    window.addEventListener('pointerup', () => {
        draggingEntity = null;
        draggingPoint = null;
    });

    // ----------------------------------------------------------------
    // Angle math. "Up" (0°) = directly above a given pivot point; angle
    // increases CLOCKWISE. Originally verified (back when there was a
    // single mouse-anchored entity) against 2 concrete cases: mouse
    // directly above the viewport center -> 0° (bucket "Behind"); mouse
    // directly right of center -> 90° (bucket "Side Thumb"). Reused as-is
    // for the spawn-placement line's own angle below — mouseAngleFromCenter(end,
    // start) gives exactly "the angle of `end` as seen from `start`",
    // which is exactly a spawned entity's own aim direction, no change to
    // the function itself needed.
    // ----------------------------------------------------------------
    function mouseAngleFromCenter(mx, my, cx, cy) {
        const dx = mx - cx, dy = my - cy;
        let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
        return (deg + 360) % 360;
    }
    // 8 sectors of 45°, centered on 0/45/90/.../315 — matches the exact
    // boundaries given (-22.5..22.5 = index 0, etc). cfg.angleOffset
    // rotates the whole wheel as one calibration knob rather than 8
    // independent (and easily inconsistent) per-boundary sliders, since
    // the sectors are rigidly uniform by spec.
    function directionIndexForAngle(angleDeg) {
        const shifted = (angleDeg + cfg.angleOffset + 22.5 + 3600) % 360;
        return Math.floor(shifted / 45) % 8;
    }

    // angleLerp/expSmoothFactor are still used elsewhere (expSmoothFactor
    // by the collision-speed smoothing in updateBallAndCollision), but
    // angleLerp itself is currently UNUSED — it only ever eased a single
    // entity's rotation toward a continuously-moving mouse target, which
    // no longer exists now that entities are spawned once and never move.
    // Left defined (harmless, cheap) rather than deleted, in case a future
    // spawn-in ease transition wants it — flagged here rather than removed
    // silently.
    function angleLerp(current, target, factor) {
        let delta = ((target - current + 540) % 360) - 180;
        return current + delta * factor;
    }
    function expSmoothFactor(smoothing, dt) {
        if (smoothing >= 1) return 1;
        return 1 - Math.pow(1 - smoothing, dt * 60);
    }

    // ----------------------------------------------------------------
    // Entities: no longer a single mouse-anchored entity — the animation
    // is invisible until placed. Each entity is spawned via a 2-click
    // gesture (see the pointerdown handler below) and then permanently
    // fixed: its position, rotation, and direction bucket never change
    // again, only its own play state (idle vs. playing a flick, driven
    // solely by the ball-proximity trigger — manual click-to-flick was
    // retired once clicking became the spawn gesture, per explicit
    // request). cfg.entityScale/clickAnimSpeed/peakHoldFrames and the
    // per-direction rotation-offset map all stay GLOBAL, shared by every
    // entity — only position/rotation/direction/play-state are per-entity.
    // ----------------------------------------------------------------
    let entities = [];
    const FLICK_BASE_FPS = 12;

    // The first click of a pending 2-click placement — {x,y} while
    // awaiting the second click, null otherwise. Purely UI/interaction
    // state, not simulation — updated directly by the pointerdown handler
    // (not inside step()), read by render() to draw the live aim-preview
    // line.
    let pendingSpawnStart = null;

    // Shared by a real click AND the ball-proximity auto-trigger
    // (ballInFlickTriggerZone, checked inside updateBallAndCollision) —
    // both just start the same forward+reverse play sequence on the given
    // entity, for whichever direction it was spawned with.
    function triggerFlick(entity) {
        entity.playing = true;
        entity.playFrameIndex = 0;
        entity.playFrameAccum = 0;
        entity.playSequenceFrozen = ensureDirectionLoaded(entity.directionKey).playSequence;
    }

    // Spawns a new entity anchored at (startX,startY) — the FIRST click —
    // pointing along the line toward (endX,endY) — the SECOND click — per
    // explicit spec ("click once, defining the start point, and click
    // again, defining the end point... spawned on screen" / confirmed via
    // AskUserQuestion: the start point is the entity's fixed anchor).
    // lineAngle reuses mouseAngleFromCenter() by treating the START point
    // as the pivot and the END point as "the point whose angle we want" —
    // this is literally "the angle of end as seen from start", i.e. the
    // start->end direction, in the same 0=up/clockwise convention the
    // rest of this file already uses. Rotation is lineAngle DIRECTLY (no
    // +180, unlike the old mouse-anchored entity's own rotation formula)
    // since the entity should point THE SAME way the line points (toward
    // where the user aimed), not the opposite way (the old model pointed
    // BACK toward a fixed center from a moving mouse — a genuinely
    // different geometric relationship). Verified with the same kind of
    // concrete case the old formula was checked against: end directly
    // above start (dx=0, dy<0) -> lineAngle=0° -> rotationRad=0 -> the
    // sprite's own already-"pointing up" art needs no rotation at all to
    // point at an end point that's directly above where it's anchored —
    // correct.
    function spawnEntityFromLine(startX, startY, endX, endY) {
        const lineAngle = mouseAngleFromCenter(endX, endY, startX, startY);
        const dirIndex = directionIndexForAngle(lineAngle);
        const directionKey = DIRECTIONS[dirIndex].key;
        entities.push({
            // endX/endY (the 2nd click that originally set the aim
            // direction) are kept around, not just baked into a frozen
            // rotation value — Stop-mode's 2 draggable dots need a real
            // screen point to render/hit-test the "end" handle at, AND
            // (per explicit request) an already-placed entity's rotation
            // must keep tracking a LIVE dev-panel change to Hand Rotation
            // Offset, not just whatever offset happened to be set at spawn
            // time. See entityRotationRad() below — rotationRad is
            // deliberately NOT stored on the entity at all, only
            // recomputed from endX/endY + the CURRENT cfg offset every
            // time it's needed.
            x: startX, y: startY, endX, endY, directionKey,
            playing: false, playFrameIndex: 0, playFrameAccum: 0, playSequenceFrozen: null,
            wasInFlickTriggerZone: false, prevJointLocal: null, smoothedJointSpeed: {},
            jointWorld: null, jointSpeed: {},
        });
        ensureDirectionLoaded(directionKey);
    }

    // Recomputes an entity's current rotation LIVE from its own fixed
    // endX/endY plus the direction's CURRENT cfg.entityRotationOffsetByDirection
    // value, rather than reading a value frozen at spawn/drag time — this
    // is what makes moving the Hand Rotation Offset slider immediately
    // rotate every already-placed entity of that direction, per explicit
    // request, with no extra bookkeeping needed when the slider changes.
    function entityRotationRad(entity) {
        const lineAngle = mouseAngleFromCenter(entity.endX, entity.endY, entity.x, entity.y);
        return (lineAngle + (cfg.entityRotationOffsetByDirection[entity.directionKey] || 0)) * Math.PI / 180;
    }

    // Stop-mode entity-adjustment: hit-tests every entity's own base (x,y)
    // and end (endX,endY) dot against a click point, nearest/topmost first
    // (iterated back-to-front so a later-spawned, visually-on-top entity's
    // dot wins a tie over an earlier one sitting underneath it). A fixed
    // px hit radius (not %vmin-scaled) — this is a tap-target size, which
    // per this workspace's own dev-panel convention (CLAUDE.md §12a) is
    // exactly the kind of value that should stay a constant real-world
    // size, not one that shrinks on a small viewport.
    const ENTITY_DOT_HIT_RADIUS = 14;
    function hitTestEntityDot(x, y) {
        for (let i = entities.length - 1; i >= 0; i--) {
            const entity = entities[i];
            if (Math.hypot(x - entity.x, y - entity.y) <= ENTITY_DOT_HIT_RADIUS) return { entity, point: 'base' };
            if (Math.hypot(x - entity.endX, y - entity.endY) <= ENTITY_DOT_HIT_RADIUS) return { entity, point: 'end' };
        }
        return null;
    }

    // Delete mode's own hit-test: a click anywhere within an entity's own
    // drawn bounding box (the SAME rectangle Show Hitbox draws — transform
    // the click point into the entity's local unrotated space, same
    // rotate-by-negative-angle trick used to invert the render/collision
    // transform), not just its small anchor dot — matches "click any
    // placed entity" more literally than reusing hitTestEntityDot's tiny
    // radius would.
    function hitTestEntitySprite(x, y) {
        const vmin = Math.min(window.innerWidth, window.innerHeight);
        const size = vmin * (cfg.entityScale / 100);
        for (let i = entities.length - 1; i >= 0; i--) {
            const entity = entities[i];
            const refImg = ensureDirectionLoaded(entity.directionKey).frames[0];
            const aspect = (refImg && refImg.complete && refImg.naturalWidth > 0) ? (refImg.naturalHeight / refImg.naturalWidth) : 1;
            const drawW = size, drawH = size * aspect;
            const vb = visibleBoundsForDirection(entity.directionKey);
            const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
            const rotationRad = entityRotationRad(entity);
            const dx = x - entity.x, dy = y - entity.y;
            const cos = Math.cos(-rotationRad), sin = Math.sin(-rotationRad);
            const localX = dx * cos - dy * sin;
            const localY = dx * sin + dy * cos;
            const left = -drawW * vb.centerX + xOffsetPx, top = -drawH * vb.bottomY;
            if (localX >= left && localX <= left + drawW && localY >= top && localY <= top + drawH) return entity;
        }
        return null;
    }

    // Every click is part of a repeating 2-click cycle now (manual click-
    // to-flick is retired — see triggerFlick's own comment): the 1st click
    // anywhere records the pending start point; the 2nd click spawns a new
    // entity along that line and immediately starts listening for the
    // NEXT pair. A 2nd click landing exactly on the 1st (a degenerate,
    // zero-length line with no real angle) is ignored rather than spawning
    // a broken entity — stays in "awaiting end point" state instead of
    // silently resetting, so an accidental double-click-in-place doesn't
    // quietly eat the user's own start point.
    //
    // Gated to Stop mode only ("Animation entities can only be placed when
    // in Stop mode") — both the spawn gesture AND the base/end dot drag
    // (which also only ever renders its dots while stopped, see render()).
    canvas.addEventListener('pointerdown', (e) => {
        if (running) return;
        const x = e.clientX, y = e.clientY;

        // Delete mode takes priority over placement/dragging entirely —
        // never starts a spawn gesture or a dot drag while active.
        if (deleteMode) {
            const hitEntity = hitTestEntitySprite(x, y);
            if (hitEntity) entities = entities.filter(en => en !== hitEntity);
            return;
        }

        if (!pendingSpawnStart) {
            const hit = hitTestEntityDot(x, y);
            if (hit) {
                draggingEntity = hit.entity;
                draggingPoint = hit.point;
                return;
            }
            pendingSpawnStart = { x, y };
        } else if (Math.hypot(x - pendingSpawnStart.x, y - pendingSpawnStart.y) > 0.0001) {
            spawnEntityFromLine(pendingSpawnStart.x, pendingSpawnStart.y, x, y);
            pendingSpawnStart = null;
        }
    });

    // ----------------------------------------------------------------
    // Start/Stop — Start lets balls spawn and fall (updateBallAndCollision's
    // own `running` check, above); Stop halts that AND clears whatever
    // ball is currently on screen immediately (not just letting it finish
    // falling out the bottom on its own).
    // ----------------------------------------------------------------
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    function setRunning(next) {
        running = next;
        if (!running) {
            ball = null;
            ballRespawnCountdown = 0;
        } else {
            setDeleteMode(false); // starting has nothing to delete/place anyway
        }
        startBtn.disabled = running;
        stopBtn.disabled = !running;
        deleteBtn.disabled = running;
    }
    // Delete mode — toggled independently of Start/Stop's own running
    // state, but only meaningful while stopped (deleteBtn is disabled by
    // setRunning above the same way startBtn/stopBtn are). Turning it on
    // cancels any in-progress spawn/drag gesture so the 3 modes never mix.
    function setDeleteMode(next) {
        deleteMode = next;
        if (deleteMode) {
            pendingSpawnStart = null;
            draggingEntity = null;
            draggingPoint = null;
        }
        deleteBtn.classList.toggle('active', deleteMode);
    }
    startBtn.addEventListener('click', () => setRunning(true));
    stopBtn.addEventListener('click', () => setRunning(false));
    deleteBtn.addEventListener('click', () => setDeleteMode(!deleteMode));
    setRunning(false);

    // Fixed-timestep physics — step() always advances by exactly FIXED_DT
    // (1/60s), never the raw/jittery per-real-frame delta. Previously
    // every physics quantity here (gravity integration, position,
    // playback frame advancement, and — critically — the hand's own
    // joint velocity that sizes the ball-collision kick) was driven
    // directly by real elapsed time, which is never bit-for-bit identical
    // between 2 separate runs even with 100% identical inputs (a static
    // mouse position included) — confirmed as the actual explanation for
    // a direct report ("if i leave my mouse in one location... how come
    // the outcome of the ball's trajectory isnt identical everytime")
    // before this fix: real requestAnimationFrame timing jitters run to
    // run, and this sim's collision response is sensitive enough to that
    // jitter for it to compound into a visibly different trajectory.
    // update() (below) still runs once per real animation frame, an
    // accumulator pattern lets it run step() 0, 1, or several times to
    // catch up to real elapsed time — this is what makes 2 runs with the
    // same inputs now produce numerically identical motion after the
    // same NUMBER of steps, regardless of real frame-timing noise.
    const FIXED_DT = 1 / 60;
    const MAX_FRAME_DT = 0.25; // caps the catch-up burst after e.g. a backgrounded tab
    let accumulator = 0;
    let lastTime = performance.now();
    function step(dt) {
        // Per-entity play-sequence frame advancement — mouse-follow
        // smoothing/rotation is gone entirely (entities are fixed once
        // spawned), so this is now just the flick-playback clock plus the
        // ball/collision/trigger physics.
        entities.forEach(entity => {
            if (entity.playing && entity.playSequenceFrozen) {
                entity.playFrameAccum += dt * FLICK_BASE_FPS * cfg.clickAnimSpeed;
                entity.playFrameIndex = Math.floor(entity.playFrameAccum);
                const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, Math.round(cfg.peakHoldFrames));
                if (entity.playFrameIndex >= totalLen) {
                    entity.playing = false;
                    entity.playSequenceFrozen = null;
                    entity.playFrameIndex = 0;
                    entity.playFrameAccum = 0;
                }
            }
        });
        updateBallAndCollision(dt);
    }

    function update(now) {
        // Self-healing canvas size check. resizeCanvas() only otherwise
        // runs once at boot plus on a real 'resize' event — if
        // window.innerWidth/innerHeight read 0 at that first boot call (a
        // real, reproduced-in-this-session early-page-life quirk, same
        // class already documented in this workspace for mobile Safari/
        // Chrome, and the same root cause already fixed for mouseX above),
        // the canvas permanently sticks at 0×0 unless the
        // user happens to resize their window afterward — which, on a
        // static desktop session, most users never do. A 0×0 canvas isn't
        // just a rendering bug: `#scene.cursor-hidden{cursor:none}` (Hide
        // OS Cursor) has nothing left to apply that rule TO, since the
        // element covers zero real screen area — this is the likely root
        // cause of "hide OS cursor doesn't work" reports. Checked every
        // frame (cheap: 2 comparisons) rather than only once, so it also
        // self-heals from a real live window resize, not just the boot-
        // time case. Display sizing, not simulation — deliberately stays
        // outside the fixed-step loop below.
        const dpr = window.devicePixelRatio || 1;
        if (canvas.width !== Math.round(window.innerWidth * dpr) || canvas.height !== Math.round(window.innerHeight * dpr)) {
            resizeCanvas();
        }

        const frameDt = Math.min(MAX_FRAME_DT, (now - lastTime) / 1000);
        lastTime = now;
        accumulator += frameDt;
        while (accumulator >= FIXED_DT) {
            step(FIXED_DT);
            accumulator -= FIXED_DT;
        }

        // render() runs once per real frame regardless of how many (0 or
        // more) fixed steps just ran — every entity/ball field it reads is
        // plain current state (no per-step return value to thread through
        // anymore now that entities carry their own state), so redrawing
        // the same state on a step-less callback is harmless.
        render();
        requestAnimationFrame(update);
    }

    function render() {
        const w = window.innerWidth, h = window.innerHeight;
        ctx.fillStyle = cfg.backgroundColor;
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        if (cfg.showCenter) {
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.6;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
            ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
            ctx.stroke();
            ctx.restore();
        }

        const vmin = Math.min(w, h);
        const size = vmin * (cfg.entityScale / 100);

        // Live aim-preview while awaiting the 2nd click of a spawn — a
        // dashed line from the recorded start point to the current mouse
        // position PLUS the actual sprite that will be placed, live-
        // updating every frame from the current mouse angle (per explicit
        // request: "show the animation frame to be placed live as I drag
        // so i can see in real time what it will look like when placed").
        // Recomputes angle/direction/rotation via the EXACT SAME formula
        // spawnEntityFromLine() uses to commit the real entity (just fed
        // the live mouse position instead of a committed end point), so
        // what's previewed here is guaranteed to match what actually gets
        // placed on the 2nd click — translucent (globalAlpha) so it always
        // reads as a preview, never mistaken for an already-placed entity.
        if (pendingSpawnStart && hasMouse) {
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(pendingSpawnStart.x, pendingSpawnStart.y);
            ctx.lineTo(mouseX, mouseY);
            ctx.stroke();
            ctx.restore();
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pendingSpawnStart.x, pendingSpawnStart.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            const dist = Math.hypot(mouseX - pendingSpawnStart.x, mouseY - pendingSpawnStart.y);
            if (dist > 0.0001) {
                const previewAngle = mouseAngleFromCenter(mouseX, mouseY, pendingSpawnStart.x, pendingSpawnStart.y);
                const previewDirectionKey = DIRECTIONS[directionIndexForAngle(previewAngle)].key;
                const previewRotationRad = (previewAngle + (cfg.entityRotationOffsetByDirection[previewDirectionKey] || 0)) * Math.PI / 180;
                const previewImg = ensureDirectionLoaded(previewDirectionKey).frames[0];
                if (previewImg && previewImg.complete && previewImg.naturalWidth > 0) {
                    const previewDrawW = size, previewDrawH = size * (previewImg.naturalHeight / previewImg.naturalWidth);
                    const previewVb = visibleBoundsForDirection(previewDirectionKey);
                    const previewXOffsetPx = vmin * ((cfg.entityXOffsetByDirection[previewDirectionKey] || 0) / 100);
                    ctx.save();
                    ctx.globalAlpha = 0.5;
                    ctx.translate(pendingSpawnStart.x, pendingSpawnStart.y);
                    ctx.rotate(previewRotationRad);
                    ctx.drawImage(previewImg, -previewDrawW * previewVb.centerX + previewXOffsetPx, -previewDrawH * previewVb.bottomY, previewDrawW, previewDrawH);
                    ctx.restore();
                }
            }
        }

        entities.forEach(entity => {
            let img;
            if (entity.playing && entity.playSequenceFrozen) {
                const hold = Math.round(cfg.peakHoldFrames);
                const totalLen = playSequenceLength(DIRECTION_FRAME_COUNT, hold);
                const virtualIndex = Math.min(entity.playFrameIndex, totalLen - 1);
                img = entity.playSequenceFrozen[resolvePlaySequenceIndex(virtualIndex, DIRECTION_FRAME_COUNT, hold)];
            } else {
                img = ensureDirectionLoaded(entity.directionKey).frames[0];
            }

            let drawW = size, drawH = size;
            if (img && img.complete && img.naturalWidth > 0) {
                drawH = size * (img.naturalHeight / img.naturalWidth);
            }

            const vb = visibleBoundsForDirection(entity.directionKey);
            // Animation X Offset (cfg.entityXOffsetByDirection) — added to
            // the local x AFTER vb.centerX, BEFORE rotation, so it shifts
            // the drawn sprite/hitbox sideways relative to the entity's own
            // facing direction, matching the same offset applied to the
            // collision geometry above (updateBallAndCollision) and to the
            // trigger-zone check (ballInFlickTriggerZone) — all 3 must stay
            // in sync, same discipline as vb.centerX/bottomY.
            const xOffsetPx = vmin * ((cfg.entityXOffsetByDirection[entity.directionKey] || 0) / 100);
            ctx.save();
            ctx.translate(entity.x, entity.y);
            ctx.rotate(entityRotationRad(entity));
            // Anchored at the center-base of the VISIBLE (non-transparent)
            // content, not the raw PNG's own bottom-center — see
            // localOffsetFromNormalized()'s comment; drawImage's own
            // (dx,dy) is its TOP-LEFT corner, so -drawW*centerX/-drawH*bottomY
            // puts that exact visible-content point at the entity's own
            // origin.
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -drawW * vb.centerX + xOffsetPx, -drawH * vb.bottomY, drawW, drawH);
            }
            if (cfg.showHitbox) {
                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(-drawW * vb.centerX + xOffsetPx, -drawH * vb.bottomY, drawW, drawH);
            }
            ctx.restore();

            // Joint collision debug lines — drawn at the FIXED collision
            // thickness (Joint Collision Thickness alone — no longer speed-
            // derived, per explicit instruction: "collision circles will
            // never rescale during the animation sequence unless otherwise
            // told so by me"), matching updateBallAndCollision()'s own
            // per-segment thicknessPx exactly, so the boundary the ball
            // actually reacts to is directly visible at all times.
            if (cfg.showJointCollisionLines && entity.jointWorld) {
                ctx.save();
                ctx.strokeStyle = '#ffcf5c';
                ctx.globalAlpha = 0.55;
                ctx.lineCap = 'round';
                ctx.lineWidth = vmin * (cfg.jointThickness / 100);
                [['knuckle', 'joint1'], ['joint1', 'joint2'], ['joint2', 'tip']].forEach(([aKey, bKey]) => {
                    const a = entity.jointWorld[aKey], b = entity.jointWorld[bKey];
                    if (!a || !b) return;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                });
                ctx.restore();
            }
        });

        // Stop-mode entity-adjustment handles: 2 dots per entity (base =
        // the fixed anchor point / 1st click, end = the aim point / 2nd
        // click) plus a dashed connecting line, draggable via the
        // pointerdown/pointermove/pointerup handlers above — only shown
        // (and only hit-testable, per those handlers) while stopped, same
        // gating as the spawn-placement gesture itself.
        if (!running) {
            entities.forEach(entity => {
                ctx.save();
                ctx.strokeStyle = '#4dd2ff';
                ctx.globalAlpha = 0.7;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(entity.x, entity.y);
                ctx.lineTo(entity.endX, entity.endY);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#4dd2ff';
                ctx.beginPath();
                ctx.arc(entity.x, entity.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.fillStyle = '#ff4da6';
                ctx.beginPath();
                ctx.arc(entity.endX, entity.endY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // Ball
        if (ball) {
            const radiusPx = vmin * (cfg.ballRadius / 100);
            ctx.save();
            ctx.fillStyle = cfg.ballColor;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, radiusPx, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (cfg.showAngleDebug) {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px monospace';
            ctx.textBaseline = 'top';
            const playingCount = entities.filter(en => en.playing).length;
            ctx.fillText(`entities: ${entities.length}${playingCount ? `  (${playingCount} playing)` : ''}${pendingSpawnStart ? '  (placing...)' : ''}${draggingEntity ? '  (adjusting...)' : ''}${deleteMode ? '  (delete mode)' : ''}  [${running ? 'running' : 'stopped'}]`, 12, 12);
            ctx.restore();
        }
    }

    requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(update); });

    initDevPanelEngine();

    // One-time-per-load migration: this panel's Entity group was briefly
    // named "Hand Animation", and a separate "Mouse / Rotation" group
    // existed, before both were consolidated back into "Entity" per
    // explicit request. Anyone whose browser already saved settings
    // during that window has a sectionOrder referencing those 2 names —
    // applySectionOrder() (the generic engine, unchanged) correctly, BY
    // DESIGN, recreates any saved group it doesn't recognize as a
    // .dev-section already in the static HTML (that's what lets a real
    // user-created "+ Add Group" group survive a reload) — it has no way
    // to tell those 2 renamed-away names apart from a genuine custom
    // group, so they silently come back as empty-looking ghost groups
    // every load. Prune them here instead: move whatever rows they still
    // claim into Entity (their current code home) rather than deleting
    // them, then remove the now-empty stale section. Runs after
    // initDevPanelEngine() so it can clean up whatever that just
    // restored from localStorage; cheap and idempotent, so it's fine to
    // run on every load rather than gating it behind a one-time flag —
    // once a real Save happens post-migration, the live DOM (already
    // clean) is what gets captured, so the stale names stop reappearing
    // in localStorage too.
    (function pruneStaleDevPanelGroups() {
        const STALE_GROUP_NAMES = ['Hand Animation', 'Mouse / Rotation'];
        const entityContent = findGroupContent('desktop', 'Entity', 'pruneStaleDevPanelGroups', 'migration');
        document.querySelectorAll('#desktopTabContent > .dev-section > .dev-section-title').forEach(titleEl => {
            if (!STALE_GROUP_NAMES.includes(titleEl.dataset.sid)) return;
            const section = titleEl.parentElement;
            const content = section.querySelector(':scope > .dev-section-content');
            if (entityContent && content) {
                Array.from(content.children).forEach(row => entityContent.appendChild(row));
            }
            section.remove();
        });
    })();
</script>
</body>
</html>
