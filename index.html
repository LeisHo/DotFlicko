<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dotflicko — Directional Mouse-Follow Demo</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    #scene { position: fixed; top: 0; left: 0; display: block; }
    #scene.cursor-hidden { cursor: none; }

    /* ================================================================
       DEV PANEL — copied verbatim from J:\CLAUDE\PROJECTS\.claude\TEMPLATE_DEV_PANEL.html
       (workspace CLAUDE.md §12). No project-specific rules in this block.
       ================================================================ */
    .dev-panel {
        position: fixed;
        left: calc(var(--dev-panel-left-px, 20) * 1px);
        top: calc(var(--dev-panel-top-px, 20) * 1px);
        background: var(--dev-panel-bg-color, #000);
        opacity: var(--dev-panel-opacity, 1);
        color: #fff;
        padding: 15px;
        width: calc(var(--dev-panel-width-px, 340) * 1px);
        height: calc(var(--dev-panel-height-px, 520) * 1px);
        min-width: 160px;
        min-height: 120px;
        max-width: 92vw;
        max-height: 92vh;
        font-size: calc(var(--dev-setting-title-font-size-px, 12) * 1px);
        z-index: 99999;
        font-family: var(--dev-panel-font-family, monospace);
        border-left: 2px solid var(--dev-accent-color, #0ff);
        display: flex;
        flex-direction: column;
        resize: none;
    }
    @media (max-width: 767px) {
        .dev-panel { max-width: 85vw; max-height: 80vh; }
    }
    .dev-panel-scroll-content {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        scrollbar-color: var(--dev-accent-color, #0ff) #000;
        scrollbar-width: thin;
    }
    .dev-panel-scroll-content::-webkit-scrollbar { width: 10px; }
    .dev-panel-scroll-content::-webkit-scrollbar-track { background: #000; }
    .dev-panel-scroll-content::-webkit-scrollbar-thumb { background: var(--dev-accent-color, #0ff); border-radius: 5px; }

    .dev-panel.panel-collapsed {
        height: auto !important;
        min-height: 0;
    }
    .dev-panel.panel-collapsed .dev-header {
        padding-bottom: 0;
        margin-bottom: 0;
        align-items: center;
        position: static;
    }
    .dev-panel.panel-collapsed .dev-panel-scroll-content {
        flex: 0 1 auto;
        overflow: visible;
    }
    .dev-panel.panel-collapsed .dev-panel-scroll-content > *:not(.dev-header),
    .dev-panel.panel-collapsed .dev-panel-resize-edge,
    .dev-panel.panel-collapsed .dev-panel-resize-corner {
        display: none !important;
    }

    .dev-panel-resize-edge {
        position: absolute;
        z-index: 2;
        touch-action: none;
        -webkit-touch-callout: none;
    }
    .dev-panel-resize-edge.edge-top, .dev-panel-resize-edge.edge-bottom {
        left: 16px; right: 16px; height: 20px; cursor: ns-resize;
    }
    .dev-panel-resize-edge.edge-top { top: -6px; }
    .dev-panel-resize-edge.edge-bottom { bottom: -6px; }
    .dev-panel-resize-edge.edge-left, .dev-panel-resize-edge.edge-right {
        top: 16px; bottom: 16px; width: 20px; cursor: ew-resize;
    }
    .dev-panel-resize-edge.edge-left { left: -6px; }
    .dev-panel-resize-edge.edge-right { right: -6px; }

    .dev-panel-resize-corner {
        position: absolute;
        z-index: 3;
        width: 20px;
        height: 20px;
        touch-action: none;
        -webkit-touch-callout: none;
    }
    .dev-panel-resize-corner.corner-tl { top: -6px; left: -6px; cursor: nwse-resize; }
    .dev-panel-resize-corner.corner-tr { top: -6px; right: -6px; cursor: nesw-resize; }
    .dev-panel-resize-corner.corner-bl { bottom: -6px; left: -6px; cursor: nesw-resize; }
    .dev-panel-resize-corner.corner-br { bottom: -6px; right: -6px; cursor: nwse-resize; }

    .dev-panel-resize-corner::after {
        content: ''; position: absolute; width: 7px; height: 7px; opacity: 0.7;
    }
    .dev-panel-resize-corner.corner-tl::after { top: 8px; left: 8px; }
    .dev-panel-resize-corner.corner-tr::after { top: 8px; right: 8px; }
    .dev-panel-resize-corner.corner-bl::after { bottom: 8px; left: 8px; }
    .dev-panel-resize-corner.corner-br::after { bottom: 8px; right: 8px; }
    .dev-panel-resize-corner.corner-tl::after, .dev-panel-resize-corner.corner-br::after {
        background-image: repeating-linear-gradient(135deg, var(--dev-accent-color, #0ff) 0 2px, transparent 2px 6px);
    }
    .dev-panel-resize-corner.corner-tr::after, .dev-panel-resize-corner.corner-bl::after {
        background-image: repeating-linear-gradient(45deg, var(--dev-accent-color, #0ff) 0 2px, transparent 2px 6px);
    }
    .dev-panel-resize-edge::after {
        content: ''; position: absolute; background: var(--dev-accent-color, #0ff); opacity: 0.7; border-radius: 1px;
    }
    .dev-panel-resize-edge.edge-top::after, .dev-panel-resize-edge.edge-bottom::after {
        left: 50%; top: 50%; width: 14px; height: 3px; transform: translate(-50%, -50%);
    }
    .dev-panel-resize-edge.edge-left::after, .dev-panel-resize-edge.edge-right::after {
        left: 50%; top: 50%; width: 3px; height: 14px; transform: translate(-50%, -50%);
    }

    .dev-panel.hidden { display: none !important; }

    #desktopTabContent.hidden, #mobileTabContent.hidden, #landscapeTabContent.hidden {
        display: none !important;
    }

    .dev-header {
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        margin-bottom: 10px;
        color: #0ff;
        font-weight: bold;
        position: sticky;
        top: 0;
        background: rgba(0,0,0,0.95);
        padding-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    .dev-header.dragging { cursor: grabbing; }
    .dev-panel-title {
        font-size: calc(var(--dev-panel-title-font-size-px, 16) * 1px);
        color: var(--dev-panel-title-text-color, #fff);
    }
    .dev-header-buttons { display: flex; gap: 4px; }
    .dev-hide-btn, .dev-collapse-btn {
        background: var(--dev-accent-color, #0ff);
        color: #000;
        border: none;
        border-radius: 3px;
        width: 22px;
        min-height: calc(var(--dev-button-height-px, 22) * 1px);
        padding-top: calc(var(--dev-button-text-border-px, 0) * 1px);
        padding-bottom: calc(var(--dev-button-text-border-px, 0) * 1px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
        line-height: 1;
        letter-spacing: calc(var(--dev-button-text-letter-spacing-px, 0) * 1px);
        cursor: pointer;
        flex-shrink: 0;
    }
    .dev-hide-btn:hover, .dev-collapse-btn:hover { filter: brightness(1.3); }

    .dev-tabs { display: flex; gap: 4px; margin: 8px 0; }
    .dev-tab-btn {
        flex: 1;
        background: #222;
        color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        border-radius: 3px;
        min-height: calc(var(--dev-button-height-px, 22) * 1px);
        padding-top: calc(var(--dev-button-text-border-px, 0) * 1px);
        padding-bottom: calc(var(--dev-button-text-border-px, 0) * 1px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--dev-panel-font-family, monospace);
        font-size: calc(var(--dev-tab-font-size-px, 12) * 1px);
        font-weight: bold;
        letter-spacing: calc(var(--dev-tab-text-letter-spacing-px, 0) * 1px);
        cursor: pointer;
    }
    .dev-tab-btn.active { background: var(--dev-accent-color, #0ff); color: #000; }

    .dev-toggle-btn {
        position: fixed;
        bottom: 10px;
        right: 10px;
        z-index: 100000;
        background: var(--dev-accent-color, #0ff);
        color: #000;
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        font-family: monospace;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        opacity: 0.85;
    }
    .dev-toggle-btn:hover { opacity: 1; }

    .dev-buttons { display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
    .dev-save-sync-status { font-size: calc(var(--dev-setting-title-font-size-px, 12) * 1px); white-space: nowrap; flex-shrink: 0; }
    .dev-buttons button {
        flex: 1;
        min-height: calc(var(--dev-button-height-px, 22) * 1px);
        padding-top: calc(var(--dev-button-text-border-px, 0) * 1px);
        padding-bottom: calc(var(--dev-button-text-border-px, 0) * 1px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        background: var(--dev-accent-color, #0ff);
        color: #000;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: calc(var(--dev-button-text-letter-spacing-px, 0) * 1px);
    }
    .dev-buttons button:hover { filter: brightness(1.3); }

    .dev-section { margin-bottom: 15px; }
    .dev-section-title {
        color: var(--dev-accent-color, #0ff);
        font-weight: bold;
        font-size: calc(var(--dev-group-title-font-size-px, 13) * 1px);
        letter-spacing: calc(var(--dev-group-text-letter-spacing-px, 0) * 1px);
        margin-bottom: 8px;
        cursor: pointer;
        user-select: none;
        padding: 5px;
        background: rgba(0, 255, 255, 0.1);
        border-radius: 3px;
    }
    .dev-section-title:hover { background: rgba(0, 255, 255, 0.2); }
    .dev-section-content { display: block; margin-left: 5px; }
    .dev-section-content > .dev-section {
        padding-left: 10px;
        border-left: 2px solid rgba(0, 255, 255, 0.25);
    }
    .dev-section-content > .dev-section > .dev-section-title {
        font-size: calc(var(--dev-group-title-font-size-px, 13) * 0.85px);
    }
    .dev-section-content:empty {
        min-height: 24px;
        border: 1px dashed var(--dev-accent-color, #0ff);
        opacity: 0.5;
    }
    .dev-section-content.collapsed { display: none; }

    .dev-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .dev-label {
        min-width: 140px;
        color: var(--dev-panel-non-title-text-color, #aaa);
        font-size: calc(var(--dev-setting-title-font-size-px, 12) * 1px);
        letter-spacing: calc(var(--dev-settings-text-letter-spacing-px, 0) * 1px);
    }
    .dev-section-content .dev-label { cursor: grab; user-select: none; }
    .dev-reorder-dragging { opacity: 0.5; }

    .dev-slider {
        flex: 1;
        min-width: 130px;
        height: 18px;
        cursor: pointer;
        accent-color: var(--dev-slider-color, #3b82f6);
    }
    .dev-value { min-width: 45px; color: var(--dev-accent-color, #0ff); text-align: right; font-size: 10px; }
    .dev-value-editable { cursor: text; }
    .dev-value-editable:hover { outline: 1px solid var(--dev-accent-color, #0ff); }
    .dev-value-edit-input {
        width: 52px; background: #000; color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        font-family: var(--dev-panel-font-family, monospace);
        font-size: 10px; text-align: right; padding: 0;
    }
    .dev-text-input {
        width: 52px; background: #000; color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        font-family: var(--dev-panel-font-family, monospace);
        font-size: 11px; text-align: right; padding: 2px 4px;
    }
    .dev-text-input-wide { width: 160px; text-align: left; }
    .dev-color-picker {
        width: calc(var(--dev-setting-title-font-size-px, 12) * 5px);
        height: calc(var(--dev-setting-title-font-size-px, 12) * 3px);
        border: 1px solid var(--dev-accent-color, #0ff);
        border-radius: 3px;
        cursor: pointer;
    }
    .dev-select {
        background: #222; color: var(--dev-accent-color, #0ff);
        border: 1px solid var(--dev-accent-color, #0ff);
        padding: 4px; border-radius: 3px; cursor: pointer;
        font-family: var(--dev-panel-font-family, monospace); font-size: 10px;
    }

    .dev-panel.dev-caps-button-text .dev-buttons button,
    .dev-panel.dev-caps-button-text .dev-hide-btn,
    .dev-panel.dev-caps-button-text .dev-collapse-btn {
        text-transform: uppercase;
    }
    .dev-panel.dev-caps-tab-text .dev-tab-btn { text-transform: uppercase; }
    .dev-panel.dev-caps-group-names .dev-section-title { text-transform: uppercase; }
    .dev-panel.dev-caps-settings-text .dev-label { text-transform: uppercase; }
</style>

<body>

<canvas id="scene"></canvas>

<button class="dev-toggle-btn" id="devToggleBtn" onclick="devPanel.classList.toggle('hidden')">DEV</button>

<div class="dev-panel" id="devPanel">
    <div class="dev-panel-scroll-content">
        <div class="dev-header" id="devPanelHeader">
            <span class="dev-panel-title">DEV</span>
            <div class="dev-header-buttons">
                <button class="dev-collapse-btn" id="devCollapseBtn" onclick="toggleDevPanelCollapsed()">▁</button>
                <button class="dev-hide-btn" onclick="devPanel.classList.add('hidden')">X</button>
            </div>
        </div>

        <div class="dev-buttons">
            <button onclick="copyDevPanelSettings()">COPY</button>
            <button onclick="resetDevPanelSettings()">RESET</button>
            <button onclick="saveDevPanelSettings()">SAVE</button>
            <span class="dev-save-sync-status" id="devSaveSyncStatus"></span>
        </div>

        <div class="dev-tabs">
            <button class="dev-tab-btn active" id="devTabDesktopBtn" onclick="switchDevPanelTab('desktop')">DESKTOP</button>
            <button class="dev-tab-btn" id="devTabMobileBtn" onclick="switchDevPanelTab('mobile')">MOBILE</button>
            <button class="dev-tab-btn" id="devTabLandscapeBtn" onclick="switchDevPanelTab('landscape')">LANDSCAPE</button>
        </div>

        <div id="desktopTabContent">
            <button onclick="addDevGroup('desktop')" style="margin-bottom:10px;">+ Add Group</button>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Dev Panel">▼ Dev Panel</div>
                <div class="dev-section-content"></div>
            </div>
            <!-- PROJECT groups: rendered into by name via findGroupContent('desktop', <group>, ...) -->
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Entity">▼ Entity</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Background">▼ Background</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Ball">▼ Ball</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Collision">▼ Collision</div>
                <div class="dev-section-content"></div>
            </div>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Debug">▼ Debug</div>
                <div class="dev-section-content"></div>
            </div>
        </div>

        <div id="mobileTabContent" class="hidden">
            <button onclick="addDevGroup('mobile')" style="margin-bottom:10px;">+ Add Group</button>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Dev Panel">▼ Dev Panel</div>
                <div class="dev-section-content"></div>
            </div>
        </div>

        <div id="landscapeTabContent" class="hidden">
            <button onclick="addDevGroup('landscape')" style="margin-bottom:10px;">+ Add Group</button>
            <div class="dev-section">
                <div class="dev-section-title" onclick="toggleSection(this)" data-sid="Dev Panel">▼ Dev Panel</div>
                <div class="dev-section-content"></div>
            </div>
        </div>
    </div>

    <div class="dev-panel-resize-edge edge-top" id="devPanelResizeTop"></div>
    <div class="dev-panel-resize-edge edge-bottom" id="devPanelResizeBottom"></div>
    <div class="dev-panel-resize-edge edge-left" id="devPanelResizeLeft"></div>
    <div class="dev-panel-resize-edge edge-right" id="devPanelResizeRight"></div>
    <div class="dev-panel-resize-corner corner-tl" id="devPanelResizeTL"></div>
    <div class="dev-panel-resize-corner corner-tr" id="devPanelResizeTR"></div>
    <div class="dev-panel-resize-corner corner-bl" id="devPanelResizeBL"></div>
    <div class="dev-panel-resize-corner corner-br" id="devPanelResizeBR"></div>
</div>

<script>
    // ================================================================
    // DEV PANEL ENGINE — copied verbatim from TEMPLATE_DEV_PANEL.html.
    // Generic, no project-specific names. Project code starts at the
    // "FLICK DEMO" banner below.
    // ================================================================

    const devPanel = document.getElementById('devPanel');
    const DEV_PANEL_TABS = ['desktop', 'mobile', 'landscape'];
    function isNarrowViewport() { return window.innerWidth < 768; }

    function toggleSection(titleEl) {
        if (sectionJustDragged) { sectionJustDragged = false; return; }
        if (textEditModeEnabled) { openDevTextEditFor(titleEl, getSectionKey(titleEl), true); return; }
        const content = titleEl.nextElementSibling;
        content.classList.toggle('collapsed');
        titleEl.textContent = content.classList.contains('collapsed') ? '▶ ' + titleEl.textContent.slice(2) : '▼ ' + titleEl.textContent.slice(2);
    }

    function createDevGroupElement(name) {
        const section = document.createElement('div');
        section.className = 'dev-section';
        const title = document.createElement('div');
        title.className = 'dev-section-title';
        title.setAttribute('onclick', 'toggleSection(this)');
        title.dataset.sid = name;
        title.textContent = '▼ ' + name;
        const content = document.createElement('div');
        content.className = 'dev-section-content';
        section.appendChild(title);
        section.appendChild(content);
        return section;
    }

    function addDevGroup(tab) {
        const tabEl = document.getElementById(tab + 'TabContent');
        const existingNames = new Set(
            Array.from(tabEl.querySelectorAll('.dev-section > .dev-section-title')).map(t => t.dataset.sid)
        );
        let name = 'New Group';
        let n = 2;
        while (existingNames.has(name)) { name = 'New Group (' + n + ')'; n++; }
        const section = createDevGroupElement(name);
        tabEl.appendChild(section);
        section.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    let sectionJustDragged = false;
    function setupDragReorder(handleSelector, itemSelector, onDrop, crossContainerSelector) {
        let dragging = null;
        let startY = 0;
        let moved = false;
        const THRESHOLD = 8;
        const TOUCH_HOLD_MS = 1000;
        const TOUCH_HOLD_MOVE_TOLERANCE = 10;
        let pendingTouch = null;

        function cancelPendingTouch() {
            if (pendingTouch) { clearTimeout(pendingTouch.timerId); pendingTouch = null; }
        }

        document.addEventListener('pointerdown', (e) => {
            const handle = e.target.closest(handleSelector);
            if (!handle) return;
            const item = handle.closest(itemSelector);
            if (!item) return;

            if (e.pointerType === 'touch') {
                const startX0 = e.clientX, startY0 = e.clientY, pointerId = e.pointerId;
                cancelPendingTouch();
                pendingTouch = {
                    item, startX: startX0, startY: startY0, pointerId,
                    timerId: setTimeout(() => {
                        if (!pendingTouch || pendingTouch.pointerId !== pointerId) return;
                        pendingTouch = null;
                        dragging = item;
                        startY = startY0;
                        moved = true;
                        dragging.classList.add('dev-reorder-dragging');
                    }, TOUCH_HOLD_MS),
                };
                return;
            }

            dragging = item;
            startY = e.clientY;
            moved = false;
        });

        document.addEventListener('pointermove', (e) => {
            if (pendingTouch && e.pointerId === pendingTouch.pointerId) {
                const dist = Math.hypot(e.clientX - pendingTouch.startX, e.clientY - pendingTouch.startY);
                if (dist > TOUCH_HOLD_MOVE_TOLERANCE) cancelPendingTouch();
                return;
            }
            if (!dragging) return;
            if (!moved && Math.abs(e.clientY - startY) > THRESHOLD) {
                moved = true;
                dragging.classList.add('dev-reorder-dragging');
            }
            if (!moved) return;
            e.preventDefault();
            if (crossContainerSelector) {
                const tabRoot = dragging.closest(DEV_PANEL_TABS.map(t => '#' + t + 'TabContent').join(', '));
                const containers = typeof crossContainerSelector === 'function'
                    ? crossContainerSelector(tabRoot, dragging)
                    : Array.from(tabRoot.querySelectorAll(crossContainerSelector));
                let targetContainer = containers.find(c => {
                    const r = c.getBoundingClientRect();
                    return e.clientY >= r.top && e.clientY <= r.bottom;
                });
                if (!targetContainer) {
                    let minDist = Infinity;
                    containers.forEach(c => {
                        const r = c.getBoundingClientRect();
                        const dist = Math.abs(e.clientY - (r.top + r.height / 2));
                        if (dist < minDist) { minDist = dist; targetContainer = c; }
                    });
                }
                if (!targetContainer) return;
                const targetSiblings = Array.from(targetContainer.querySelectorAll(':scope > ' + itemSelector)).filter(el => el !== dragging);
                const before = targetSiblings.find(sib => e.clientY < sib.getBoundingClientRect().top + sib.getBoundingClientRect().height / 2);
                if (before) targetContainer.insertBefore(dragging, before);
                else targetContainer.appendChild(dragging);
                return;
            }
            const siblings = Array.from(dragging.parentElement.querySelectorAll(':scope > ' + itemSelector)).filter(el => el !== dragging);
            for (const sib of siblings) {
                const rect = sib.getBoundingClientRect();
                const mid = rect.top + rect.height / 2;
                const draggingIsBefore = !!(dragging.compareDocumentPosition(sib) & Node.DOCUMENT_POSITION_FOLLOWING);
                if (e.clientY < mid && !draggingIsBefore) { sib.parentElement.insertBefore(dragging, sib); break; }
                else if (e.clientY >= mid && draggingIsBefore) { sib.parentElement.insertBefore(dragging, sib.nextSibling); break; }
            }
        }, { passive: false });

        document.addEventListener('pointerup', (e) => {
            if (pendingTouch && e.pointerId === pendingTouch.pointerId) cancelPendingTouch();
            if (!dragging) return;
            dragging.classList.remove('dev-reorder-dragging');
            if (moved) { sectionJustDragged = true; if (onDrop) onDrop(); }
            dragging = null;
            moved = false;
        });
        document.addEventListener('pointercancel', (e) => {
            if (pendingTouch && e.pointerId === pendingTouch.pointerId) cancelPendingTouch();
            if (!dragging) return;
            dragging.classList.remove('dev-reorder-dragging');
            dragging = null;
            moved = false;
        });
    }

    function getSectionKey(titleEl) {
        const tab = DEV_PANEL_TABS.find(t => titleEl.closest('#' + t + 'TabContent')) || DEV_PANEL_TABS[0];
        return tab + ':' + (titleEl.dataset.sid || titleEl.textContent.replace(/^[▼▶]\s*/, ''));
    }
    function captureSectionCollapseState() {
        const state = {};
        document.querySelectorAll('.dev-section-title').forEach(titleEl => {
            state[getSectionKey(titleEl)] = titleEl.nextElementSibling.classList.contains('collapsed');
        });
        return state;
    }
    function applySectionCollapseState(state) {
        if (!state) return;
        document.querySelectorAll('.dev-section-title').forEach(titleEl => {
            const key = getSectionKey(titleEl);
            if (!(key in state)) return;
            const shouldCollapse = !!state[key];
            const content = titleEl.nextElementSibling;
            if (content.classList.contains('collapsed') !== shouldCollapse) {
                content.classList.toggle('collapsed');
                titleEl.textContent = content.classList.contains('collapsed') ? '▶ ' + titleEl.textContent.slice(2) : '▼ ' + titleEl.textContent.slice(2);
            }
        });
    }
    function getRowKey(row, fallbackIndex) {
        const idEl = row.querySelector('[id]');
        return idEl ? idEl.id : ('__row' + fallbackIndex);
    }
    function captureSection(sec) {
        const titleEl = sec.querySelector(':scope > .dev-section-title');
        const content = sec.querySelector(':scope > .dev-section-content');
        const rows = Array.from(content.querySelectorAll(':scope > .dev-row'));
        const subSections = Array.from(content.querySelectorAll(':scope > .dev-section'));
        return {
            key: getSectionKey(titleEl),
            rowKeys: rows.map((row, i) => getRowKey(row, i)),
            subgroups: subSections.map(sub => captureSection(sub)),
        };
    }
    function captureSectionOrder() {
        const result = {};
        DEV_PANEL_TABS.forEach(tab => {
            const tabId = tab + 'TabContent';
            const tabEl = document.getElementById(tabId);
            if (!tabEl) return;
            const sections = Array.from(tabEl.querySelectorAll(':scope > .dev-section'));
            result[tabId] = sections.map(sec => captureSection(sec));
        });
        return result;
    }
    function applySectionOrder(order) {
        if (!order) return;
        DEV_PANEL_TABS.forEach(tab => {
            const tabId = tab + 'TabContent';
            const tabEl = document.getElementById(tabId);
            const savedSections = order[tabId];
            if (!tabEl || !savedSections) return;
            const sectionsByKey = {};
            tabEl.querySelectorAll('.dev-section').forEach(sec => {
                sectionsByKey[getSectionKey(sec.querySelector(':scope > .dev-section-title'))] = sec;
            });
            const rowsByKey = {};
            tabEl.querySelectorAll('.dev-section-content > .dev-row').forEach((row, i) => {
                rowsByKey[getRowKey(row, i)] = row;
            });
            function placeSection(savedSec, parentContainer) {
                let sec = sectionsByKey[savedSec.key];
                if (!sec) {
                    const name = savedSec.key.split('>').pop().replace(new RegExp('^(' + DEV_PANEL_TABS.join('|') + '):'), '');
                    sec = createDevGroupElement(name);
                    sectionsByKey[savedSec.key] = sec;
                }
                parentContainer.appendChild(sec);
                const content = sec.querySelector(':scope > .dev-section-content');
                (savedSec.rowKeys || []).forEach(rowKey => {
                    const row = rowsByKey[rowKey];
                    if (row) content.appendChild(row);
                });
                (savedSec.subgroups || []).forEach(sub => placeSection(sub, content));
            }
            savedSections.forEach(savedSec => placeSection(savedSec, tabEl));
        });
    }

    function syncTabOrderToDesktop(targetTab) {
        if (targetTab === 'desktop') return;
        const desktopOrder = captureSectionOrder().desktopTabContent;
        const targetTabId = targetTab + 'TabContent';
        const targetTabEl = document.getElementById(targetTabId);
        if (!desktopOrder || !targetTabEl) return;

        const targetRowByDesktopId = {};
        targetTabEl.querySelectorAll('.dev-row [id]').forEach(idEl => {
            targetRowByDesktopId[resolveDevControlId(idEl.id).desktopId] = idEl.id;
        });
        const placedRowIds = new Set();

        function translateGroup(savedGroup) {
            const sid = savedGroup.key.slice(savedGroup.key.indexOf(':') + 1);
            const rowKeys = [];
            savedGroup.rowKeys.forEach(desktopRowKey => {
                const targetId = targetRowByDesktopId[desktopRowKey];
                if (!targetId) return;
                rowKeys.push(targetId);
                placedRowIds.add(targetId);
            });
            return { key: targetTab + ':' + sid, rowKeys, subgroups: (savedGroup.subgroups || []).map(translateGroup) };
        }
        const translated = desktopOrder.map(translateGroup);

        function findByKey(groups, key) {
            for (const g of groups) {
                if (g.key === key) return g;
                const found = findByKey(g.subgroups || [], key);
                if (found) return found;
            }
            return null;
        }
        targetTabEl.querySelectorAll('.dev-row [id]').forEach(idEl => {
            if (placedRowIds.has(idEl.id)) return;
            const sec = idEl.closest('.dev-section');
            if (!sec) return;
            const key = getSectionKey(sec.querySelector(':scope > .dev-section-title'));
            const group = findByKey(translated, key);
            if (group) group.rowKeys.push(idEl.id);
        });

        function collectKeys(groups, out) {
            groups.forEach(g => { out.add(g.key); collectKeys(g.subgroups || [], out); });
            return out;
        }
        const translatedKeys = collectKeys(translated, new Set());
        targetTabEl.querySelectorAll(':scope > .dev-section').forEach(sec => {
            const key = getSectionKey(sec.querySelector(':scope > .dev-section-title'));
            if (!translatedKeys.has(key)) translated.push(captureSection(sec));
        });

        applySectionOrder({ [targetTabId]: translated });
    }

    function resolveDevControlId(id) {
        const m = id.match(/^(slider|color|select|checkbox)(Mobile|Landscape)(.+)$/);
        if (m) return { device: m[2] === 'Landscape' ? 'landscape' : 'mobile', desktopId: m[1] + m[3] };
        return { device: 'desktop', desktopId: id };
    }

    function findGroupContent(tabId, groupSid, callerName, ctrlId) {
        const matches = document.querySelectorAll('#' + tabId + 'TabContent > .dev-section > .dev-section-title[data-sid="' + groupSid.replace(/"/g, '\\"') + '"]');
        if (matches.length === 0) {
            console.warn(callerName + ': group not found', groupSid, ctrlId);
            return null;
        }
        if (matches.length > 1) {
            console.warn(callerName + ': ' + matches.length + ' groups share this data-sid (using the first) - a rename/duplication collision', groupSid, ctrlId);
        }
        return matches[0].nextElementSibling;
    }

    const DEV_PANEL_REGISTERED_ARRAYS = [];
    function registerDevControlArray(name, array) {
        DEV_PANEL_REGISTERED_ARRAYS.push({ name, array });
    }

    let devControlIdValidator = null;
    function registerDevControlIdValidator(fn) { devControlIdValidator = fn; }
    function validateDevControlMappings() {
        if (!devControlIdValidator) return 0;
        let badCount = 0;
        DEV_PANEL_REGISTERED_ARRAYS.forEach(({ name, array }) => {
            array.forEach(ctrl => {
                const result = devControlIdValidator(ctrl);
                if (result !== true) {
                    console.error('validateDevControlMappings: ' + (typeof result === 'string' ? result : 'unmapped id'), name, ctrl.id);
                    badCount++;
                }
            });
        });
        if (badCount > 0) console.error('validateDevControlMappings: ' + badCount + ' control(s) failed validation - see errors above.');
        return badCount;
    }

    function assertDevControlsRendered() {
        let missing = 0;
        DEV_PANEL_REGISTERED_ARRAYS.forEach(({ array }) => {
            array.forEach(ctrl => { if (!document.getElementById(ctrl.id)) missing++; });
        });
        if (missing > 0) {
            console.error('assertDevControlsRendered: ' + missing + ' generated control(s) missing from the DOM at setup time - a render call may be missing, misordered, or its group lookup failed (see findGroupContent warnings above).');
        }
        return missing;
    }

    let devSliderValueResolver = null;
    let devColorValueResolver = null;
    function registerDevValueResolvers({ slider, color }) {
        if (slider) devSliderValueResolver = slider;
        if (color) devColorValueResolver = color;
    }
    function syncSlidersFromState() {
        if (!devSliderValueResolver) return;
        document.querySelectorAll('.dev-slider').forEach(el => {
            const value = devSliderValueResolver(el.id);
            if (value === undefined) return;
            if (typeof value === 'number') {
                const min = parseFloat(el.min), max = parseFloat(el.max);
                if (!isNaN(max) && value > max) el.max = String(value + Math.abs(value) * 0.2);
                if (!isNaN(min) && value < min) el.min = String(value - Math.abs(value) * 0.2);
            }
            el.value = value;
            el.dispatchEvent(new Event('input', { bubbles: true }));
        });
    }
    function syncColorPickersFromState() {
        if (!devColorValueResolver) return;
        document.querySelectorAll('.dev-color-picker').forEach(el => {
            const value = devColorValueResolver(el.id);
            if (value !== undefined) { el.value = value; el.dispatchEvent(new Event('input', { bubbles: true })); }
        });
    }

    function makeDevValuesEditable() {
        document.querySelectorAll('.dev-value[id]').forEach(valueEl => {
            const sliderId = valueEl.id.replace(/^value/, 'slider');
            const slider = document.getElementById(sliderId);
            if (!slider || slider.type !== 'range') return;
            valueEl.classList.add('dev-value-editable');
        });

        document.addEventListener('click', (e) => {
            const valueEl = e.target.closest('.dev-value-editable');
            if (!valueEl || valueEl.querySelector('input')) return;
            const slider = document.getElementById(valueEl.id.replace(/^value/, 'slider'));
            if (!slider) return;

            const originalText = valueEl.textContent;
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'dev-value-edit-input';
            input.value = slider.value;
            valueEl.textContent = '';
            valueEl.appendChild(input);
            input.focus();
            input.select();

            let settled = false;
            function commit() {
                if (settled) return;
                settled = true;
                let val = parseFloat(input.value);
                if (isNaN(val)) val = parseFloat(slider.value);
                const min = parseFloat(slider.min), max = parseFloat(slider.max);
                if (val > max) slider.max = String(val + Math.abs(val) * 0.2);
                if (val < min) slider.min = String(val - Math.abs(val) * 0.2);
                slider.value = val;
                input.remove();
                slider.dispatchEvent(new Event('input', { bubbles: true }));
            }
            function cancel() {
                if (settled) return;
                settled = true;
                valueEl.textContent = originalText;
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter') input.blur();
                else if (ev.key === 'Escape') cancel();
            });
            input.addEventListener('click', (ev) => ev.stopPropagation());
        });
    }

    let textEditModeEnabled = false;
    let devTextOverrides = {};
    const devTextOriginals = {};
    function getDevLabelKey(labelEl) {
        const row = labelEl.closest('.dev-row');
        const control = row ? row.querySelector('[id]') : null;
        return control ? control.id : null;
    }
    function devTextOriginalFor(key, currentText) {
        if (!(key in devTextOriginals)) devTextOriginals[key] = currentText;
        return devTextOriginals[key];
    }
    function applyDevTextOverrides() {
        document.querySelectorAll('.dev-section-title').forEach(titleEl => {
            const key = getSectionKey(titleEl);
            const arrow = titleEl.textContent.slice(0, 2);
            const original = devTextOriginalFor(key, titleEl.textContent.slice(2));
            titleEl.textContent = arrow + (devTextOverrides[key] != null ? devTextOverrides[key] : original);
        });
        document.querySelectorAll('.dev-label').forEach(labelEl => {
            const key = getDevLabelKey(labelEl);
            if (!key) return;
            const original = devTextOriginalFor(key, labelEl.textContent);
            labelEl.textContent = devTextOverrides[key] != null ? devTextOverrides[key] : original;
        });
    }
    function openDevTextEditFor(el, key, isTitle) {
        if (!key || el.querySelector('textarea')) return;
        const arrow = isTitle ? el.textContent.slice(0, 2) : '';
        const original = devTextOriginalFor(key, isTitle ? el.textContent.slice(2) : el.textContent);
        const currentValue = devTextOverrides[key] != null ? devTextOverrides[key] : original;
        const originalHTML = el.innerHTML;
        const input = document.createElement('textarea');
        input.rows = 1;
        input.value = currentValue;
        el.textContent = '';
        if (isTitle) el.appendChild(document.createTextNode(arrow));
        el.appendChild(input);
        input.focus();
        input.select();
        input.addEventListener('pointerdown', (ev) => ev.stopPropagation());
        input.addEventListener('click', (ev) => ev.stopPropagation());
        let settled = false;
        function commit() {
            if (settled) return;
            settled = true;
            const typed = input.value;
            devTextOverrides[key] = (typed === '' || typed === original) ? null : typed;
            el.textContent = arrow + (devTextOverrides[key] != null ? devTextOverrides[key] : original);
        }
        function cancel() {
            if (settled) return;
            settled = true;
            el.innerHTML = originalHTML;
        }
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); input.blur(); }
            else if (ev.key === 'Escape') cancel();
        });
    }
    function setupDevPanelTextEdit() {
        devPanel.addEventListener('click', (e) => {

        }, true);
    }

    const DEV_PANEL_LAYOUT = { left: 20, top: 20, width: 340, height: 520 };
    const DEV_PANEL_HANDLE_OVERHANG_PX = 6;
    const DEV_PANEL_MOBILE_EDGE_GESTURE_MARGIN_PX = 20;
    function devPanelEdgeMarginX() {
        return DEV_PANEL_HANDLE_OVERHANG_PX + (isNarrowViewport() ? DEV_PANEL_MOBILE_EDGE_GESTURE_MARGIN_PX : 0);
    }
    function setDevPanelLayoutVar(key, cssVarName, value) {
        DEV_PANEL_LAYOUT[key] = value;
        document.documentElement.style.setProperty(cssVarName, value);
    }
    function applyDevPanelLayout() {
        document.documentElement.style.setProperty('--dev-panel-left-px', DEV_PANEL_LAYOUT.left);
        document.documentElement.style.setProperty('--dev-panel-top-px', DEV_PANEL_LAYOUT.top);
        document.documentElement.style.setProperty('--dev-panel-width-px', DEV_PANEL_LAYOUT.width);
        document.documentElement.style.setProperty('--dev-panel-height-px', DEV_PANEL_LAYOUT.height);
    }
    function clampDevPanelPosition() {
        const rect = devPanel.getBoundingClientRect();
        if (rect.width === 0 && rect.height === 0) return;
        const o = DEV_PANEL_HANDLE_OVERHANG_PX;
        const ox = devPanelEdgeMarginX();
        const maxLeft = Math.max(ox, window.innerWidth - rect.width - ox);
        const maxTop = Math.max(o, window.innerHeight - rect.height - o);
        const clampedLeft = Math.min(Math.max(ox, DEV_PANEL_LAYOUT.left), maxLeft);
        const clampedTop = Math.min(Math.max(o, DEV_PANEL_LAYOUT.top), maxTop);
        if (clampedLeft !== DEV_PANEL_LAYOUT.left) setDevPanelLayoutVar('left', '--dev-panel-left-px', clampedLeft);
        if (clampedTop !== DEV_PANEL_LAYOUT.top) setDevPanelLayoutVar('top', '--dev-panel-top-px', clampedTop);
    }

    const devPanelHeader = document.getElementById('devPanelHeader');
    let isDraggingDevPanel = false;
    let devPanelDragStart = { pointerX: 0, pointerY: 0, panelLeft: 0, panelTop: 0 };
    devPanelHeader.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        e.preventDefault();
        const rect = devPanel.getBoundingClientRect();
        devPanelDragStart = { pointerX: e.clientX, pointerY: e.clientY, panelLeft: rect.left, panelTop: rect.top };
        isDraggingDevPanel = true;
        devPanelHeader.classList.add('dragging');
        try { devPanelHeader.setPointerCapture(e.pointerId); } catch (err) { /* best-effort only */ }
    });
    document.addEventListener('pointermove', (e) => {
        if (!isDraggingDevPanel) return;
        if (e.buttons === 0) { endDevPanelDrag(e); return; }
        const dx = e.clientX - devPanelDragStart.pointerX;
        const dy = e.clientY - devPanelDragStart.pointerY;
        const panelRect = devPanel.getBoundingClientRect();
        const o = DEV_PANEL_HANDLE_OVERHANG_PX;
        const ox = devPanelEdgeMarginX();
        const newLeft = Math.max(ox, Math.min(window.innerWidth - panelRect.width - ox, devPanelDragStart.panelLeft + dx));
        const newTop = Math.max(o, Math.min(window.innerHeight - panelRect.height - o, devPanelDragStart.panelTop + dy));
        setDevPanelLayoutVar('left', '--dev-panel-left-px', Math.round(newLeft));
        setDevPanelLayoutVar('top', '--dev-panel-top-px', Math.round(newTop));
    });
    function endDevPanelDrag(e) {
        if (!isDraggingDevPanel) return;
        isDraggingDevPanel = false;
        devPanelHeader.classList.remove('dragging');
        if (e && e.pointerId !== undefined && devPanelHeader.hasPointerCapture(e.pointerId)) {
            devPanelHeader.releasePointerCapture(e.pointerId);
        }
    }
    document.addEventListener('pointerup', endDevPanelDrag);
    document.addEventListener('pointercancel', endDevPanelDrag);
    devPanelHeader.addEventListener('lostpointercapture', endDevPanelDrag);

    function toggleDevPanelCollapsed() {
        const collapsed = devPanel.classList.toggle('panel-collapsed');
        document.getElementById('devCollapseBtn').textContent = collapsed ? '▢' : '▁';
        if (collapsed) {
            const headerHeight = devPanelHeader.getBoundingClientRect().height;
            const panelPadding = parseFloat(getComputedStyle(devPanel).paddingTop) + parseFloat(getComputedStyle(devPanel).paddingBottom);
            devPanel.style.setProperty('height', (headerHeight + panelPadding) + 'px', 'important');
        } else {
            devPanel.style.removeProperty('height');
        }
    }

    function setupPanelResizeHandle(panel, handle, xEdge, yEdge) {
        let dragging = false;
        let start = { pointerX: 0, pointerY: 0, left: 0, top: 0, width: 0, height: 0 };

        handle.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const rect = panel.getBoundingClientRect();
            start = { pointerX: e.clientX, pointerY: e.clientY, left: rect.left, top: rect.top, width: rect.width, height: rect.height };
            dragging = true;
            try { handle.setPointerCapture(e.pointerId); } catch (err) { /* best-effort only */ }
        });

        document.addEventListener('pointermove', (e) => {
            if (!dragging) return;
            if (e.buttons === 0) { end(e); return; }
            const cs = getComputedStyle(panel);
            const minW = parseFloat(cs.minWidth) || 0, maxW = parseFloat(cs.maxWidth) || Infinity;
            const minH = parseFloat(cs.minHeight) || 0, maxH = parseFloat(cs.maxHeight) || Infinity;
            const dx = e.clientX - start.pointerX;
            const dy = e.clientY - start.pointerY;

            let newWidth = start.width, newLeft = start.left;
            if (xEdge === 'right') {
                newWidth = Math.max(minW, Math.min(maxW, start.width + dx));
                const maxWidthFromEdge = window.innerWidth - start.left - devPanelEdgeMarginX();
                newWidth = Math.min(newWidth, Math.max(minW, maxWidthFromEdge));
            } else if (xEdge === 'left') {
                newWidth = Math.max(minW, Math.min(maxW, start.width - dx));
                newLeft = start.left + (start.width - newWidth);
                const clampedLeft = Math.max(devPanelEdgeMarginX(), newLeft);
                if (clampedLeft !== newLeft) { newWidth = newWidth - (clampedLeft - newLeft); newLeft = clampedLeft; }
            }
            let newHeight = start.height, newTop = start.top;
            if (yEdge === 'bottom') {
                newHeight = Math.max(minH, Math.min(maxH, start.height + dy));
            } else if (yEdge === 'top') {
                newHeight = Math.max(minH, Math.min(maxH, start.height - dy));
                newTop = start.top + (start.height - newHeight);
                const clampedTop = Math.max(DEV_PANEL_HANDLE_OVERHANG_PX, newTop);
                if (clampedTop !== newTop) { newHeight = newHeight - (clampedTop - newTop); newTop = clampedTop; }
            }

            panel.style.width = newWidth + 'px';
            panel.style.height = newHeight + 'px';
            if (xEdge === 'left') setDevPanelLayoutVar('left', '--dev-panel-left-px', Math.round(newLeft));
            if (yEdge === 'top') setDevPanelLayoutVar('top', '--dev-panel-top-px', Math.round(newTop));
        });

        function end(e) {

            let depth = 0;
            let cur = contentEl.parentElement;
            while (cur && cur !== tabRoot) {
                if (cur.classList.contains('dev-section')) depth++;
                cur = cur.parentElement;
            }
            return depth;
        }
        setupDragReorder('.dev-section-title', '.dev-section', () => {}, (tabRoot, dragging) => {
            const groupContents = Array.from(tabRoot.querySelectorAll('.dev-section > .dev-section-content'))
                .filter(content => !dragging.contains(content));
            groupContents.sort((a, b) => devGroupNestingDepth(b, tabRoot) - devGroupNestingDepth(a, tabRoot));
            return [...groupContents, tabRoot];
        });
        setupDragReorder('.dev-label', '.dev-row', () => {}, (tabRoot, dragging) => {
            const groupContents = Array.from(tabRoot.querySelectorAll('.dev-section-content'));
            groupContents.sort((a, b) => devGroupNestingDepth(b, tabRoot) - devGroupNestingDepth(a, tabRoot));
            return groupContents;

            for (const entry of entries) {

                if (w > 0 && h > 0) { DEV_PANEL_LAYOUT.width = w; DEV_PANEL_LAYOUT.height = h; }

    // (001-020), .png (not converted to webp — files are already small,

    // oversized PNGs hit).

        { key: 'behind',       folder: 'BEHIND',        prefix: '2T -Flabbehind',  label: 'Behind' },
        { key: 'behind-thumb', folder: 'BEHIND THUMB',  prefix: '2T -BehindThumb', label: 'Behind Thumb' },

    // forward+reverse array, still shared/cached per direction regardless
    // of the live slider value) but resolved here so a live change to the
    // slider takes effect immediately, including mid-playback.
    function playSequenceLength(n, hold) {
        return (2 * n - 1) + hold;
    }
    function resolvePlaySequenceIndex(virtualIndex, n, hold) {
        if (virtualIndex < n) return virtualIndex;
        if (virtualIndex < n + hold) return n - 1;
        return virtualIndex - hold;

    // visits get fetched) rather than eagerly preloading all 8*20 = 160
    // frames on page load.

    // load (onerror, or settling at complete+naturalWidth===0 with no
    // error event at all - both observed against this exact asset set)
    // before being left alone - a transient hiccup shouldn't permanently
    // blank the entity out for the rest of the session.
    const IMG_LOAD_MAX_RETRIES = 3;
    const IMG_LOAD_RETRY_DELAY_MS = 400;
    function loadImageWithRetry(src) {
        const img = new Image();
        let retriesLeft = IMG_LOAD_MAX_RETRIES;
        function attempt() {
            img.src = src + (retriesLeft < IMG_LOAD_MAX_RETRIES ? ('?retry=' + (IMG_LOAD_MAX_RETRIES - retriesLeft)) : '');
        }
        img.addEventListener('error', () => {
            if (retriesLeft > 0) { retriesLeft--; setTimeout(attempt, IMG_LOAD_RETRY_DELAY_MS); }
        });
        img.addEventListener('load', () => {
            if (img.naturalWidth === 0 && retriesLeft > 0) { retriesLeft--; setTimeout(attempt, IMG_LOAD_RETRY_DELAY_MS); }

        attempt();
        return img;

        const keys = Object.keys(dirFrames).map(Number).sort((a, b) => a - b);

            if (k >= frameNumber && after === null) after = k;
